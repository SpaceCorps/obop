# cargo-nextest settings for obop (docs/ENGINEERING.md). Run the Rust tests with
#   cargo nextest run --locked --workspace        (local, profile "default")
#   cargo nextest run --locked --profile ci        (CI)
# and the doc-tests, which nextest does not run, with `cargo test --locked --doc`.
#
# Every key below exists in the oldest nextest the file accepts (`nextest-version`): `flaky-result`
# came with 0.9.131. CI installs the pinned release (docs/ENGINEERING.md 2.3); a PC may run a
# newer one.
nextest-version = "0.9.131"

# nextest runs every test in a process of its own. A lock that a test file keeps in a `static`
# to make its tests take turns (cargo test runs them as threads of one process) therefore takes
# nobody's turn, and a group with one thread at a time does. The 15 tests of obop-storage that call
# `serial()` in pg_pool_tests.rs measure time or fill the connection pool of a real PostgreSQL
# (they run only with OBOP_TEST_POSTGRES_URL); a new test that calls `serial()` is added here.
[test-groups]
pg-pool-turns = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
package(obop-storage) & (
  test(=pg_pool_tests::a_five_second_read_does_not_block_a_concurrent_get)
  | test(=pg_pool_tests::a_streaming_scan_holds_one_connection_and_nothing_else)
  | test(=pg_pool_tests::two_hundred_requests_on_a_pool_of_eight_refuse_the_surplus_within_the_acquire_timeout)
  | test(=pg_pool_tests::a_full_queue_refuses_without_waiting_and_parks_no_more_than_its_bound)
  | test(=pg_pool_tests::the_lock_pool_does_not_take_interactive_capacity_and_the_other_way_round)
  | test(=pg_pool_tests::nested_locks_of_one_thread_share_a_connection_so_a_small_lock_pool_cannot_deadlock)
  | test(=pg_pool_tests::batches_that_name_the_same_records_in_opposite_order_do_not_deadlock)
  | test(=pg_pool_tests::a_bulk_write_makes_the_small_writes_and_reads_of_its_process_wait_and_never_busy)
  | test(=pg_pool_tests::thousand_row_batches_from_many_threads_do_not_fill_the_servers_lock_table)
  | test(=pg_pool_tests::large_batches_that_name_the_same_records_in_opposite_order_do_not_deadlock)
  | test(=pg_pool_tests::a_statement_over_its_limit_is_cancelled_and_the_connection_stays_in_the_pool)
  | test(=pg_pool_tests::a_slow_consumer_is_not_cut_off_by_the_statement_limit_but_a_stalled_one_is_ended)
  | test(=pg_pool_tests::after_a_server_restart_the_pool_serves_again_without_restarting_the_process)
  | test(=pg_pool_tests::behind_pgbouncer_in_transaction_mode_everything_works_with_locks_on_a_direct_address)
  | test(=pg_pool_tests::pgbouncer_without_protocol_level_prepared_statements_works_too)
)
'''
test-group = "pg-pool-turns"

[profile.default]
# No retry: a test that fails once fails the run, and the output says which one.
retries = 0

# CI. A test that fails and passes on its retry is FLAKY, and a flaky test fails the run
# (`flaky-result = "fail"`): the log names it in the final summary (`final-status-level` shows
# "flaky" by default) and the job is red. A pass on retry is not green here, it is a bug to fix
# (Pavel's rule: a flaky test is fixed, not hidden). The retry is only what makes nextest able to
# tell "flaky" from "failed".
[profile.ci]
retries = 1
flaky-result = "fail"
# Report every failure of the run, not only the first.
fail-fast = false
