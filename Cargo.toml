[workspace]
resolver = "3"
members = ["crates/kernel/obop-types", "crates/obop"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
obop-types = { path = "crates/kernel/obop-types" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
overflow-checks = true
