[workspace]
resolver = "3"
members = ["crates/kernel/*", "crates/modules/*", "crates/obop"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
obop-types = { path = "crates/kernel/obop-types" }
obop-registry = { path = "crates/kernel/obop-registry" }
obop-masking = { path = "crates/kernel/obop-masking" }
obop-storage = { path = "crates/kernel/obop-storage" }
obop-commands = { path = "crates/kernel/obop-commands" }
obop-http = { path = "crates/kernel/obop-http" }
obop-mcp = { path = "crates/kernel/obop-mcp" }
base = { path = "crates/modules/base" }
invoicing = { path = "crates/modules/invoicing" }
sales = { path = "crates/modules/sales" }
crm = { path = "crates/modules/crm" }
product = { path = "crates/modules/product" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
overflow-checks = true
