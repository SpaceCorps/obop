[workspace]
resolver = "3"
members = ["crates/kernel/*", "crates/modules/*", "crates/obop"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
version = "0.2.0"
license = "Apache-2.0"
repository = "https://github.com/SpaceCorps/obop"

[workspace.dependencies]
obop-types = { path = "crates/kernel/obop-types" }
obop-values = { path = "crates/kernel/obop-values" }
obop-registry = { path = "crates/kernel/obop-registry" }
obop-masking = { path = "crates/kernel/obop-masking" }
obop-connectors = { path = "crates/kernel/obop-connectors" }
obop-storage = { path = "crates/kernel/obop-storage" }
obop-keys = { path = "crates/kernel/obop-keys" }
obop-migrate = { path = "crates/kernel/obop-migrate" }
obop-ops = { path = "crates/kernel/obop-ops" }
obop-media = { path = "crates/kernel/obop-media" }
obop-payments = { path = "crates/kernel/obop-payments" }
obop-auth = { path = "crates/kernel/obop-auth" }
obop-oauth = { path = "crates/kernel/obop-oauth" }
obop-pkg = { path = "crates/kernel/obop-pkg" }
obop-platform = { path = "crates/kernel/obop-platform" }
obop-update = { path = "crates/kernel/obop-update" }
obop-commands = { path = "crates/kernel/obop-commands" }
obop-community = { path = "crates/kernel/obop-community" }
obop-site = { path = "crates/kernel/obop-site" }
obop-http = { path = "crates/kernel/obop-http" }
obop-mcp = { path = "crates/kernel/obop-mcp" }
base = { path = "crates/modules/base" }
invoicing = { path = "crates/modules/invoicing" }
sales = { path = "crates/modules/sales" }
crm = { path = "crates/modules/crm" }
product = { path = "crates/modules/product" }
connectors = { path = "crates/modules/connectors" }
mileage = { path = "crates/modules/mileage" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
overflow-checks = true

# Dependencies are compiled with optimisation even in debug builds: image decoding and encoding
# (the shop seed makes a few dozen pictures) and password hashing are otherwise very slow in tests.
[profile.dev.package."*"]
opt-level = 2
