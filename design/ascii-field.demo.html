<!doctype html><meta charset="utf-8"><title>t</title>
<style>
:root{color-scheme:dark light;--bg:#14131a;--fg:#f2f1f7;--ascii-ink:#9a9ab5;--ascii-accent:#9b78f0}
@media (prefers-color-scheme:light){:root{--bg:#f6f5fb;--fg:#1c1b22;--ascii-ink:#5d5b6b;--ascii-accent:#6d3fd0}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui}
.hero{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;
  -webkit-mask-image:radial-gradient(ellipse at center,transparent 18%,#000 75%);mask-image:radial-gradient(ellipse at center,transparent 18%,#000 75%)}
h1{font-size:4rem;letter-spacing:-.04em;margin:0}
</style>
<section class="hero"><canvas id="c" aria-hidden="true"></canvas><h1>One business.<br>One platform.</h1></section>
<script type="module">import {asciiField} from "./ascii-field.js"; asciiField(document.getElementById("c"));</script>
