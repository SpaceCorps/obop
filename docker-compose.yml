# Local trial of the PostgreSQL deployment shape, published on localhost only.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: obop-local
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  obop:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      OBOP_DATABASE_URL: postgres://postgres:obop-local@db/postgres
    command: ["obop", "serve", "--addr", "0.0.0.0:8080", "--static", "/srv/web", "--demo"]
    ports: ["127.0.0.1:8080:8080"]
volumes:
  pgdata:
