# cargo-deny (K9): the licences of every crate in the build graph and the security advisories,
# checked in CI (.github/workflows/ci.yml, jobs `licences` and `advisories`). Run it here with
#   cargo deny check licenses advisories
#
# obop is Apache-2.0 (OR-1): every dependency must be under a licence compatible with it, with no
# copyleft-only component. The list is what the graph uses today, read on 2026-10-26 and again
# when this file was written; a new licence fails the check until a person has read it and added
# it here. MPL-2.0 (file-level copyleft, compatible with Apache-2.0) is allowed for the crates
# that carry it (cssparser and dtoa-short, through the CSS parsing of the website renderer).
# MIT-0, BSD-2-Clause and CC0-1.0 were removed on 2026-11-20 (U73): no crate of the graph used
# them any more, and an allowance nobody uses would let a new one in unread.

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
# The workspace's own crates are Apache-2.0 and not published.
private = { ignore = true }

[advisories]
version = 2
# Every advisory fails the check, unmaintained and unsound ones included, until it is fixed or a
# person records here why it does not apply (`ignore = [{ id = "RUSTSEC-...", reason = "..." }]`).
yanked = "deny"
