[package]
name = "obop-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
obop-commands.workspace = true
obop-storage.workspace = true
obop-keys.workspace = true
obop-types.workspace = true
argon2 = "0.6"
sha2 = "0.11"
getrandom = "0.4"
serde_json = "1"
hmac = "0.13.0"
sha1 = "0.11.0"
# Signature verification for WebAuthn (ES256, EdDSA, RS256). Already in the tree through rustls.
ring = "0.17.14"

[features]
# Test doubles: a software authenticator for the WebAuthn flows, a software Microsoft for the
# sign-in (`oidc::soft`) and `Auth::set_oidc_authority_for_test`. Never enabled in a release build.
test-support = []

[lints]
workspace = true

[dev-dependencies]
obop-storage = { workspace = true, features = ["test-support"] }
