[package]
name = "obop-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe handling of uploaded images and files: type sniffing, decoding limits, re-encoding (strips metadata) and thumbnails"

[dependencies]
# Only the four web formats, no rayon, no AVIF/TIFF/EXR: keeps compile time and binary size low.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[lints]
workspace = true
