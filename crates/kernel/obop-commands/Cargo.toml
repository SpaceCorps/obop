[package]
name = "obop-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
obop-types.workspace = true
obop-values.workspace = true
obop-brand.workspace = true
obop-registry.workspace = true
obop-masking.workspace = true
obop-storage.workspace = true
obop-blob-gdrive.workspace = true
obop-keys.workspace = true
obop-media.workspace = true

getrandom = "0.4"
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v7"] }
icu_collator = "2.3.1"
icu_locale = "2.3.1"

[features]
# The probes of the brand reader that the tests of other crates use (`Reader::waiting`, `Reader::expire`).
test-support = []

[lints]
workspace = true

[dev-dependencies]
obop-storage = { workspace = true, features = ["test-support"] }
# The parity test of the SQL key expressions talks to a real server (see keyexpr_parity.rs).
postgres = "0.19"
