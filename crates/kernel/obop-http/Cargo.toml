[package]
name = "obop-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
obop-commands.workspace = true
obop-connectors.workspace = true
obop-community.workspace = true
obop-mcp.workspace = true
obop-oauth.workspace = true
obop-types.workspace = true
obop-storage.workspace = true
obop-keys.workspace = true
sha2 = "0.11"
