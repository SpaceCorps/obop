[module]
id = "projects"
version = "0.3.0"
name = "Projects"
description = "Projects, milestones and tasks with assignees, deadlines and status flows. Progress is tracked by status, not computed from task effort."
author = "SpaceCorps"
summary = "Projects, milestones and tasks with assignees, deadlines and status flows."
license = "AGPL-3.0-or-later"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["projects", "tasks", "milestones"]
categories = ["services", "productivity"]
maturity = "beta"
requires_core = "^0.2"

[[model]]
name = "projects_project"
description = "A body of work with a goal"
read_group = "projects.user"
write_group = "projects.manager"

  [[model.field]]
  name = "name"
  description = "Project name"
  class = "none"
  required = true

  [[model.field]]
  name = "code"
  description = "Short reference used in reports, for example WEB-24"
  class = "none"

  [[model.field]]
  name = "project_manager"
  description = "Name of the person accountable for the project"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "start_on"
  description = "Planned start date (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "deadline"
  description = "Date the project must be finished (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "budget"
  description = "Agreed budget for the project (minor currency units, e.g. cents)"
  class = "none"
  kind = "money"

  [[model.field]]
  name = "description"
  description = "Goal and scope of the project"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Project status: planned, active, done"
  class = "none"
  kind = "select"
  options = ["planned", "active", "done"]
  required = true

  [[model.action]]
  name = "start"
  description = "Move a planned project to active"
  field = "state"
  from = "planned"
  to = "active"

  [[model.action]]
  name = "finish"
  description = "Mark an active project as done"
  field = "state"
  from = "active"
  to = "done"

  [[model.action]]
  name = "reopen"
  description = "Reopen a finished project"
  field = "state"
  from = "done"
  to = "active"

[[model]]
name = "projects_milestone"
description = "A checkpoint in a project"
read_group = "projects.user"
write_group = "projects.manager"

  [[model.field]]
  name = "project_id"
  description = "The project the milestone belongs to"
  class = "none"
  kind = "ref"
  to = "projects_project"
  required = true

  [[model.field]]
  name = "name"
  description = "Milestone name, for example Design approved"
  class = "none"
  required = true

  [[model.field]]
  name = "due_on"
  description = "Date the milestone is due (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "description"
  description = "What must be true for the milestone to count as reached"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Milestone status: pending, reached, missed"
  class = "none"
  kind = "select"
  options = ["pending", "reached", "missed"]
  required = true

  [[model.action]]
  name = "reach"
  description = "Mark a pending milestone as reached"
  field = "state"
  from = "pending"
  to = "reached"

  [[model.action]]
  name = "miss"
  description = "Record that a pending milestone was missed"
  field = "state"
  from = "pending"
  to = "missed"

[[model]]
name = "projects_task"
description = "A unit of work inside a project"
read_group = "projects.user"
write_group = "projects.user"

  [[model.field]]
  name = "title"
  description = "What needs doing"
  class = "none"
  required = true

  [[model.field]]
  name = "project_id"
  description = "The project this task belongs to; empty for a private task"
  class = "none"
  kind = "ref"
  to = "projects_project"

  [[model.field]]
  name = "milestone_id"
  description = "The milestone this task contributes to"
  class = "none"
  kind = "ref"
  to = "projects_milestone"

  [[model.field]]
  name = "assignee"
  description = "Name of the person responsible"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "priority"
  description = "How important the task is: low, normal, high"
  class = "none"
  kind = "select"
  options = ["low", "normal", "high"]

  [[model.field]]
  name = "due_on"
  description = "Date the task is due (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "estimate_minutes"
  description = "Planned effort in minutes"
  class = "none"
  kind = "number"

  [[model.field]]
  name = "description"
  description = "Details, acceptance criteria and links"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Task status: todo, doing, done, cancelled"
  class = "none"
  kind = "select"
  options = ["todo", "doing", "done", "cancelled"]

  [[model.action]]
  name = "begin"
  description = "Start working on a todo task"
  field = "state"
  from = "todo"
  to = "doing"

  [[model.action]]
  name = "complete"
  description = "Mark a task in progress as done"
  field = "state"
  from = "doing"
  to = "done"

  [[model.action]]
  name = "cancel"
  description = "Drop a task that was never started"
  field = "state"
  from = "todo"
  to = "cancelled"
