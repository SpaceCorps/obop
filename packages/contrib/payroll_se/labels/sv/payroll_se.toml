[labels.sv.module]
name = "Lön Sverige"
description = "Svenskt lönestöd efter open-accounting-sweden: lönedata per anställd, lönekörningar med brutto, preliminärskatt, arbetsgivaravgift och netto, en avgiftstabell i baspunkter med granskningsstatus och en AGI-post. Bara payroll.approver godkänner. OVERIFIERAT: inget är kontrollerat mot Skatteverket och inga satser eller tabeller ingår. AGI-XML genereras inte."

[labels.sv.model.payroll_se_employee]
name = "Anställd (lön)"
description = "Svensk lönedata för en anställd i modulen hr. Personuppgifter i känsliga klasser; se gallringsanteckningen i docs/spec/payroll-se.md. Alla skatteuppgifter skrivs in av användaren"

[labels.sv.model.payroll_se_employee.field.employee_id]
label = "Anställd"
description = "Den anställde i modulen hr som lönedatan hör till; en post per anställd"

[labels.sv.model.payroll_se_employee.field.personnummer]
label = "Personnummer"
description = "Personnummer, tolv siffror som 19900101-1234. Personuppgift i klassen confidential_hr: maskas för den som inte har payroll.preparer och visas aldrig för agenter; paketet kontrollerar inte kontrollsiffran"

[labels.sv.model.payroll_se_employee.field.age_class]
label = "Åldersklass"
description = "Åldersklass som väljer arbetsgivaravgiften: standard, senior, over_79, youth, other. Väljs av användaren; ingenting härleds ur personnumret och klassnamnen är OVERIFIERADE etiketter, inte Skatteverkets termer"

[labels.sv.model.payroll_se_employee.field.age_class.options]
standard = "Standard"
senior = "Senior"
over_79 = "Över 79 år"
youth = "Ungdom"
other = "Övrig"

[labels.sv.model.payroll_se_employee.field.tax_basis]
label = "Skattegrund"
description = "Hur preliminärskatten hittas: table (skattetabell och kolumn nedan), percent (fast procent nedan), adjustment (jämkningsbeslut nedan). Användaren bestämmer; inget slås upp"

[labels.sv.model.payroll_se_employee.field.tax_basis.options]
table = "Tabell"
percent = "Procent"
adjustment = "Jämkning"

[labels.sv.model.payroll_se_employee.field.tax_table]
label = "Skattetabell"
description = "Skattetabellens nummer som användaren skrivit in från Skatteverket, till exempel 33. Kontrolleras inte, ingen tabell ingår"

[labels.sv.model.payroll_se_employee.field.tax_column]
label = "Tabellkolumn"
description = "Skattetabellens kolumn som användaren skrivit in. Kontrolleras inte"

[labels.sv.model.payroll_se_employee.field.tax_percent_bp]
label = "Skatteprocent (bp)"
description = "Fast preliminärskatt i baspunkter när skattegrunden är percent: 3000 betyder 30,00 procent. Anges av användaren"

[labels.sv.model.payroll_se_employee.field.adjustment_percent_bp]
label = "Jämkningsprocent (bp)"
description = "Skatteprocent i baspunkter enligt ett jämkningsbeslut när skattegrunden är adjustment. Anges av användaren från beslutet"

[labels.sv.model.payroll_se_employee.field.adjustment_valid_from]
label = "Jämkning gäller från"
description = "Första dag jämkningsbeslutet gäller (ÅÅÅÅ-MM-DD)"

[labels.sv.model.payroll_se_employee.field.adjustment_valid_to]
label = "Jämkning gäller till"
description = "Sista dag jämkningsbeslutet gäller (ÅÅÅÅ-MM-DD)"

[labels.sv.model.payroll_se_employee.field.active]
label = "Aktiv"
description = "Om den anställde kan läggas på nya lönekörningar"

[labels.sv.model.payroll_se_employee.field.note]
label = "Anteckning"
description = "Handläggarens anmärkningar. Skriv inte personnummer eller hälsouppgifter här"

[labels.sv.model.payroll_se_rate]
name = "Avgiftssats"
description = "En arbetsgivaravgift för en åldersklass och en giltighetstid. OVERIFIERAD tills godkännaren har kontrollerat den mot Skatteverket"

[labels.sv.model.payroll_se_rate.field.name]
label = "Namn"
description = "Radens korta namn, till exempel standard från 2026-01"

[labels.sv.model.payroll_se_rate.field.age_class]
label = "Åldersklass"
description = "Åldersklassen satsen gäller: standard, senior, over_79, youth, other"

[labels.sv.model.payroll_se_rate.field.age_class.options]
standard = "Standard"
senior = "Senior"
over_79 = "Över 79 år"
youth = "Ungdom"
other = "Övrig"

[labels.sv.model.payroll_se_rate.field.rate_bp]
label = "Sats (bp)"
description = "Arbetsgivaravgift i baspunkter: 3142 betyder 31,42 procent. Skrivs in av användaren; paketet levererar inget värde"

[labels.sv.model.payroll_se_rate.field.valid_from]
label = "Gäller från"
