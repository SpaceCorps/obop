[labels.sv.model.payroll_se_rate.action.unverify]
label = "Ta bort verifiering"
description = "Återkalla verifieringen av satsen (bara godkännaren)"

[labels.sv.model.payroll_se_pay_run]
name = "Lönekörning"
description = "En lönekörning för en period: rader med brutto, preliminärskatt, arbetsgivaravgift och netto, föreslagen av en handläggare och godkänd av en person. OVERIFIERAD: paketet kontrollerar ingen sats eller regel"

[labels.sv.model.payroll_se_pay_run.field.period]
label = "Period"
description = "Löneperiod, till exempel 2026-10; en körning per period"

[labels.sv.model.payroll_se_pay_run.field.pay_date]
