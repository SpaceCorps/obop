[labels.sv.model.payroll_se_rate.field.valid_to]
label = "Gäller till"
description = "Sista dag satsen gäller (ÅÅÅÅ-MM-DD); tomt betyder utan slutdatum"

[labels.sv.model.payroll_se_rate.field.review]
label = "Granskning"
description = "Satsens granskningsstatus: unverified, verified. Börjar overifierad; bara godkännaren verifierar, efter kontroll mot Skatteverket"

[labels.sv.model.payroll_se_rate.field.review.options]
unverified = "Overifierad"
verified = "Verifierad"

[labels.sv.model.payroll_se_rate.field.verified]
label = "Verifierad"
description = "Om satsen har verifierats av ägaren; falskt tills dess"

[labels.sv.model.payroll_se_rate.field.verified_by]
label = "Verifierad av"
description = "Inloggningsnamn för den som verifierade"

[labels.sv.model.payroll_se_rate.field.verified_on]
label = "Verifierad den"
description = "Datum då satsen verifierades (ÅÅÅÅ-MM-DD)"

[labels.sv.model.payroll_se_rate.field.source]
label = "Källa"
description = "Var satsen kommer ifrån och vad som kontrollerades; tomt betyder att ingen källa kontrollerats"

[labels.sv.model.payroll_se_rate.action.verify]
label = "Verifiera"
