[module]
id = "manufacturing"
version = "0.2.1"
name = "Manufacturing"
description = "Bills of materials and manufacturing orders with a draft, confirmed, in progress and done flow. Component stock is not consumed automatically. A done or cancelled order can no longer be changed."
author = "SpaceCorps"
summary = "Bills of materials and manufacturing orders with a draft, confirmed, in progress and done flow."
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["manufacturing", "bom", "production"]
categories = ["supply-chain"]
maturity = "experimental"
requires_core = "^0.2.2"
home = "manufacturing_order"
changelog = "Done and cancelled manufacturing orders are frozen. A new order starts today and makes one run of its bill of materials unless a quantity is given; inactive bills of materials are no longer offered for new orders, new ones start active, and those whose active flag was never set become active. The app opens on the manufacturing orders, and components are edited inside their bill of materials. English names, list, card, calendar and form hints."

[module.dependencies]
product = "^0.2"

[[model]]
name = "manufacturing_bom"
description = "A recipe: the components needed to make a product"
read_group = "manufacturing.user"
write_group = "manufacturing.manager"

  [model.ui]
  title = "{name}"
  subtitle = "{product_id}"
  list = ["name", "product_id", "quantity", "active"]
  quick_create = ["product_id", "name", "quantity"]
  order = "name asc"
  default_view = "list"
  menu = "main"
  menu_order = 2

  [[model.child]]
  model = "manufacturing_bom_line"
  via = "bom_id"
  shape = "lines"

  [[model.field]]
  name = "product_id"
  description = "The finished product the recipe makes"
  class = "none"
  kind = "ref"
  to = "product"
  required = true

  [[model.field]]
  name = "name"
  description = "Name of the recipe, for example Standard assembly"
  class = "none"
  required = true

  [[model.field]]
  name = "quantity"
  description = "Units of the finished product one run produces"
  class = "none"
  kind = "number"
  required = true
  default = 1

  [[model.field]]
  name = "instructions"
  description = "Assembly notes for the shop floor"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "active"
  description = "Whether the recipe can be used for new orders"
  class = "none"
  kind = "bool"
  default = true

[[model]]
name = "manufacturing_bom_line"
description = "One component of a bill of materials"
read_group = "manufacturing.user"
write_group = "manufacturing.manager"

  [model.ui]
  title = "{component_id} × {quantity}"
  subtitle = "{bom_id}"
  list = ["component_id", "quantity"]
  quick_create = ["component_id", "quantity"]
  default_view = "list"
  menu = "hidden"

  [[model.field]]
  name = "bom_id"
  description = "The recipe the component belongs to"
  class = "none"
  kind = "ref"
  to = "manufacturing_bom"
  required = true

  [[model.field]]
  name = "component_id"
  description = "The product consumed"
  class = "none"
  kind = "ref"
  to = "product"
  required = true

  [[model.field]]
  name = "quantity"
  description = "Units of the component used per run"
  class = "none"
  kind = "number"
  required = true
  default = 1

[[model]]
name = "manufacturing_order"
description = "An instruction to produce a quantity of a product"
read_group = "manufacturing.user"
write_group = "manufacturing.user"

  [model.ui]
  title = "{reference} · {bom_id} × {quantity} | {reference}"
  subtitle = "{planned_on}"
  list = ["reference", "bom_id", "quantity", "planned_on", "deadline", "responsible", "state"]
  card = ["reference", "bom_id", "quantity", "deadline"]
  quick_create = ["reference", "bom_id", "quantity"]
  order = "planned_on desc, reference desc"
  default_view = "list"
  menu = "main"
  menu_order = 1
  calendar = { start = "planned_on", end = "deadline", color = "state" }
  report = { rows = "bom_id", cols = "state", measure = "quantity" }

  [[model.ui.filter]]
  label = "In progress"
  where = "state = in_progress"

  [[model.ui.filter]]
  label = "Late"
  where = "deadline < today && state != done && state != cancelled"

  [model.guard]
  immutable_when = ["done", "cancelled"]
  message = "A done or cancelled manufacturing order cannot be changed."

  [[model.field]]
  name = "reference"
  description = "Order number, for example MO-0042"
  class = "none"
  required = true

  [[model.field]]
  name = "bom_id"
  description = "The recipe to follow"
  class = "none"
  kind = "ref"
  to = "manufacturing_bom"
  required = true
  ref_filter = "active = true"

  [[model.field]]
  name = "quantity"
  description = "Units of the finished product to make"
  class = "none"
  kind = "number"
  required = true
  fill_from = "bom_id.quantity"

    [model.field.ui]
    aggregate = "none"

  [[model.field]]
  name = "planned_on"
  description = "Date production should start (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  default = "today"

  [[model.field]]
  name = "deadline"
  description = "Date the goods are needed (YYYY-MM-DD)"
  class = "none"
  kind = "date"

    [model.field.ui]
    warn_before_days = 3

  [[model.field]]
  name = "responsible"
  description = "Name of the person in charge of the run"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "state"
  description = "Order status: draft, confirmed, in_progress, done, cancelled"
  class = "none"
  kind = "select"
  options = ["draft", "confirmed", "in_progress", "done", "cancelled"]
  required = true

    [model.field.ui]
    tones = { confirmed = "info", in_progress = "warn", done = "ok", cancelled = "neutral" }

  [[model.action]]
  name = "confirm"
  description = "Confirm a draft order so production can be planned"
  field = "state"
  from = "draft"
  to = "confirmed"
  group = "manufacturing.manager"

    [model.action.ui]
    primary = true
    done = "Order confirmed"

  [[model.action]]
  name = "start"
  description = "Start production on a confirmed order"
  field = "state"
  from = "confirmed"
  to = "in_progress"

    [model.action.ui]
    primary = true
    done = "Production started"

  [[model.action]]
  name = "finish"
  description = "Mark production as finished"
  field = "state"
  from = "in_progress"
  to = "done"

    [model.action.ui]
    primary = true
    confirm = "Mark production as finished? A done order can no longer be changed."
    done = "Production finished"

  [[model.action]]
  name = "cancel"
  description = "Cancel an order that has not been confirmed"
  field = "state"
  from = "draft"
  to = "cancelled"

    [model.action.ui]
    danger = true
    confirm = "Cancel this order?"
    done = "Order cancelled"

[[migration]]
from = "<0.2.1"
op = "set_default"
model = "manufacturing_bom"
field = "active"
value = true
description = "Bills of materials whose active flag was never set become active, so they are still offered for new orders"
