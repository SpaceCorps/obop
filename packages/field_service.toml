[module]
id = "field_service"
version = "0.3.1"
name = "Field Service"
description = "On-site jobs for customers, done by a technician: scheduled, en route, in progress, done or cancelled. A job records the customer, the site, the technician, the planned day and start (minutes since midnight), the parts used and whether the customer must sign off. Site address and contact details are personal data. Needs the Human Resources and Products packages."
author = "SpaceCorps"
summary = "On-site jobs for customers, done by a technician, with parts used and a customer sign-off flag."
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["field-service", "jobs", "technicians"]
categories = ["services"]
maturity = "experimental"
requires_core = "^0.2.2"
changelog = "The job actions are named as a technician says them, On my way, Start work and Complete job, the same on the job, the board and My day."
home = "field_service_job"

[module.dependencies]
base = "^0.2"
product = "^0.2"
hr = ">=0.2, <1"

[[model]]
name = "field_service_job"
description = "An on-site job for a customer"
read_group = "field_service.user"
write_group = "field_service.user"

  [model.ui]
  title = "{name}"
  subtitle = "{customer_id}"
  list = ["name", "customer_id", "technician_id", "scheduled_on", "scheduled_start_minute", "priority", "state"]
  card = ["name", "customer_id", "technician_id", "scheduled_on", "scheduled_start_minute", "priority"]
  quick_create = ["name", "customer_id", "technician_id", "scheduled_on"]
  order = "scheduled_on asc, scheduled_start_minute asc"
  default_view = "kanban"
  menu = "main"
  menu_order = 1
  calendar = { start = "scheduled_on", color = "technician_id" }
  report = { rows = "technician_id", cols = "state" }

  [[model.ui.section]]
  label = "Job"
  fields = ["name", "customer_id", "technician_id", "priority", "description"]

  [[model.ui.section]]
  label = "Customer and site"
  fields = ["site_name", "site_address", "site_postcode", "site_city", "site_country", "site_contact_name", "site_contact_phone"]

  [[model.ui.section]]
  label = "Schedule"
  fields = ["scheduled_on", "scheduled_start_minute", "planned_minutes"]

  [[model.ui.section]]
  label = "Sign-off"
  fields = ["signature_required", "signed_by", "signed_on"]

  [[model.ui.section]]
  label = "Report"
  fields = ["work_report"]

  [[model.ui.filter]]
  label = "Today"
  where = "scheduled_on = today"

  [[model.ui.filter]]
  label = "Not done"
  where = "state != done && state != cancelled"

  [[model.child]]
  model = "field_service_part"
  via = "job_id"
  shape = "lines"

  [model.guard]
  immutable_when = ["done", "cancelled"]
  message = "A done or cancelled job cannot be changed. Schedule a follow-up job instead."

  [[model.field]]
  name = "name"
  description = "Short title of the job, for example Replace boiler pump"
  class = "none"
  required = true

  [[model.field]]
  name = "customer_id"
  description = "The customer the job is for"
  class = "none"
  kind = "ref"
  to = "party"
  required = true

  [[model.field]]
  name = "site_name"
  description = "Name of the site, for example Main warehouse"
  class = "none"

  [[model.field]]
  name = "site_address"
  description = "Street address where the work is done; often a person's home"
  class = "internal"
  personal_data = true
  kind = "longtext"
  [model.field.ui]
  display = "address"

  [[model.field]]
  name = "site_city"
  description = "City of the site"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "site_postcode"
  description = "Postcode of the site"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "site_country"
  description = "Country of the site"
  class = "none"

  [[model.field]]
  name = "site_contact_name"
  description = "Name of the person to meet on site"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "site_contact_phone"
  description = "Phone number of the person to meet on site"
  class = "internal"
  personal_data = true
  [model.field.ui]
  display = "tel"

  [[model.field]]
  name = "technician_id"
  description = "Technician assigned to the job"
  class = "internal"
  personal_data = true
  kind = "ref"
  to = "hr_employee"
  ref_filter = "state != offboarded"

  [[model.field]]
  name = "priority"
  description = "How urgent the job is: low, normal, high, urgent"
  class = "none"
  kind = "select"
  options = ["low", "normal", "high", "urgent"]
  default = "normal"
  [model.field.ui]
  tones = { low = "neutral", normal = "neutral", high = "warn", urgent = "bad" }

  [[model.field]]
  name = "description"
  description = "What has to be done and what the customer reported"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "scheduled_on"
  description = "Planned day of the visit (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  default = "today"

  [[model.field]]
  name = "scheduled_start_minute"
  description = "Planned start in minutes since midnight (540 is 09:00)"
  class = "none"
  kind = "number"
  min = 0
  max = 1439
  [model.field.ui]
  display = "time_of_day"
  aggregate = "none"

  [[model.field]]
  name = "planned_minutes"
  description = "Planned duration in minutes"
  class = "none"
  kind = "number"
  min = 0
  [model.field.ui]
  display = "duration_minutes"

  [[model.field]]
  name = "signature_required"
  description = "Whether the customer has to sign off the work before it counts as done"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "signed_by"
  description = "Name of the person who signed off the work"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "signed_on"
  description = "Day the customer signed off (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "work_report"
  description = "What was done, written by the technician"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Job status: scheduled, en_route, in_progress, done, cancelled"
  class = "none"
  kind = "select"
  options = ["scheduled", "en_route", "in_progress", "done", "cancelled"]
  required = true
  [model.field.ui]
  tones = { scheduled = "info", en_route = "warn", in_progress = "warn", done = "ok", cancelled = "neutral" }

  [[model.action]]
  name = "depart"
  description = "The technician is on the way"
  field = "state"
  from = "scheduled"
  to = "en_route"
  [model.action.ui]
  primary = true
  done = "On the way"

  [[model.action]]
  name = "start"
  description = "The technician has arrived and started work"
  field = "state"
  from = "en_route"
  to = "in_progress"
  [model.action.ui]
  primary = true
  done = "Work started"

  [[model.action]]
  name = "complete"
  description = "Finish the job; when a signature is required, record signed_by and signed_on first"
  field = "state"
  from = "in_progress"
  to = "done"
  assert = [{ expr = "!signature_required || (is_set(signed_by) && is_set(signed_on))", message = "The customer has to sign off this job first: fill in who signed and on which day", key = "signed" }]
  [model.action.ui]
  primary = true
  confirm = "Complete this job? A done job can no longer be changed."
  done = "Job done"

  [[model.action]]
  name = "cancel"
  description = "Cancel a job that has not started"
  field = "state"
  from = "scheduled"
  to = "cancelled"
  group = "field_service.manager"
  [model.action.ui]
  danger = true
  confirm = "Cancel this job? It can no longer be changed afterwards."

[[model]]
name = "field_service_part"
description = "A part or product used on a job"
read_group = "field_service.user"
write_group = "field_service.user"

  [model.ui]
  title = "{product_id} × {quantity}"
  list = ["product_id", "quantity", "unit_price", "note"]
  quick_create = ["product_id", "quantity"]
  menu = "hidden"

  [model.guard]
  children_of = "job_id"
  message = "The parts of a done or cancelled job cannot be changed."

  [[model.field]]
  name = "job_id"
  description = "The job the part was used on"
  class = "none"
  kind = "ref"
  to = "field_service_job"
  required = true

  [[model.field]]
  name = "product_id"
  description = "The product that was used"
  class = "none"
  kind = "ref"
  to = "product"
  required = true

  [[model.field]]
  name = "quantity"
  description = "How many units were used"
  class = "none"
  kind = "number"
  required = true

  [[model.field]]
  name = "unit_price"
  description = "Price per unit charged to the customer (minor currency units, e.g. cents); the product's list price unless given"
  class = "none"
  kind = "money"
  fill_from = "product_id.list_price_minor"
  [model.field.ui]
  aggregate = "none"

  [[model.field]]
  name = "note"
  description = "Remark about the part, for example serial number"
  class = "none"
