[module]
id = "documents"
version = "0.3.0"
name = "Documents"
description = "A register of business documents: folders, document records with kind, owner, expiry and confidentiality, and a draft, published and archived flow. It stores references and, when you upload one, the file itself. Confidentiality is enforced: confidential and restricted documents are visible only to their owner and to documents.manager; public and internal ones to everyone who may read documents."
author = "SpaceCorps"
summary = "A register of business documents with owner, expiry and confidentiality, and a draft, published, archived flow."
license = "AGPL-3.0-or-later"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["documents", "register", "archive"]
categories = ["productivity"]
maturity = "beta"
requires_core = "^0.2"

[[model]]
name = "documents_folder"
description = "A folder that groups documents"
read_group = "documents.user"
write_group = "documents.manager"

  [[model.field]]
  name = "name"
  description = "Folder name"
  class = "none"
  required = true

  [[model.field]]
  name = "parent_id"
  description = "The folder this one sits in"
  class = "none"
  kind = "ref"
  to = "documents_folder"

  [[model.field]]
  name = "description"
  description = "What belongs in the folder"
  class = "none"
  kind = "longtext"

[[model]]
name = "documents_document"
description = "A contract, policy, certificate or other document on record"
read_group = "documents.user"
write_group = "documents.user"

  [model.access]
  own = "owner"
  public_field = "open_to_all"
  see_all_group = "documents.manager"

  [[model.field]]
  name = "title"
  description = "Document title"
  class = "none"
  required = true

  [[model.field]]
  name = "folder_id"
  description = "The folder the document is filed in"
  class = "none"
  kind = "ref"
  to = "documents_folder"

  [[model.field]]
  name = "kind"
  description = "Type of document: contract, invoice, policy, report, certificate, other"
  class = "none"
  kind = "select"
  options = ["contract", "invoice", "policy", "report", "certificate", "other"]
  required = true

  [[model.field]]
  name = "confidentiality"
  description = "Who may see it: public and internal documents everyone who may read documents, confidential and restricted ones only the owner and documents.manager"
  class = "none"
  kind = "select"
  options = ["public", "internal", "confidential", "restricted"]
  required = true

  [[model.field]]
  name = "open_to_all"
  description = "Whether everyone who may read documents can see this one: true for public and internal documents"
  class = "none"
  kind = "bool"
  computed = 'confidentiality == "public" || confidentiality == "internal"'

  [[model.field]]
  name = "owner"
  description = "User name of the person responsible for the document; the person who creates it unless set otherwise. Owners see their confidential documents"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "reference"
  description = "Reference number, for example a contract number"
  class = "none"

  [[model.field]]
  name = "location"
  description = "Where the file is stored, such as a link or archive box"
  class = "none"

  [[model.field]]
  name = "attachment"
  description = "The document file itself (PDF, image, text, spreadsheet or office document, up to 25 MiB); served only as a download to people who may read the record"
  class = "internal"
  kind = "file"

  [[model.field]]
  name = "expires_on"
  description = "Date after which the document is no longer valid (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "summary"
  description = "What the document says, in a few lines"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Document status: draft, published, archived"
  class = "none"
  kind = "select"
  options = ["draft", "published", "archived"]
  required = true

  [[model.action]]
  name = "publish"
  description = "Make a draft document the current version"
  field = "state"
  from = "draft"
  to = "published"

  [[model.action]]
  name = "archive"
  description = "Archive a published document (manager only)"
  field = "state"
  from = "published"
  to = "archived"
  group = "documents.manager"
