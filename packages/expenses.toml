[module]
id = "expenses"
version = "0.3.0"
name = "Expenses"
description = "Employee expense claims with a draft, submitted, approved and paid flow. Paying is a separate permission and needs a human approval; receipts are referenced by note, not stored. A claim has a number from a yearly series, and an employee sees and edits only their own claims; managers and finance see all."
author = "SpaceCorps"
summary = "Employee expense claims with a draft, submitted, approved and paid flow."
license = "AGPL-3.0-or-later"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["expenses", "claims", "reimbursement"]
categories = ["finance", "people"]
maturity = "beta"
requires_core = "^0.2"

[[model]]
name = "expenses_expense"
description = "An amount an employee spent for the business and wants reimbursed"
read_group = "expenses.user"
write_group = "expenses.user"

  [model.access]
  own = "employee"
  see_all_group = ["expenses.manager", "expenses.finance"]

  [[model.field]]
  name = "number"
  description = "Claim number such as EXP-2026-0042, assigned when the claim is created; the series starts again each year"
  class = "none"
  kind = "sequence"
  format = "EXP-{year}-{seq:04}"
  reset = "year"

  [[model.field]]
  name = "description"
  description = "What the money was spent on"
  class = "none"
  required = true

  [[model.field]]
  name = "employee"
  description = "User name of the person claiming the expense; the person who creates the claim unless set otherwise"
  class = "internal"
  personal_data = true
  required = true

  [[model.field]]
  name = "spent_on"
  description = "Date of the purchase (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  required = true

  [[model.field]]
  name = "category"
  description = "Expense category: travel, meals, lodging, supplies, software, other"
  class = "none"
  kind = "select"
  options = ["travel", "meals", "lodging", "supplies", "software", "other"]
  required = true

  [[model.field]]
  name = "amount"
  description = "Amount owed to the employee (minor currency units, e.g. cents)"
  class = "financial"
  personal_data = true
  kind = "money"
  required = true

  [[model.field]]
  name = "currency"
  description = "ISO 4217 currency code, for example EUR"
  class = "none"

  [[model.field]]
  name = "receipt_note"
  description = "Where the receipt is kept and what it shows"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "paid_on"
  description = "Date the employee was reimbursed (YYYY-MM-DD)"
  class = "financial"
  personal_data = true
  kind = "date"
  group = "expenses.finance"

  [[model.field]]
  name = "payment_reference"
  description = "Bank transfer reference of the reimbursement"
  class = "financial"
  personal_data = true
  group = "expenses.finance"

  [[model.field]]
  name = "state"
  description = "Claim status: draft, submitted, approved, paid, refused"
  class = "none"
  kind = "select"
  options = ["draft", "submitted", "approved", "paid", "refused"]
  required = true

  [[model.action]]
  name = "submit"
  description = "Submit the claim for approval"
  field = "state"
  from = "draft"
  to = "submitted"

  [[model.action]]
  name = "approve"
  description = "Approve a submitted claim (manager only)"
  field = "state"
  from = "submitted"
  to = "approved"
  group = "expenses.manager"

  [[model.action]]
  name = "pay"
  description = "Record the reimbursement as paid (finance only)"
  field = "state"
  from = "approved"
  to = "paid"
  group = "expenses.finance"
  approval = true

  [[model.action]]
  name = "refuse"
  description = "Refuse a submitted claim (manager only)"
  field = "state"
  from = "submitted"
  to = "refused"
  group = "expenses.manager"
