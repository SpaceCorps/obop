[module]
id = "accounting_se"
version = "0.2.0"
name = "Accounting Sweden"
description = "Swedish localisation of Accounting, ported from the domain model of open-accounting-sweden: company data (organisation number, VAT number, F-tax, start of the fiscal year), voucher series (verifikationsserier) tied to journals, Swedish VAT (moms) codes with the box and the account each code feeds, the boxes of the VAT return, and a VAT report per period that anyone may propose and only the stricter accounting.approver group may approve. UNVERIFIED: nothing in this package has been checked against Skatteverket (form SKV 4700) or the SIE specification. Every VAT box and every VAT code starts as unverified, the package ships no box or code rows, and a report cannot be approved until the approver confirms that the boxes were compared with the official form. The package contains no chart of accounts: the BAS chart is not redistributed here (decision D34), account numbers are chosen by the user, and a later version takes a BAS file supplied by the licensee. Amounts are money fields in minor units (ore) and rates are in basis points. Nothing is filed with Skatteverket from here."
author = "SpaceCorps"
summary = "Swedish company data, voucher series, VAT codes, boxes and a VAT report. All VAT mappings UNVERIFIED."
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["accounting", "sweden", "vat", "moms"]
categories = ["finance"]
maturity = "experimental"
requires_core = "^0.2.1"

[module.dependencies]
accounting = "^0.3"

[[model]]
name = "accounting_se_company"
description = "The Swedish company the books belong to; normally one record"
read_group = "accounting.user"
write_group = "accounting.manager"

  [[model.field]]
  name = "name"
  description = "Legal name of the company"
  class = "none"
  required = true

  [[model.field]]
  name = "org_number"
  description = "Organisation number (organisationsnummer), ten digits such as 556000-0000; for a sole trader it is a personal identity number, so it is personal data"
  class = "internal"
  personal_data = true
  max_length = 13

  [[model.field]]
  name = "vat_number"
  description = "VAT registration number (momsregistreringsnummer) such as SE556000000001; empty when the company is not VAT registered"
  class = "internal"
  max_length = 14

  [[model.field]]
  name = "f_skatt"
  description = "Whether the company holds F-tax approval (godkand for F-skatt)"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "fiscal_year_start_month"
  description = "Month the fiscal year starts, 1 to 12; 1 means a calendar year"
  class = "none"
  kind = "number"
  required = true
  min = 1
  max = 12

  [[model.field]]
  name = "vat_period"
  description = "How often the VAT return is made: monthly, quarterly, yearly"
  class = "none"
  kind = "select"
  options = ["monthly", "quarterly", "yearly"]
  required = true

  [[model.field]]
  name = "currency"
  description = "ISO 4217 currency code of the books, normally SEK"
  class = "none"
  required = true
  max_length = 3
  min_length = 3

  [[model.field]]
  name = "address"
  description = "Registered address"
  class = "internal"
  kind = "longtext"

  [[model.field]]
  name = "contact_email"
  description = "Contact email for the books"
  class = "internal"
  personal_data = true

[[model]]
name = "accounting_se_voucher_series"
description = "A voucher series (verifikationsserie), a letter such as A that groups vouchers of one kind"
read_group = "accounting.user"
write_group = "accounting.manager"

  [[model.field]]
  name = "code"
  description = "Series code, one to three letters, for example A; no two series share a code"
  class = "none"
  required = true
  unique = true
  max_length = 3
  min_length = 1

  [[model.field]]
  name = "name"
  description = "What the series holds, for example Manual vouchers"
  class = "none"
  required = true

  [[model.field]]
  name = "journal_id"
  description = "The accounting journal whose entries belong to this series"
  class = "none"
  kind = "ref"
  to = "accounting_journal"

  [[model.field]]
  name = "is_default"
  description = "Whether this is the series used when none is named"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "active"
  description = "Whether the series can still be used"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "note"
  description = "Remarks about how the series is used"
  class = "none"
  kind = "longtext"

[[model]]
name = "accounting_se_vat_box"
description = "A box of the Swedish VAT return (momsdeklaration). UNVERIFIED until checked against SKV 4700"
read_group = "accounting.user"
write_group = "accounting.manager"

  [[model.field]]
  name = "box"
  description = "Box number as printed on the form, for example 05; no two boxes share a number"
  class = "none"
  required = true
  unique = true
  max_length = 4

  [[model.field]]
  name = "label"
  description = "Box title in Swedish as printed on the form"
  class = "none"
  required = true

  [[model.field]]
  name = "kind"
  description = "What the box holds: base (taxable amount), output (output VAT), input (input VAT), result (VAT to pay or reclaim)"
  class = "none"
  kind = "select"
  options = ["base", "output", "input", "result"]
  required = true

  [[model.field]]
  name = "not_used"
  description = "Whether the company does not use this box; an amount landing in a box marked not used is a mistake"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "review"
  description = "Verification status of this box: unverified, verified. Starts unverified; only the approver verifies it, after checking it against SKV 4700"
  class = "none"
  kind = "select"
  options = ["unverified", "verified"]
  required = true

  [[model.field]]
  name = "verified"
  description = "Whether this box has been verified by the owner; false until then"
  class = "none"
  kind = "bool"
  computed = 'review == "verified"'

  [[model.field]]
  name = "verified_by"
  description = "Login name of the person who verified it"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "verified_on"
  description = "Date it was verified (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "source"
  description = "Where the box comes from and what was checked, for example the SKV 4700 edition; empty means no source was checked"
  class = "none"
  kind = "longtext"

  [[model.action]]
  name = "verify"
  description = "Mark the box as checked against SKV 4700 (approver only)"
  field = "review"
  from = "unverified"
  to = "verified"
  group = "accounting.approver"
  approval = true

  [[model.action]]
  name = "unverify"
  description = "Withdraw the verification of the box (approver only)"
  field = "review"
  from = "verified"
  to = "unverified"
  group = "accounting.approver"
  approval = true

[[model]]
name = "accounting_se_vat_code"
description = "A VAT code that a ledger line can carry, mapped to a base box, a VAT box and accounts. UNVERIFIED until checked against SKV 4700"
read_group = "accounting.user"
write_group = "accounting.manager"

  [[model.field]]
  name = "code"
  description = "Short code such as S25 (sale at 25 percent); no two codes share a value"
  class = "none"
  required = true
  unique = true
  max_length = 12

  [[model.field]]
  name = "label"
  description = "What the code means in words"
  class = "none"
  required = true

  [[model.field]]
  name = "treatment"
  description = "Kind of transaction: sale_domestic, purchase_domestic, reverse_charge_eu, reverse_charge_non_eu, sale_eu_goods, sale_eu_services, export, exempt, none"
  class = "none"
  kind = "select"
  options = ["sale_domestic", "purchase_domestic", "reverse_charge_eu", "reverse_charge_non_eu", "sale_eu_goods", "sale_eu_services", "export", "exempt", "none"]
  required = true

  [[model.field]]
  name = "rate_bp"
  description = "VAT rate in basis points: 2500 means 25.00 percent, 1200 12.00, 600 6.00, 0 none"
  class = "none"
  kind = "number"
  required = true
  min = 0
  max = 10000

  [[model.field]]
  name = "base_box_id"
  description = "Box that receives the net amount of lines with this code; empty when none"
  class = "none"
  kind = "ref"
  to = "accounting_se_vat_box"

  [[model.field]]
  name = "base_side"
  description = "Which side of the line counts as the base: credit or debit"
  class = "none"
  kind = "select"
  options = ["credit", "debit"]

  [[model.field]]
  name = "vat_box_id"
  description = "Box that receives the VAT amount booked on the VAT account; empty when none"
  class = "none"
  kind = "ref"
  to = "accounting_se_vat_box"

  [[model.field]]
  name = "vat_account_id"
  description = "Account the VAT amount is booked on. Chosen by the user from their own chart; the package seeds none"
  class = "none"
  kind = "ref"
  to = "accounting_account"

  [[model.field]]
  name = "vat_side"
  description = "Which side of the VAT account counts as VAT for the box: credit or debit"
  class = "none"
  kind = "select"
  options = ["credit", "debit"]

  [[model.field]]
  name = "tax_id"
  description = "The accounting tax rate this code stands for, if one exists"
  class = "none"
  kind = "ref"
  to = "accounting_tax"

  [[model.field]]
  name = "active"
  description = "Whether the code can still be put on new lines"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "review"
  description = "Verification status of this code: unverified, verified. Starts unverified; only the approver verifies it, after checking it against SKV 4700"
  class = "none"
  kind = "select"
  options = ["unverified", "verified"]
  required = true

  [[model.field]]
  name = "verified"
  description = "Whether this code has been verified by the owner; false until then"
  class = "none"
  kind = "bool"
  computed = 'review == "verified"'

  [[model.field]]
  name = "verified_by"
  description = "Login name of the person who verified it"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "verified_on"
  description = "Date it was verified (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "source"
  description = "Where the code comes from and what was checked, for example the SKV 4700 edition; empty means no source was checked"
  class = "none"
  kind = "longtext"

  [[model.action]]
  name = "verify"
  description = "Mark the code as checked against SKV 4700 (approver only)"
  field = "review"
  from = "unverified"
  to = "verified"
  group = "accounting.approver"
  approval = true

  [[model.action]]
  name = "unverify"
  description = "Withdraw the verification of the code (approver only)"
  field = "review"
  from = "verified"
  to = "unverified"
  group = "accounting.approver"
  approval = true

[[model]]
name = "accounting_se_vat_report"
description = "A VAT report (momsrapport) for one period, prepared from the ledger and approved by a person before it is used. UNVERIFIED: not compared with SKV 4700 by this package"
read_group = "accounting.user"
write_group = "accounting.user"

  [[model.field]]
  name = "name"
  description = "Period name, for example 2026-Q3"
  class = "none"
  required = true
  unique = true

  [[model.field]]
  name = "period_kind"
  description = "Length of the period: month, quarter, year"
  class = "none"
  kind = "select"
  options = ["month", "quarter", "year"]
  required = true

  [[model.field]]
  name = "start_on"
  description = "First day of the period (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  required = true

  [[model.field]]
  name = "end_on"
  description = "Last day of the period (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  required = true

  [[model.field]]
  name = "due_on"
  description = "Date the return is due; entered by the preparer, the package does not compute it"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "company_id"
  description = "The company the report is for"
  class = "none"
  kind = "ref"
  to = "accounting_se_company"

  [[model.field]]
  name = "output_vat"
  description = "Total output VAT of the period in ore, the sum of the output lines"
  class = "financial"
  kind = "money"
  computed = 'sum(lines.amount where kind == "output")'

  [[model.field]]
  name = "input_vat"
  description = "Total deductible input VAT of the period in ore, the sum of the input lines"
  class = "financial"
  kind = "money"
  computed = 'sum(lines.amount where kind == "input")'

  [[model.field]]
  name = "vat_to_pay"
  description = "Output VAT minus input VAT in ore; negative means a refund (box 49)"
  class = "financial"
  kind = "money"
  computed = 'output_vat - input_vat'

  [[model.field]]
  name = "boxes_confirmed"
  description = "The approver confirms that every box of the report was compared with form SKV 4700 and that the mappings used are verified"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "notes"
  description = "Remarks of the preparer or the approver"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Report status: draft, proposed, approved, filed"
  class = "none"
  kind = "select"
  options = ["draft", "proposed", "approved", "filed"]
  required = true

  [[model.action]]
  name = "propose"
  description = "Propose the report for approval; agents may do this"
  field = "state"
  from = "draft"
  to = "proposed"

  [[model.action]]
  name = "withdraw"
  description = "Send a proposed report back to draft"
  field = "state"
  from = "proposed"
  to = "draft"

  [[model.action]]
  name = "approve"
  description = "Approve the report (approver only; the boxes must be confirmed as checked against SKV 4700)"
  field = "state"
  from = "proposed"
  to = "approved"
  group = "accounting.approver"
  approval = true
  assert = [{ expr = "boxes_confirmed", message = "The boxes were not confirmed as checked against SKV 4700", key = "boxes_checked" }]

  [[model.action]]
  name = "record_filed"
  description = "Record that the return was filed with Skatteverket outside this system (approver only)"
  field = "state"
  from = "approved"
  to = "filed"
  group = "accounting.approver"
  approval = true

[[model]]
name = "accounting_se_vat_report_line"
description = "One box of a VAT report with its amount"
read_group = "accounting.user"
write_group = "accounting.user"

  [[model.field]]
  name = "report_id"
  description = "The report the line belongs to"
  class = "none"
  kind = "ref"
  to = "accounting_se_vat_report"
  required = true

  [[model.field]]
  name = "box_id"
  description = "The VAT box"
  class = "none"
  kind = "ref"
  to = "accounting_se_vat_box"
  required = true

  [[model.field]]
  name = "kind"
  description = "Kind of the box, copied by the preparer: base, output, input, result"
  class = "none"
  kind = "select"
  options = ["base", "output", "input", "result"]
  required = true

  [[model.field]]
  name = "amount"
  description = "Amount of the box in ore"
  class = "financial"
  kind = "money"
  required = true

  [[model.field]]
  name = "vouchers"
  description = "References of the vouchers that make up the amount, one per line, so a reviewer can trace it"
  class = "none"
  kind = "longtext"
