[module]
id = "website"
version = "0.4.0"
name = "Website"
description = "Content for a public website: pages with a slug and a draft, published, archived flow, navigation menu items, blog posts with a byline and a publish date, translations of both, and the form submissions visitors send in. When the instance runs with the public site enabled it serves the published content to visitors as a server-rendered website with SEO and no login; only the fields marked public are ever visible to them. Publishing makes content public and needs a human approval, agents may only propose it. Senders are personal data and are never public."
author = "SpaceCorps"
summary = "Pages, menus, blog posts and form submissions, served as a public website when the site is on."
license = "AGPL-3.0-or-later"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["website", "cms", "blog", "seo"]
categories = ["marketing"]
maturity = "beta"
requires_core = "^0.2"

[[model]]
name = "website_page"
description = "A page of the website"
read_group = "website.user"
write_group = "website.user"

  [model.public]
  read = true
  published_field = "state"
  published_value = "published"
  gone_value = "archived"
  fields = ["title", "slug", "body", "seo_title", "seo_description", "published_on", "cover_image", "cover_alt"]
  order_by = "title"

  [[model.field]]
  name = "title"
  description = "Page title"
  class = "none"
  required = true

  [[model.field]]
  name = "slug"
  description = "URL path of the page without slashes at the ends, lowercase with dashes, for example about-us. The page with slug home is the front page"
  class = "none"
  required = true

  [[model.field]]
  name = "body"
  description = "Page content in Markdown (a safe subset: headings, lists, links, emphasis, code, quotes, tables)"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "seo_title"
  description = "Title shown in search results; empty means the page title"
  class = "none"

  [[model.field]]
  name = "seo_description"
  description = "Description shown in search results"
  class = "none"

  [[model.field]]
  name = "published_on"
  description = "Day the page went public (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "cover_image"
  description = "Picture shown at the top of the page and in link previews (PNG, JPEG, WebP or GIF, re-encoded on upload)"
  class = "none"
  kind = "image"

  [[model.field]]
  name = "cover_alt"
  description = "Text that describes the cover picture for people who cannot see it"
  class = "none"

  [[model.field]]
  name = "state"
  description = "Page status: draft, published, archived"
  class = "none"
  kind = "select"
  options = ["draft", "published", "archived"]
  required = true

  [[model.action]]
  name = "publish"
  description = "Make the page public (manager only)"
  field = "state"
  from = "draft"
  to = "published"
  group = "website.manager"
  approval = true

  [[model.action]]
  name = "unpublish"
  description = "Take the page offline and back to draft"
  field = "state"
  from = "published"
  to = "draft"
  group = "website.manager"

  [[model.action]]
  name = "archive"
  description = "Retire a published page for good"
  field = "state"
  from = "published"
  to = "archived"
  group = "website.manager"

[[model]]
name = "website_menu_item"
description = "An entry of the site navigation"
read_group = "website.user"
write_group = "website.manager"

  [model.public]
  read = true
  published_field = "visible"
  fields = ["label", "url", "sequence", "new_window"]
  order_by = "sequence"

  [[model.field]]
  name = "label"
  description = "Text shown in the menu"
  class = "none"
  required = true

  [[model.field]]
  name = "url"
  description = "Where the entry leads: a page slug starting with a slash or a full address"
  class = "none"
  required = true

  [[model.field]]
  name = "parent_id"
  description = "The entry this one is nested under; empty for a top-level entry"
  class = "none"
  kind = "ref"
  to = "website_menu_item"

  [[model.field]]
  name = "sequence"
  description = "Order among its siblings, lowest first"
  class = "none"
  kind = "number"

  [[model.field]]
  name = "visible"
  description = "Whether the entry is shown"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "new_window"
  description = "Whether the link opens in a new window"
  class = "none"
  kind = "bool"

[[model]]
name = "website_blog_post"
description = "A blog post"
read_group = "website.user"
write_group = "website.user"

  [model.public]
  read = true
  published_field = "state"
  published_value = "published"
  gone_value = "archived"
  fields = ["title", "slug", "byline", "summary", "body", "tags", "published_on", "cover_image", "cover_alt"]
  order_by = "published_on"
  order_dir = "desc"

  [[model.field]]
  name = "title"
  description = "Post title"
  class = "none"
  required = true

  [[model.field]]
  name = "slug"
  description = "URL part of the post, lowercase with dashes"
  class = "none"
  required = true

  [[model.field]]
  name = "author_name"
  description = "Name of the author, for the team's own records"
  class = "public_directory"
  personal_data = true
  required = true

  [[model.field]]
  name = "byline"
  description = "Author line shown publicly, for example the team or brand name; use a name here only if the person agreed to it"
  class = "none"

  [[model.field]]
  name = "summary"
  description = "Teaser shown in listings"
  class = "none"

  [[model.field]]
  name = "body"
  description = "Post content in Markdown (a safe subset: headings, lists, links, emphasis, code, quotes, tables)"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "tags"
  description = "Comma-separated tags, for example news,product"
  class = "none"

  [[model.field]]
  name = "published_on"
  description = "Day the post is dated (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "cover_image"
  description = "Picture shown at the top of the post and in link previews (PNG, JPEG, WebP or GIF, re-encoded on upload)"
  class = "none"
  kind = "image"

  [[model.field]]
  name = "cover_alt"
  description = "Text that describes the cover picture for people who cannot see it"
  class = "none"

  [[model.field]]
  name = "state"
  description = "Post status: draft, published, archived"
  class = "none"
  kind = "select"
  options = ["draft", "published", "archived"]
  required = true

  [[model.action]]
  name = "publish"
  description = "Make the post public (manager only)"
  field = "state"
  from = "draft"
  to = "published"
  group = "website.manager"
  approval = true

  [[model.action]]
  name = "unpublish"
  description = "Take the post offline and back to draft"
  field = "state"
  from = "published"
  to = "draft"
  group = "website.manager"

  [[model.action]]
  name = "archive"
  description = "Retire a published post"
  field = "state"
  from = "published"
  to = "archived"
  group = "website.manager"

[[model]]
name = "website_form_submission"
description = "A message a visitor sent through a form on the site"
read_group = "website.user"
write_group = "website.user"

  [model.public]
  submit = true
  submit_fields = ["sender_name", "sender_email", "sender_phone", "message", "consent_given"]
  rate_limit_per_hour = 10

  [[model.field]]
  name = "form_name"
  description = "Which form it came from, for example contact"
  class = "none"
  required = true

  [[model.field]]
  name = "sender_name"
  description = "Name the visitor gave"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "sender_email"
  description = "Email address the visitor gave"
  class = "internal"
  personal_data = true
  required = true

  [[model.field]]
  name = "sender_phone"
  description = "Phone number the visitor gave"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "message"
  description = "What the visitor wrote"
  class = "internal"
  personal_data = true
  kind = "longtext"

  [[model.field]]
  name = "source_page"
  description = "Slug of the page the form was on"
  class = "none"

  [[model.field]]
  name = "submitted_on"
  description = "Day of the submission (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "consent_given"
  description = "Whether the visitor ticked the consent box for being contacted"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "state"
  description = "Handling status: new, handled, spam"
  class = "none"
  kind = "select"
  options = ["new", "handled", "spam"]
  required = true

  [[model.action]]
  name = "handle"
  description = "Mark the message as answered or dealt with"
  field = "state"
  from = "new"
  to = "handled"

  [[model.action]]
  name = "mark_spam"
  description = "Mark the message as spam"
  field = "state"
  from = "new"
  to = "spam"

[[model]]
name = "website_page_translation"
description = "A page translated into another language; the public site shows it to visitors who read that language"
read_group = "website.user"
write_group = "website.user"

  [model.public]
  read = true
  published_field = "published"
  fields = ["page_id", "lang", "title", "body", "seo_title", "seo_description"]

  [[model.field]]
  name = "page_id"
  description = "The page this translates"
  class = "none"
  kind = "ref"
  to = "website_page"
  required = true

  [[model.field]]
  name = "lang"
  description = "Language of the translation: en, de, fr, pl, fi, sv or es"
  class = "none"
  kind = "select"
  options = ["en", "de", "fr", "pl", "fi", "sv", "es"]
  required = true

  [[model.field]]
  name = "title"
  description = "Translated page title"
  class = "none"
  required = true

  [[model.field]]
  name = "body"
  description = "Translated page content in Markdown"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "seo_title"
  description = "Translated title shown in search results"
  class = "none"

  [[model.field]]
  name = "seo_description"
  description = "Translated description shown in search results"
  class = "none"

  [[model.field]]
  name = "published"
  description = "Whether the translation is shown; it is only reachable while its page is published"
  class = "none"
  kind = "bool"

[[model]]
name = "website_blog_post_translation"
description = "A blog post translated into another language"
read_group = "website.user"
write_group = "website.user"

  [model.public]
  read = true
  published_field = "published"
  fields = ["post_id", "lang", "title", "summary", "body"]

  [[model.field]]
  name = "post_id"
  description = "The post this translates"
  class = "none"
  kind = "ref"
  to = "website_blog_post"
  required = true

  [[model.field]]
  name = "lang"
  description = "Language of the translation: en, de, fr, pl, fi, sv or es"
  class = "none"
  kind = "select"
  options = ["en", "de", "fr", "pl", "fi", "sv", "es"]
  required = true

  [[model.field]]
  name = "title"
  description = "Translated post title"
  class = "none"
  required = true

  [[model.field]]
  name = "summary"
  description = "Translated teaser"
  class = "none"

  [[model.field]]
  name = "body"
  description = "Translated post content in Markdown"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "published"
  description = "Whether the translation is shown; it is only reachable while its post is published"
  class = "none"
  kind = "bool"
