[module]
id = "website"
version = "0.1.0"
name = "Website"
description = "Content for a public website: pages with a slug and a draft, published, archived flow, navigation menu items, blog posts with an author and a publish date, and the form submissions visitors send in. This package stores and organises the content; a UI or site generator renders it. Publishing makes content public and needs a human approval, agents may only propose it. Authors and senders are personal data."
author = "SpaceCorps"

[[model]]
name = "website_page"
description = "A page of the website"
read_group = "website.user"
write_group = "website.user"

  [[model.field]]
  name = "title"
  description = "Page title"
  class = "none"
  required = true

  [[model.field]]
  name = "slug"
  description = "URL path of the page without slashes at the ends, lowercase with dashes, for example about-us"
  class = "none"
  required = true

  [[model.field]]
  name = "body"
  description = "Page content (Markdown or HTML, as the renderer expects)"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "seo_title"
  description = "Title shown in search results; empty means the page title"
  class = "none"

  [[model.field]]
  name = "seo_description"
  description = "Description shown in search results"
  class = "none"

  [[model.field]]
  name = "published_on"
  description = "Day the page went public (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "state"
  description = "Page status: draft, published, archived"
  class = "none"
  kind = "select"
  options = ["draft", "published", "archived"]
  required = true

  [[model.action]]
  name = "publish"
  description = "Make the page public (manager only)"
  field = "state"
  from = "draft"
  to = "published"
  group = "website.manager"
  approval = true

  [[model.action]]
  name = "unpublish"
  description = "Take the page offline and back to draft"
  field = "state"
  from = "published"
  to = "draft"
  group = "website.manager"

  [[model.action]]
  name = "archive"
  description = "Retire a published page for good"
  field = "state"
  from = "published"
  to = "archived"
  group = "website.manager"

[[model]]
name = "website_menu_item"
description = "An entry of the site navigation"
read_group = "website.user"
write_group = "website.manager"

  [[model.field]]
  name = "label"
  description = "Text shown in the menu"
  class = "none"
  required = true

  [[model.field]]
  name = "url"
  description = "Where the entry leads: a page slug starting with a slash or a full address"
  class = "none"
  required = true

  [[model.field]]
  name = "parent_id"
  description = "The entry this one is nested under; empty for a top-level entry"
  class = "none"
  kind = "ref"
  to = "website_menu_item"

  [[model.field]]
  name = "sequence"
  description = "Order among its siblings, lowest first"
  class = "none"
  kind = "number"

  [[model.field]]
  name = "visible"
  description = "Whether the entry is shown"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "new_window"
  description = "Whether the link opens in a new window"
  class = "none"
  kind = "bool"

[[model]]
name = "website_blog_post"
description = "A blog post"
read_group = "website.user"
write_group = "website.user"

  [[model.field]]
  name = "title"
  description = "Post title"
  class = "none"
  required = true

  [[model.field]]
  name = "slug"
  description = "URL part of the post, lowercase with dashes"
  class = "none"
  required = true

  [[model.field]]
  name = "author_name"
  description = "Name of the author shown on the post"
  class = "public_directory"
  personal_data = true
  required = true

  [[model.field]]
  name = "summary"
  description = "Teaser shown in listings"
  class = "none"

  [[model.field]]
  name = "body"
  description = "Post content (Markdown or HTML, as the renderer expects)"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "tags"
  description = "Comma-separated tags, for example news,product"
  class = "none"

  [[model.field]]
  name = "published_on"
  description = "Day the post is dated (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "state"
  description = "Post status: draft, published, archived"
  class = "none"
  kind = "select"
  options = ["draft", "published", "archived"]
  required = true

  [[model.action]]
  name = "publish"
  description = "Make the post public (manager only)"
  field = "state"
  from = "draft"
  to = "published"
  group = "website.manager"
  approval = true

  [[model.action]]
  name = "unpublish"
  description = "Take the post offline and back to draft"
  field = "state"
  from = "published"
  to = "draft"
  group = "website.manager"

  [[model.action]]
  name = "archive"
  description = "Retire a published post"
  field = "state"
  from = "published"
  to = "archived"
  group = "website.manager"

[[model]]
name = "website_form_submission"
description = "A message a visitor sent through a form on the site"
read_group = "website.user"
write_group = "website.user"

  [[model.field]]
  name = "form_name"
  description = "Which form it came from, for example contact"
  class = "none"
  required = true

  [[model.field]]
  name = "sender_name"
  description = "Name the visitor gave"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "sender_email"
  description = "Email address the visitor gave"
  class = "internal"
  personal_data = true
  required = true

  [[model.field]]
  name = "sender_phone"
  description = "Phone number the visitor gave"
  class = "internal"
  personal_data = true

  [[model.field]]
  name = "message"
  description = "What the visitor wrote"
  class = "internal"
  personal_data = true
  kind = "longtext"

  [[model.field]]
  name = "source_page"
  description = "Slug of the page the form was on"
  class = "none"

  [[model.field]]
  name = "submitted_on"
  description = "Day of the submission (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "consent_given"
  description = "Whether the visitor ticked the consent box for being contacted"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "state"
  description = "Handling status: new, handled, spam"
  class = "none"
  kind = "select"
  options = ["new", "handled", "spam"]
  required = true

  [[model.action]]
  name = "handle"
  description = "Mark the message as answered or dealt with"
  field = "state"
  from = "new"
  to = "handled"

  [[model.action]]
  name = "mark_spam"
  description = "Mark the message as spam"
  field = "state"
  from = "new"
  to = "spam"
