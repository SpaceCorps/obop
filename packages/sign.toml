[module]
id = "sign"
version = "0.2.4"
name = "Sign"
description = "Document templates and signature requests with a draft, sent, signed, declined, expired flow. A request names the signer (personal data) and keeps the signature evidence. A request can point at a PDF in Documents: sending it takes the SHA-256 of the file and keeps an exact copy, and a person with the manager role creates a one-time signing link that the signer opens without an account to read that copy, type their full name and agree. This is a simple electronic signature only: a typed name does not prove who typed it, the time is the server clock, and the address is the one the proxy chain reports. At signing the evidence is stored on the request and an entry is written to the security log (the log has only read commands, so no caller can write or change an entry through a command; the server writes the entries, and the database does not stop someone who can write it). A manager can switch on a history for files that several named people sign together: the signer then sees the typed names and the times of the others who signed the same file. A signed request can be changed or deleted only by an administrator, who can still change any record. Sending and recording a signature need a human approval for agents, and agents cannot create signing links."
author = "SpaceCorps"
summary = "Document templates and signature requests; a PDF from Documents can be signed through a one-time link. Simple electronic signature."
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["signature", "e-sign", "contracts"]
categories = ["productivity"]
maturity = "experimental"
requires_core = "^0.2.2"
home = "sign_request"
changelog = "Clearer screens: the app opens on Signature requests, with business names, list columns, saved filters, status colours and the evidence and sent file in their own folded sections, shown once a request is sent or signed. Signing links stay on their request. A new template can be used at once, sending a request from a template stamps the day it was sent, and marking a request signed by hand stamps the day it was signed."

[module.dependencies]
documents = ">=0.3, <1"

[[model]]
name = "sign_template"
description = "A document that can be sent out for signature"
read_group = "sign.user"
write_group = "sign.manager"

  [model.ui]
  title = "{name}"
  subtitle = "{signer_role}"
  list = ["name", "signer_role", "active"]
  quick_create = ["name", "signer_role"]
  order = "name asc"
  default_view = "list"
  menu = "configuration"
  menu_order = 1

  [[model.field]]
  name = "name"
  description = "Template name, for example Employment contract"
  class = "none"
  required = true

  [[model.field]]
  name = "description"
  description = "What the document is for and who signs it"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "body"
  description = "The document text, or a reference to where the file is kept"
  class = "none"
  kind = "longtext"

    [model.field.ui]
    display = "markdown"

  [[model.field]]
  name = "signer_role"
  description = "Role of the person who signs, for example Customer"
  class = "none"

  [[model.field]]
  name = "active"
  description = "Whether new requests can use the template"
  class = "none"
  kind = "bool"
  default = true

[[model]]
name = "sign_request"
description = "A request for one person to sign one document"
read_group = "sign.user"
write_group = "sign.user"

  [model.ui]
  title = "{title}"
  subtitle = "{signer_name}"
  list = ["title", "signer_name", "document_id", "sent_on", "expires_on", "state"]
  card = ["title", "signer_name", "document_id", "expires_on"]
  quick_create = ["title", "document_id", "signer_name"]
  default_view = "kanban"
  menu = "main"
  menu_order = 1
  report = { rows = "state", cols = "template_id" }

  [[model.ui.section]]
  label = "Request"
  fields = ["document_id", "template_id", "title", "signer_name", "signer_email", "message", "expires_on"]

  [[model.ui.section]]
  label = "Options"
  fields = ["show_history"]
  collapsed = true

  [[model.ui.section]]
  label = "Sent file"
  fields = ["sent_on", "document_hash", "document_file"]
  collapsed = true
  show_in = ["sent", "signed", "declined", "expired"]

  [[model.ui.section]]
  label = "Evidence"
  fields = ["signed_on", "signed_at", "signed_name", "signer_ip", "signer_user_agent", "signature_reference", "consent_version"]
  collapsed = true
  show_in = ["signed"]

  [[model.ui.filter]]
  label = "Waiting for signature"
  where = "state = sent"

  [[model.ui.filter]]
  label = "Signed"
  where = "state = signed"

  [[model.ui.filter]]
  label = "Expiring soon"
  where = "state = sent && expires_on != null && expires_on <= today+3"

  [[model.field]]
  name = "template_id"
  description = "The document template to send; empty for a request about a document in Documents"
  class = "none"
  kind = "ref"
  to = "sign_template"

  [[model.field]]
  name = "document_id"
  description = "The PDF in Documents that the signer reads and signs; sending the request takes its SHA-256 and keeps an exact copy"
  class = "none"
  kind = "ref"
  to = "documents_document"

  [[model.field]]
  name = "title"
  description = "Subject shown to the signer"
  class = "none"
  required = true

  [[model.field]]
  name = "message"
  description = "Message shown to the signer in the request"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "signer_name"
  description = "Name of the person who must sign"
  class = "internal"
  personal_data = true
  required = true

  [[model.field]]
  name = "signer_email"
  description = "Email address of the signer; optional, no email is sent for a request about a document"
  class = "internal"
  personal_data = true

    [model.field.ui]
    display = "email"

  [[model.field]]
  name = "sent_on"
  description = "Day the request was sent (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "expires_on"
  description = "Last day the request can be signed (YYYY-MM-DD)"
  class = "none"
  kind = "date"

    [model.field.ui]
    warn_before_days = 3

  [[model.field]]
  name = "show_history"
  description = "Lists on the signer's page who signed this same file (same Document and SHA-256) through a request with this box ticked: typed name and time. The signer is told before signing that theirs are shown too. Only for a file several named people sign together, never one sent to unrelated people. A request signed before the box was ticked is never listed. Off when empty"
  class = "none"
  kind = "bool"
  group = "sign.manager"

  [[model.field]]
  name = "signed_on"
  description = "Day the document was signed (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "signer_ip"
  description = "Address the signature came from as reported by the proxy chain (evidence)"
  class = "internal"
  personal_data = true
  group = "sign.manager"

  [[model.field]]
  name = "signer_user_agent"
  description = "Browser the signature was made with (evidence)"
  class = "internal"
  personal_data = true
  group = "sign.manager"

  [[model.field]]
  name = "signature_reference"
  description = "Where the signature is kept; typed:NAME for a typed name given through a link, so it is personal data like the name itself"
  class = "internal"
  personal_data = true
  group = "sign.manager"

  [[model.field]]
  name = "document_hash"
  description = "SHA-256 hash (hex) of the file that was sent for signature; set when a request about a document is sent. The record is not tamper-proof: an administrator or whoever can write the database can change it"
  class = "none"
  group = "sign.manager"

  [[model.field]]
  name = "document_file"
  description = "The exact copy of the PDF that was sent for signature, kept so that replacing the file in Documents cannot change what was signed; nobody holds the group, so only an administrator reads it"
  class = "internal"
  kind = "file"
  group = "sign.system"

  [[model.field]]
  name = "signed_at"
  description = "When the signer signed through the link (UTC, server clock)"
  class = "none"
  kind = "datetime"
  group = "sign.manager"

  [[model.field]]
  name = "signed_name"
  description = "The full name the signer typed (evidence); signer_name stays the name that was asked for"
  class = "internal"
  personal_data = true
  group = "sign.manager"

  [[model.field]]
  name = "consent_version"
  description = "Id of the consent wording: its version, the language of the post (the form's lang if it names one of the seven; if the form has no lang field at all, the address's; otherwise the browser's, the instance's, then English; not proof of the page that was shown) and the first 8 hex characters of a hash of the texts of that language, for example v1-draft/en/a05c68c3"
  class = "none"
  group = "sign.manager"

  [[model.field]]
  name = "state"
  description = "Request status: draft, sent, signed, declined, expired"
  class = "none"
  kind = "select"
  options = ["draft", "sent", "signed", "declined", "expired"]
  required = true

    [model.field.ui]
    tones = { draft = "neutral", sent = "info", signed = "ok", declined = "bad", expired = "bad" }

  [[model.action]]
  name = "send"
  description = "Send the request to the signer"
  field = "state"
  from = "draft"
  to = "sent"
  approval = true

    [model.action.ui]
    done = "Sent to the signer"

    [[model.action.effect]]
    kind = "set"
    set = { sent_on = "$today" }
    when = "!is_set(sent_on)"

  [[model.action]]
  name = "sign"
  description = "Record by hand that the signer signed; only for a request that is not about a Document, because a request about a Document is signed by the signer through the link"
  field = "state"
  from = "sent"
  to = "signed"
  group = "sign.manager"
  approval = true
  assert = [{ expr = "!is_set(document_id) && !is_set(document_file) && (!is_set(document_hash) || is_set(template_id))", message = "A request about a Document is signed by the signer through the signing link; it cannot be marked signed by hand", key = "document_request" }]

    [model.action.ui]
    confirm = "Record that the signer signed? A request about a document is signed through its signing link instead."
    done = "Marked as signed"

    [[model.action.effect]]
    kind = "set"
    set = { signed_on = "$today" }
    when = "!is_set(signed_on)"

  [[model.action]]
  name = "decline"
  description = "Record that the signer declined"
  field = "state"
  from = "sent"
  to = "declined"

    [model.action.ui]
    danger = true
    confirm = "Record that the signer declined?"
    done = "Marked as declined"

  [[model.action]]
  name = "expire"
  description = "Record that the request ran out unsigned"
  field = "state"
  from = "sent"
  to = "expired"

    [model.action.ui]
    danger = true
    confirm = "Record that the request ran out unsigned?"
    done = "Marked as expired"

  [[model.action]]
  name = "send_document"
  description = "Send a request about a document in Documents: takes the SHA-256 of the PDF, keeps an exact copy and moves the request to sent; create the signing link afterwards"
  field = "state"
  from = "draft"
  to = "sent"
  approval = true

    [model.action.ui]
    done = "Sent. Create the signing link next."

[[model]]
name = "sign_link"
description = "A one-time link that lets one person sign one request; only a hash of the secret is kept, so the link is shown once when it is created"
read_group = "sign.user"
write_group = "sign.manager"

  [model.ui]
  title = "{request_id}"
  list = ["request_id", "expires_at", "used_at", "revoked_at"]
  order = "expires_at desc"
  default_view = "list"
  menu = "hidden"

  [[model.field]]
  name = "request_id"
  description = "The signing request this link opens"
  class = "none"
  kind = "ref"
  to = "sign_request"
  required = true

  [[model.field]]
  name = "expires_at"
  description = "When the link stops working (UTC); at most 14 days after it was created, and never after the last day of the request"
  class = "none"
  kind = "datetime"

  [[model.field]]
  name = "used_at"
  description = "When the link was used to sign (UTC); a link works once"
  class = "none"
  kind = "datetime"

  [[model.field]]
  name = "revoked_at"
  description = "When the link was revoked (UTC); set it to revoke the link"
  class = "none"
  kind = "datetime"

  [[model.field]]
  name = "link"
  description = "The link itself: in the answer to create only, shown once, never stored and never returned by get, list or search"
  class = "internal"
  group = "sign.manager"

    [model.field.ui]
    hidden = true
