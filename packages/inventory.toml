[module]
id = "inventory"
version = "0.3.0"
name = "Inventory"
description = "Warehouses, stock locations, stock levels and stock moves. Validating a move takes the quantity out of the stock item at the source location and adds it to the item at the destination, in one step; an item that does not exist yet is created. There is one item per product, location and lot. Negative quantities are allowed, as for virtual locations such as suppliers."
author = "SpaceCorps"
summary = "Warehouses, stock locations, stock levels and stock moves."
license = "AGPL-3.0-or-later"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["inventory", "stock", "warehouses"]
categories = ["supply-chain"]
maturity = "beta"
requires_core = "^0.2"

[module.dependencies]
product = "^0.2"

[[model]]
name = "inventory_warehouse"
description = "A building or site where stock is kept"
read_group = "inventory.user"
write_group = "inventory.manager"

  [[model.field]]
  name = "name"
  description = "Warehouse name"
  class = "none"
  required = true

  [[model.field]]
  name = "code"
  description = "Short code printed on documents, for example WH1"
  class = "none"
  required = true

  [[model.field]]
  name = "address"
  description = "Postal address of the site"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "active"
  description = "Whether the warehouse is in use"
  class = "none"
  kind = "bool"

[[model]]
name = "inventory_location"
description = "A place inside a warehouse where stock can sit"
read_group = "inventory.user"
write_group = "inventory.manager"

  [[model.field]]
  name = "name"
  description = "Location name, for example Shelf A3"
  class = "none"
  required = true

  [[model.field]]
  name = "warehouse_id"
  description = "The warehouse the location belongs to"
  class = "none"
  kind = "ref"
  to = "inventory_warehouse"
  required = true

  [[model.field]]
  name = "kind"
  description = "What the location is used for: internal, receiving, shipping, transit, scrap"
  class = "none"
  kind = "select"
  options = ["internal", "receiving", "shipping", "transit", "scrap"]
  required = true

  [[model.field]]
  name = "active"
  description = "Whether the location is in use"
  class = "none"
  kind = "bool"

[[model]]
name = "inventory_item"
description = "The quantity of one product held at one location"
read_group = "inventory.user"
write_group = "inventory.manager"

  [[model.field]]
  name = "product_id"
  description = "The product held; there is one item per product, location and lot"
  class = "none"
  kind = "ref"
  to = "product"
  required = true
  unique = true
  unique_with = ["location_id", "lot"]

  [[model.field]]
  name = "location_id"
  description = "Where it is held"
  class = "none"
  kind = "ref"
  to = "inventory_location"
  required = true

  [[model.field]]
  name = "quantity"
  description = "Units on hand"
  class = "none"
  kind = "number"
  required = true

  [[model.field]]
  name = "reorder_level"
  description = "Quantity at or below which the product should be replenished"
  class = "none"
  kind = "number"

  [[model.field]]
  name = "lot"
  description = "Lot or batch number, if tracked"
  class = "none"

[[model]]
name = "inventory_move"
description = "A movement of a product between locations, or into or out of the business"
read_group = "inventory.user"
write_group = "inventory.user"

  [[model.field]]
  name = "reference"
  description = "Number of the move such as MV-00042, assigned when the move is created"
  class = "none"
  kind = "sequence"
  format = "MV-{seq:05}"

  [[model.field]]
  name = "product_id"
  description = "The product moved"
  class = "none"
  kind = "ref"
  to = "product"
  required = true

  [[model.field]]
  name = "from_location_id"
  description = "Where it leaves; empty for a receipt from a supplier"
  class = "none"
  kind = "ref"
  to = "inventory_location"

  [[model.field]]
  name = "to_location_id"
  description = "Where it arrives; empty for a delivery to a customer"
  class = "none"
  kind = "ref"
  to = "inventory_location"

  [[model.field]]
  name = "quantity"
  description = "Units moved"
  class = "none"
  kind = "number"
  required = true

  [[model.field]]
  name = "scheduled_on"
  description = "Date the move is planned for (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "state"
  description = "Move status: draft, done, cancelled"
  class = "none"
  kind = "select"
  options = ["draft", "done", "cancelled"]
  required = true

  [[model.action]]
  name = "validate"
  description = "Confirm that the goods really moved: the quantity leaves the source item and arrives at the destination item (stock managers only); a done move cannot be undone"
  field = "state"
  from = "draft"
  to = "done"
  group = "inventory.manager"
  approval = true

    [[model.action.effect]]
    kind = "adjust"
    model = "inventory_item"
    match = { product_id = "$self.product_id", location_id = "$self.from_location_id" }
    field = "quantity"
    op = "subtract"
    by = "$self.quantity"
    create_missing = true
    when = "is_set(from_location_id)"

    [[model.action.effect]]
    kind = "adjust"
    model = "inventory_item"
    match = { product_id = "$self.product_id", location_id = "$self.to_location_id" }
    field = "quantity"
    op = "add"
    by = "$self.quantity"
    create_missing = true
    when = "is_set(to_location_id)"

  [[model.action]]
  name = "cancel"
  description = "Cancel a draft move"
  field = "state"
  from = "draft"
  to = "cancelled"
