[module]
id = "purchase"
version = "0.3.0"
name = "Purchase"
description = "Vendors, purchase orders and order lines with a draft, sent, confirmed, received and cancelled flow. An order has a number from a series, its total is the sum of its lines, and receiving the goods creates a draft stock move per line at the receiving location (the warehouse validates them)."
author = "SpaceCorps"
summary = "Vendors, purchase orders and order lines with a draft, sent, confirmed, received flow."
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["purchase", "vendors", "orders"]
categories = ["supply-chain"]
maturity = "beta"
requires_core = "^0.2"

[module.dependencies]
base = "^0.2"
product = "^0.2"
inventory = ">=0.3, <1"

[[model]]
name = "purchase_vendor"
description = "Purchasing terms for a contact you buy from"
read_group = "purchase.user"
write_group = "purchase.manager"

  [[model.field]]
  name = "party_id"
  description = "The contact record of the vendor"
  class = "none"
  kind = "ref"
  to = "party"
  required = true

  [[model.field]]
  name = "vendor_reference"
  description = "Your customer number at this vendor"
  class = "none"

  [[model.field]]
  name = "payment_terms_days"
  description = "Days allowed to pay an invoice"
  class = "none"
  kind = "number"

  [[model.field]]
  name = "lead_time_days"
  description = "Usual days between order and delivery"
  class = "none"
  kind = "number"

  [[model.field]]
  name = "iban"
  description = "Bank account the vendor is paid into"
  class = "financial"
  personal_data = true
  group = "purchase.manager"

  [[model.field]]
  name = "active"
  description = "Whether you still buy from this vendor"
  class = "none"
  kind = "bool"

[[model]]
name = "purchase_order"
description = "A request to a vendor to supply goods or services"
read_group = "purchase.user"
write_group = "purchase.user"

  [[model.field]]
  name = "number"
  description = "Purchase order number such as PO-00042, assigned when the order is created"
  class = "none"
  kind = "sequence"
  format = "PO-{seq:05}"

  [[model.field]]
  name = "reference"
  description = "Order number printed on the document"
  class = "none"
  required = true

  [[model.field]]
  name = "vendor_id"
  description = "The vendor ordered from"
  class = "none"
  kind = "ref"
  to = "purchase_vendor"
  required = true

  [[model.field]]
  name = "ordered_on"
  description = "Date the order was placed (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "expected_on"
  description = "Date the goods are expected (YYYY-MM-DD)"
  class = "none"
  kind = "date"

  [[model.field]]
  name = "currency"
  description = "ISO 4217 currency code, for example EUR"
  class = "none"

  [[model.field]]
  name = "receive_location_id"
  description = "Where the goods are to be received; receiving the order creates the stock moves to this location"
  class = "none"
  kind = "ref"
  to = "inventory_location"

  [[model.field]]
  name = "total"
  description = "Order total: the sum of the line amounts (minor currency units, e.g. cents)"
  class = "none"
  kind = "money"
  computed = "sum(lines.amount)"

  [[model.field]]
  name = "notes"
  description = "Delivery instructions and remarks for the vendor"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Order status: draft, sent, confirmed, received, cancelled"
  class = "none"
  kind = "select"
  options = ["draft", "sent", "confirmed", "received", "cancelled"]
  required = true

  [[model.action]]
  name = "send"
  description = "Send a draft order to the vendor as a request for quotation"
  field = "state"
  from = "draft"
  to = "sent"

  [[model.action]]
  name = "confirm"
  description = "Commit to the order with the vendor (manager only)"
  field = "state"
  from = "sent"
  to = "confirmed"
  group = "purchase.manager"
  approval = true

  [[model.action]]
  name = "receive"
  description = "Record that the goods arrived: a draft stock move per line is created for the warehouse to validate (needs the inventory.user group)"
  field = "state"
  from = "confirmed"
  to = "received"

    [[model.action.effect]]
    kind = "create"
    model = "inventory_move"
    for_each = "lines"
    when = "is_set(receive_location_id)"
    map = { product_id = "$line.product_id", to_location_id = "$self.receive_location_id", quantity = "$line.quantity", scheduled_on = "$self.expected_on" }

  [[model.action]]
  name = "cancel"
  description = "Cancel an order that was not yet sent"
  field = "state"
  from = "draft"
  to = "cancelled"

[[model]]
name = "purchase_order_line"
description = "One product or service on a purchase order"
read_group = "purchase.user"
write_group = "purchase.user"

  [[model.field]]
  name = "order_id"
  description = "The order the line belongs to"
  class = "none"
  kind = "ref"
  to = "purchase_order"
  required = true

  [[model.field]]
  name = "product_id"
  description = "The product ordered"
  class = "none"
  kind = "ref"
  to = "product"
  required = true

  [[model.field]]
  name = "description"
  description = "Wording for the vendor if different from the product name"
  class = "none"

  [[model.field]]
  name = "quantity"
  description = "Units ordered"
  class = "none"
  kind = "number"
  required = true

  [[model.field]]
  name = "unit_price"
  description = "Agreed price per unit (minor currency units, e.g. cents)"
  class = "none"
  kind = "money"
  required = true

  [[model.field]]
  name = "amount"
  description = "Line amount: quantity times unit price (minor currency units)"
  class = "none"
  kind = "money"
  computed = "quantity * unit_price"

  [[model.field]]
  name = "received_quantity"
  description = "Units received so far"
  class = "none"
  kind = "number"
