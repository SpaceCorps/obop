[module]
id = "hr"
version = "0.4.0"
name = "Human Resources"
description = "Employees, departments and leave requests. Personal data is classified strictly: pay, bank and national id are visible to managers only, and health and union data to the special reader group. An employee sees and files only their own leave requests; hr.manager sees all of them."
author = "SpaceCorps"
summary = "Employees, departments and leave requests, with pay and health data restricted to the right groups."
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["hr", "employees", "leave"]
categories = ["people"]
maturity = "beta"
requires_core = "^0.2.2"
home = "hr_employee"
changelog = "An employee can be linked to their obop user name, so leave that HR files for them is theirs (they see it: Requested by is filled in from the employee). A department head can be an employee. The back office gains an org chart, and a new leave request starts on the person's own employee record."

[[model]]
name = "hr_department"
description = "A team or department of the company"
read_group = "hr.user"
write_group = "hr.manager"

  [model.ui]
  title = "{name}"
  subtitle = "{head_id} | {head}"
  list = ["name", "head_id", "cost_centre"]
  quick_create = ["name", "head_id"]
  order = "name asc"
  default_view = "list"
  menu = "configuration"
  menu_order = 1

  [[model.child]]
  model = "hr_employee"
  via = "department_id"
  shape = "list"

  [[model.field]]
  name = "name"
  description = "Department name"
  class = "none"
  required = true

  [[model.field]]
  name = "head_id"
  description = "The employee who heads the department"
  class = "none"
  kind = "ref"
  to = "hr_employee"

  [[model.field]]
  name = "head"
  description = "Name of the department head as free text, from before the head could be an employee; leave it empty when Head is set"
  class = "public_directory"
  personal_data = true

  [[model.field]]
  name = "cost_centre"
  description = "Cost centre code used by finance"
  class = "none"

[[model]]
name = "hr_employee"
description = "A person employed by the company"
read_group = "hr.user"
write_group = "hr.manager"

  [model.ui]
  title = "{name}"
  subtitle = "{job_title} · {department_id} | {job_title} | {department_id}"
  list = ["name", "job_title", "department_id", "reports_to_id", "work_email", "work_phone", "state"]
  card = ["photo", "name", "job_title", "department_id", "reports_to_id"]
  quick_create = ["name", "job_title", "department_id"]
  order = "name asc"
  default_view = "gallery"
  menu = "main"
  menu_order = 1
  report = { rows = "department_id", cols = "state" }

  [[model.ui.section]]
  label = "Work"
  fields = ["name", "photo", "job_title", "department_id", "reports_to_id", "work_email", "work_phone"]

  [[model.ui.section]]
  label = "Employment"
  fields = ["hired_on", "contract_type", "user"]

  [[model.ui.section]]
  label = "Private"
  fields = ["private_email", "private_phone", "home_address", "birth_date", "national_id", "emergency_contact"]
  collapsed = true

  [[model.ui.section]]
  label = "Pay"
  fields = ["salary", "bank_iban"]
  collapsed = true

  [[model.ui.section]]
  label = "Sensitive"
  fields = ["union_member", "work_permit_expiry", "health_note"]
  collapsed = true

  [[model.ui.filter]]
  label = "Active"
  where = "state = active"

  [[model.ui.filter]]
  label = "Onboarding"
  where = "state = onboarding"

  [[model.child]]
  model = "hr_leave_request"
  via = "employee_id"
  shape = "list"

  [[model.field]]
  name = "name"
  description = "Full name"
  class = "public_directory"
  personal_data = true
  required = true

  [[model.field]]
  name = "job_title"
  description = "Job title"
  class = "public_directory"
  personal_data = true

  [[model.field]]
  name = "work_email"
  description = "Work email address"
  class = "public_directory"
  personal_data = true

    [model.field.ui]
    display = "email"

  [[model.field]]
  name = "work_phone"
  description = "Work phone number"
  class = "public_directory"
  personal_data = true

    [model.field.ui]
    display = "tel"

  [[model.field]]
  name = "photo"
  description = "Photo of the person (PNG, JPEG, WebP or GIF; metadata such as location is removed on upload). Personal data: never public"
  class = "confidential_hr"
  personal_data = true
  kind = "image"
  max_bytes = 2097152

  [[model.field]]
  name = "department_id"
  description = "The department the person belongs to"
  class = "none"
  kind = "ref"
  to = "hr_department"

  [[model.field]]
  name = "reports_to_id"
  description = "The person's line manager"
  class = "none"
  kind = "ref"
  to = "hr_employee"

  [[model.field]]
  name = "user"
  description = "The person's obop user name (login), when they have one: leave filed for this employee belongs to that user, and a new leave request of that user starts on this employee. One login belongs to one employee at most"
  class = "internal"
  personal_data = true
  unique = true

  [[model.field]]
  name = "hired_on"
  description = "First day of employment (YYYY-MM-DD)"
  class = "internal"
  personal_data = true
  kind = "date"

  [[model.field]]
  name = "contract_type"
  description = "Type of employment contract: permanent, fixed_term, contractor, intern"
  class = "confidential_hr"
  personal_data = true
  kind = "select"
  options = ["permanent", "fixed_term", "contractor", "intern"]
  group = "hr.manager"

  [[model.field]]
  name = "private_email"
  description = "Private email address"
  class = "confidential_hr"
  personal_data = true
  group = "hr.manager"

    [model.field.ui]
    display = "email"

  [[model.field]]
  name = "private_phone"
  description = "Private phone number"
  class = "confidential_hr"
  personal_data = true
  group = "hr.manager"

    [model.field.ui]
    display = "tel"

  [[model.field]]
  name = "home_address"
  description = "Private home address"
  class = "confidential_hr"
  personal_data = true
  kind = "longtext"
  group = "hr.manager"

    [model.field.ui]
    display = "address"

  [[model.field]]
  name = "birth_date"
  description = "Date of birth (YYYY-MM-DD)"
  class = "confidential_hr"
  personal_data = true
  kind = "date"
  group = "hr.manager"

  [[model.field]]
  name = "national_id"
  description = "National identity or social security number"
  class = "confidential_hr"
  personal_data = true
  group = "hr.manager"

  [[model.field]]
  name = "emergency_contact"
  description = "Name and phone of the person to call in an emergency"
  class = "confidential_hr"
  personal_data = true
  group = "hr.manager"

  [[model.field]]
  name = "salary"
  description = "Gross annual salary (minor currency units, e.g. cents)"
  class = "financial"
  personal_data = true
  kind = "money"
  group = "hr.manager"

    [model.field.ui]
    aggregate = "none"

  [[model.field]]
  name = "bank_iban"
  description = "Bank account salary is paid into"
  class = "financial"
  personal_data = true
  group = "hr.manager"

  [[model.field]]
  name = "union_member"
  description = "Whether the person is a trade union member"
  class = "special_category"
  personal_data = true
  kind = "bool"
  group = "hr.special_reader"

  [[model.field]]
  name = "work_permit_expiry"
  description = "Date the work permit expires, for non-citizens (YYYY-MM-DD)"
  class = "special_category"
  personal_data = true
  kind = "date"
  group = "hr.special_reader"

    [model.field.ui]
    warn_before_days = 60

  [[model.field]]
  name = "health_note"
  description = "Health condition or disability relevant to the workplace"
  class = "special_category"
  personal_data = true
  kind = "longtext"
  group = "hr.special_reader"

  [[model.field]]
  name = "state"
  description = "Employment status: onboarding, active, offboarded"
  class = "none"
  kind = "select"
  options = ["onboarding", "active", "offboarded"]
  required = true

    [model.field.ui]
    tones = { onboarding = "info", active = "ok", offboarded = "neutral" }

  [[model.action]]
  name = "activate"
  description = "Complete onboarding and mark the employee as active"
  field = "state"
  from = "onboarding"
  to = "active"

    [model.action.ui]
    primary = true
    done = "The employee is now active"

  [[model.action]]
  name = "offboard"
  description = "End the employment record; reverse only with an HR decision"
  field = "state"
  from = "active"
  to = "offboarded"
  approval = true

    [model.action.ui]
    danger = true
    confirm = "Offboard this employee? The record and its details stay, and no step moves it back."
    done = "The employee is offboarded"

[[model]]
name = "hr_leave_request"
description = "A request for time off"
read_group = "hr.user"
write_group = "hr.user"

  [model.access]
  own = "requested_by"
  see_all_group = "hr.manager"

  [model.ui]
  title = "{employee_id} · {start_on} · {leave_kind} | {employee_id} · {start_on} | {employee_id}"
  subtitle = "{start_on} – {end_on}"
  list = ["employee_id", "leave_kind", "start_on", "end_on", "days", "state"]
  card = ["employee_id", "leave_kind", "start_on", "end_on", "days"]
  card_sum = "days"
  quick_create = ["employee_id", "leave_kind", "start_on", "end_on", "days"]
  order = "start_on desc"
  default_view = "list"
  menu = "main"
  menu_order = 2
  calendar = { start = "start_on", end = "end_on", color = "state" }
  report = { rows = "employee_id", cols = "leave_kind", measure = "days" }

  [[model.ui.section]]
  label = "Leave"
  fields = ["employee_id", "leave_kind", "start_on", "end_on", "days", "reason"]

  [[model.ui.section]]
  label = "Sick leave"
  fields = ["is_sick_leave", "medical_note"]
  collapsed = true

  [[model.ui.filter]]
  label = "To approve"
  where = "state = requested"

  [[model.ui.filter]]
  label = "Away today"
  where = "state = approved && start_on <= today && end_on >= today"

  [[model.ui.filter]]
  label = "Upcoming"
  where = "state = approved && start_on > today"

  [[model.field]]
  name = "requested_by"
  description = "User name the request belongs to, set by the server when left out (and again when an update moves the request to another employee): the employee's obop user when the employee has one, else the person who files the request. Only they and hr.manager see the request"
  class = "internal"
  personal_data = true
  fill_from = "employee_id.user"

    [model.field.ui]
    hidden = true

  [[model.field]]
  name = "employee_id"
  description = "The employee asking for time off"
  class = "none"
  kind = "ref"
  to = "hr_employee"
  required = true

  [[model.field]]
  name = "leave_kind"
  description = "Kind of leave: paid, unpaid, parental, study, other"
  class = "confidential_hr"
  personal_data = true
  kind = "select"
  options = ["paid", "unpaid", "parental", "study", "other"]
  required = true
  default = "paid"

  [[model.field]]
  name = "start_on"
  description = "First day of absence (YYYY-MM-DD)"
  class = "internal"
  personal_data = true
  kind = "date"
  required = true

  [[model.field]]
  name = "end_on"
  description = "Last day of absence (YYYY-MM-DD)"
  class = "internal"
  personal_data = true
  kind = "date"
  required = true

  [[model.field]]
  name = "days"
  description = "Working days requested"
  class = "none"
  kind = "number"
  required = true

    [model.field.ui]
    aggregate = "sum"

  [[model.field]]
  name = "reason"
  description = "Why the leave is requested"
  class = "confidential_hr"
  personal_data = true
  kind = "longtext"
  group = "hr.manager"

  [[model.field]]
  name = "is_sick_leave"
  description = "Whether the absence is due to illness"
  class = "special_category"
  personal_data = true
  kind = "bool"
  group = "hr.special_reader"

  [[model.field]]
  name = "medical_note"
  description = "Reference to the medical certificate, if any"
  class = "special_category"
  personal_data = true
  kind = "longtext"
  group = "hr.special_reader"

  [[model.field]]
  name = "state"
  description = "Request status: draft, requested, approved, refused"
  class = "none"
  kind = "select"
  options = ["draft", "requested", "approved", "refused"]
  required = true

    [model.field.ui]
    tones = { draft = "neutral", requested = "warn", approved = "ok", refused = "bad" }

  [[model.action]]
  name = "request"
  description = "Submit the request to the manager"
  field = "state"
  from = "draft"
  to = "requested"
  assert = [
    { expr = "end_on >= start_on", message = "The last day of the leave is before its first day", key = "dates_in_order" },
    { expr = "days > 0", message = "Give the number of working days the leave takes", key = "days_given" },
  ]

    [model.action.ui]
    primary = true
    done = "Sent for approval"

  [[model.action]]
  name = "approve"
  description = "Approve a requested leave (manager only)"
  field = "state"
  from = "requested"
  to = "approved"
  group = "hr.manager"
  approval = true
  assert = [
    { expr = "end_on >= start_on", message = "The last day of the leave is before its first day", key = "dates_in_order" },
    { expr = "days > 0", message = "Give the number of working days the leave takes", key = "days_given" },
  ]

    [model.action.ui]
    primary = true
    done = "Leave approved"

  [[model.action]]
  name = "refuse"
  description = "Refuse a requested leave (manager only)"
  field = "state"
  from = "requested"
  to = "refused"
  group = "hr.manager"
  approval = true

    [model.action.ui]
    danger = true
    confirm = "Refuse this leave request?"
    done = "Leave refused"
