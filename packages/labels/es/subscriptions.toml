[labels.es.module]
name = "Suscripciones"
description = "Planes recurrentes y suscripciones de clientes con un flujo de prueba, activa, vencida y cancelada. Registra la fecha de la próxima factura; no crea facturas por sí sola."
summary = "Planes recurrentes y suscripciones de clientes con un flujo de prueba, activa, vencida y cancelada."

[labels.es.model.subscriptions_plan]
name = "Plan"
description = "Una oferta recurrente a la que se pueden suscribir los clientes"

[labels.es.model.subscriptions_plan.field.name]
label = "Nombre"
description = "Nombre del plan, por ejemplo Equipo anual"

[labels.es.model.subscriptions_plan.field.code]
label = "Código"
description = "Código corto del plan"

[labels.es.model.subscriptions_plan.field.interval]
label = "Periodicidad"
description = "Con qué frecuencia se factura al cliente: mensual, trimestral, anual"

[labels.es.model.subscriptions_plan.field.interval.options]
monthly = "Mensual"
quarterly = "Trimestral"
yearly = "Anual"

[labels.es.model.subscriptions_plan.field.price]
label = "Precio"
description = "Precio estándar por intervalo de facturación (unidad menor de la moneda, por ejemplo céntimos)"

[labels.es.model.subscriptions_plan.field.trial_days]
label = "Días de prueba"
description = "Duración de la prueba gratuita en días"

[labels.es.model.subscriptions_plan.field.active]
label = "Activo"
description = "Indica si los clientes nuevos pueden elegir el plan"

[labels.es.model.subscriptions_subscription]
name = "Suscripción"
description = "La suscripción recurrente de un cliente a un plan"

[labels.es.model.subscriptions_subscription.field.customer_id]
label = "Cliente"
description = "El cliente que se suscribió"

[labels.es.model.subscriptions_subscription.field.plan_id]
label = "Plan"
description = "El plan al que se suscribió"

[labels.es.model.subscriptions_subscription.field.started_on]
label = "Fecha de comienzo"
description = "Fecha en que empezó la suscripción (YYYY-MM-DD)"

[labels.es.model.subscriptions_subscription.field.trial_ends_on]
label = "Fin del periodo de prueba"
description = "Fecha en que termina la prueba gratuita (YYYY-MM-DD)"

[labels.es.model.subscriptions_subscription.field.next_invoice_on]
label = "Fecha de la próxima factura"
description = "Fecha en que vence la próxima factura (YYYY-MM-DD)"

[labels.es.model.subscriptions_subscription.field.recurring_amount]
label = "Importe recurrente"
description = "Importe facturado en cada intervalo tras los descuentos (unidad menor de la moneda, por ejemplo céntimos)"

[labels.es.model.subscriptions_subscription.field.currency]
label = "Moneda"
description = "Código de moneda ISO 4217, por ejemplo EUR"

[labels.es.model.subscriptions_subscription.field.seats]
label = "Plazas"
description = "Número de licencias o usuarios incluidos"

[labels.es.model.subscriptions_subscription.field.cancel_reason]
label = "Motivo de cancelación"
description = "Motivo por el que el cliente canceló"

[labels.es.model.subscriptions_subscription.field.state]
label = "Estado"
description = "Estado de la suscripción: prueba, activa, vencida, cancelada"

[labels.es.model.subscriptions_subscription.field.state.options]
trial = "Prueba"
active = "Activo"
past_due = "Vencido"
cancelled = "Cancelado"

[labels.es.model.subscriptions_subscription.action.activate]
label = "Activar"
description = "Empezar a facturar al terminar la prueba"

[labels.es.model.subscriptions_subscription.action.mark_past_due]
label = "Marcar como vencido"
description = "Marcar una suscripción activa cuyo pago ha fallado"

[labels.es.model.subscriptions_subscription.action.recover]
label = "Recuperar"
description = "Devolver a activa una suscripción vencida tras el pago"

[labels.es.model.subscriptions_subscription.action.cancel_trial]
label = "Cancelar prueba"
description = "Cancelar una suscripción durante su prueba"

[labels.es.model.subscriptions_subscription.action.cancel]
label = "Cancelar"
description = "Cancelar una suscripción activa"

[labels.es.model.subscriptions_subscription.action.cancel_overdue]
label = "Cancelar por impago"
description = "Cancelar una suscripción vencida"
