# Machine-drafted labels of the built-in Mail module (docs/spec/mail.md).

[labels.es.module]
name = "Correo"
description = "Correo saliente: servidores de correo (relés SMTP y API de proveedores a través de los Conectores), plantillas en siete idiomas, una cola con reintentos y un registro de envíos que nunca muestra el texto."
summary = "Envía correo a través de tu propio relé SMTP o un proveedor, con plantillas y registro de envíos."

