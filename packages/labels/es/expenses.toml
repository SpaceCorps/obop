[labels.es.module]
name = "Gastos"
description = "Notas de gastos con un flujo de borrador, enviada, aprobada y pagada. Pagar es un permiso aparte. Aprobar, rechazar y pagar requieren aprobación humana; los agentes solo lo proponen. Justificante en foto o escaneo; las notas aprobadas, pagadas o rechazadas quedan bloqueadas. Número de una serie anual; cada empleado ve solo sus notas, los responsables y finanzas ven todas."
summary = "Notas de gastos de empleados con un flujo de borrador, enviada, aprobada y pagada."

[labels.es.model.expenses_expense]
name = "Gasto"
plural = "Gastos"
description = "Un importe que un empleado gastó por la empresa y quiere que se le reembolse"

[labels.es.model.expenses_expense.guard]
message = "Un gasto aprobado, pagado o rechazado no se puede modificar, salvo su recibo y los datos del pago."

[labels.es.model.expenses_expense.field.description]
label = "Descripción"
description = "En qué se gastó el dinero"

[labels.es.model.expenses_expense.field.employee]
label = "Empleado"
description = "Nombre de usuario de la persona que solicita el gasto; quien crea la nota, salvo que se indique otra"

[labels.es.model.expenses_expense.field.submitted_by]
label = "Enviada por"
description = "Nombre de usuario de quien envió la solicitud, registrado por la acción Enviar; esa persona tampoco puede aprobarla, salvo que se permita la autoaprobación"

[labels.es.model.expenses_expense.field.spent_on]
label = "Fecha del gasto"
description = "Fecha de la compra (YYYY-MM-DD)"

[labels.es.model.expenses_expense.field.category]
label = "Categoría"
description = "Categoría del gasto: viaje, comidas, alojamiento, suministros, software, otro"

[labels.es.model.expenses_expense.field.category.options]
travel = "Viajes"
meals = "Comidas"
lodging = "Alojamiento"
supplies = "Suministros"
software = "Software"
other = "Otro"

[labels.es.model.expenses_expense.field.amount]
label = "Importe"
description = "Importe que se debe al empleado (unidad menor de la moneda, por ejemplo céntimos)"

[labels.es.model.expenses_expense.field.currency]
label = "Moneda"
description = "Código de moneda ISO 4217, por ejemplo EUR"

[labels.es.model.expenses_expense.field.receipt_note]
label = "Nota del tique"
description = "Dónde se guarda el justificante y qué muestra"

[labels.es.model.expenses_expense.field.paid_on]
label = "Fecha de pago"
description = "Fecha en que se reembolsó al empleado (YYYY-MM-DD)"

[labels.es.model.expenses_expense.field.payment_reference]
label = "Referencia de pago"
description = "Referencia de la transferencia bancaria del reembolso"

[labels.es.model.expenses_expense.field.state]
label = "Estado"
description = "Estado de la solicitud: borrador, enviada, aprobada, pagada, rechazada"

[labels.es.model.expenses_expense.field.state.options]
draft = "Borrador"
submitted = "Presentado"
approved = "Aprobado"
paid = "Pagado"
refused = "Rechazado"

[labels.es.model.expenses_expense.action.submit]
label = "Presentar"
description = "Enviar la solicitud para su aprobación"
done = "Presentado para aprobación"

[labels.es.model.expenses_expense.action.approve]
label = "Aprobar"
description = "Aprobar una solicitud enviada (solo responsables)"
done = "Gasto aprobado"

[labels.es.model.expenses_expense.action.pay]
label = "Pagar"
description = "Registrar el reembolso como pagado (solo finanzas); la fecha de pago es hoy si no se indica otra"
confirm = "¿Registrar este gasto como pagado?"
done = "Gasto marcado como pagado"

[labels.es.model.expenses_expense.action.refuse]
label = "Rechazar"
description = "Rechazar una solicitud enviada (solo responsables)"
confirm = "¿Rechazar este gasto? Un gasto rechazado ya no se puede modificar."
done = "Gasto rechazado"

[labels.es.model.expenses_expense.field.number]
label = "Número"
description = "Número de gasto como EXP-2026-0042, asignado al crear la nota; la serie empieza de nuevo cada año"

[labels.es.model.expenses_expense.field.receipt]
description = "Foto o escaneo del justificante (PDF o imagen); solo lo descarga quien puede leer la nota"
label = "Justificante"

[labels.es.model.expenses_expense.section.expense]
label = "Gasto"

[labels.es.model.expenses_expense.section.notes]
label = "Notas"

[labels.es.model.expenses_expense.section.claimed_by]
label = "Solicitado por"

[labels.es.model.expenses_expense.section.payment]
label = "Pago"

[labels.es.model.expenses_expense.filter.my_claims]
label = "Mis gastos"

[labels.es.model.expenses_expense.filter.to_approve]
label = "Por aprobar"

[labels.es.model.expenses_expense.filter.to_pay]
label = "Por pagar"
