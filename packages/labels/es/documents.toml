[labels.es.module]
name = "Documentos"
description = "Un registro de documentos de empresa: carpetas y documentos con tipo, propietario, caducidad y confidencialidad, y un flujo de borrador, publicado y archivado. Guarda referencias, no el contenido de los archivos. La confidencialidad se aplica: los documentos confidenciales y restringidos solo los ven su propietario y documents.manager; los públicos e internos, todos los que pueden leer documentos."
summary = "Un registro de documentos de empresa con propietario, caducidad y confidencialidad, y un flujo de borrador, publicado y archivado."

[labels.es.model.documents_folder]
name = "Carpeta"
description = "Una carpeta que agrupa documentos"

[labels.es.model.documents_folder.field.name]
label = "Nombre"
description = "Nombre de la carpeta"

[labels.es.model.documents_folder.field.parent_id]
label = "Padre"
description = "La carpeta en la que está esta"

[labels.es.model.documents_folder.field.description]
label = "Descripción"
description = "Qué debe ir en la carpeta"

[labels.es.model.documents_document]
name = "Documento"
description = "Un contrato, política, certificado u otro documento registrado"

[labels.es.model.documents_document.field.title]
label = "Título"
description = "Título del documento"

[labels.es.model.documents_document.field.folder_id]
label = "Carpeta"
description = "La carpeta en la que está archivado el documento"

[labels.es.model.documents_document.field.kind]
label = "Tipo"
description = "Tipo de documento: contrato, factura, política, informe, certificado, otro"

[labels.es.model.documents_document.field.kind.options]
contract = "Contrato"
invoice = "Factura"
policy = "Política"
report = "Informe"
certificate = "Certificado"
other = "Otro"

[labels.es.model.documents_document.field.confidentiality]
label = "Confidencialidad"
description = "Quién puede verlo: los documentos públicos e internos, todos los que pueden leer documentos; los confidenciales y restringidos, solo el propietario y documents.manager"

[labels.es.model.documents_document.field.confidentiality.options]
public = "Público"
internal = "Interno"
confidential = "Confidencial"
restricted = "Restringido"

[labels.es.model.documents_document.field.owner]
label = "Propietario"
description = "Nombre de usuario de la persona responsable del documento; quien lo crea, salvo que se indique otra. Los propietarios ven sus documentos confidenciales"

[labels.es.model.documents_document.field.reference]
label = "Referencia"
description = "Número de referencia, por ejemplo el de un contrato"

[labels.es.model.documents_document.field.location]
label = "Ubicación"
description = "Dónde se guarda el archivo, por ejemplo un enlace o una caja de archivo"

[labels.es.model.documents_document.field.expires_on]
label = "Fecha de caducidad"
description = "Fecha a partir de la cual el documento deja de ser válido (YYYY-MM-DD)"

[labels.es.model.documents_document.field.summary]
label = "Resumen"
description = "Qué dice el documento, en pocas líneas"

[labels.es.model.documents_document.field.state]
label = "Estado"
description = "Estado del documento: borrador, publicado, archivado"

[labels.es.model.documents_document.field.state.options]
draft = "Borrador"
published = "Publicado"
archived = "Archivado"

[labels.es.model.documents_document.action.publish]
label = "Publicar"
description = "Convertir un documento en borrador en la versión vigente"

[labels.es.model.documents_document.action.archive]
label = "Archivar"
description = "Archivar un documento publicado (solo responsables)"

[labels.es.model.documents_document.field.open_to_all]
label = "Abierto a todos"
description = "Indica si todo el que puede leer documentos puede ver este: verdadero para documentos públicos e internos"
