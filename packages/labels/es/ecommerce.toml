[labels.es.module]
name = "Comercio electrónico"
description = "Una tienda en línea: categorías, ofertas con imágenes y traducciones, envíos, códigos de descuento, tipos de impuesto y pedidos web. El servidor descuenta el stock, aplica descuentos e impuestos y calcula cada precio él mismo. Pago por transferencia, tarjeta (Stripe Checkout) o demostración. Reembolsos: un responsable. Datos de clientes nunca públicos. Requiere el paquete Productos."

[labels.es.model.ecommerce_category]
name = "Categoría"
description = "Un grupo de fichas que se muestran juntas en la tienda"

[labels.es.model.ecommerce_category.field.name]
label = "Nombre"
description = "Nombre de la categoría que se muestra en la tienda"

[labels.es.model.ecommerce_category.field.slug]
label = "Slug"
description = "Parte de la URL de la categoría, en minúsculas y con guiones"

[labels.es.model.ecommerce_category.field.description]
label = "Descripción"
description = "Texto breve sobre la categoría"

[labels.es.model.ecommerce_category.field.sequence]
label = "Secuencia"
description = "Orden entre categorías, de menor a mayor"

[labels.es.model.ecommerce_category.field.published]
label = "Publicado"
description = "Indica si la categoría es visible para los compradores"

[labels.es.model.ecommerce_listing]
