[labels.es.model.ecommerce_listing.field.currency]
label = "Moneda"
description = "Código de moneda ISO 4217 de los precios, por ejemplo EUR; vacío significa la moneda de la tienda de los ajustes de la instancia"

[labels.es.model.ecommerce_listing.field.sku]
