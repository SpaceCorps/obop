[labels.es.model.ecommerce_listing.field.category_id]
label = "Categoría"
description = "La categoría bajo la que se muestra la ficha"

[labels.es.model.ecommerce_listing.field.price]
label = "Precio"
description = "Precio en tienda con impuestos incluidos (unidad menor de la moneda, por ejemplo céntimos)"

[labels.es.model.ecommerce_listing.field.compare_at_price]
label = "Precio de comparación"
