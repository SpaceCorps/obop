[labels.es.model.hr_leave_request.field.end_on]
label = "Fecha de fin"
description = "Último día de ausencia (YYYY-MM-DD)"

[labels.es.model.hr_leave_request.field.days]
label = "Días"
description = "Días laborables solicitados"

[labels.es.model.hr_leave_request.field.reason]
label = "Motivo"
description = "Motivo de la solicitud de ausencia"

[labels.es.model.hr_leave_request.field.is_sick_leave]
label = "Baja por enfermedad"
description = "Indica si la ausencia se debe a una enfermedad"

[labels.es.model.hr_leave_request.field.medical_note]
label = "Nota médica"
description = "Referencia del certificado médico, si lo hay"

[labels.es.model.hr_leave_request.field.state]
label = "Estado"
description = "Estado de la solicitud: borrador, solicitada, aprobada, rechazada"

[labels.es.model.hr_leave_request.field.state.options]
