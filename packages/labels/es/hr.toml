description = "Enviar la solicitud al responsable"

[labels.es.model.hr_leave_request.action.approve]
label = "Aprobar"
description = "Aprobar una ausencia solicitada (solo responsables)"

[labels.es.model.hr_leave_request.action.refuse]
label = "Rechazar"
description = "Rechazar una ausencia solicitada (solo responsables)"
