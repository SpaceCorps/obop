[labels.es.module]
name = "Recursos humanos"
description = "Empleados, departamentos y solicitudes de ausencia. Los datos personales se clasifican de forma estricta: el salario, los datos bancarios y el documento de identidad solo los ven los responsables, y los datos de salud y sindicales, el grupo especial de lectores."

[labels.es.model.hr_department]
name = "Departamento"
description = "Un equipo o departamento de la empresa"

