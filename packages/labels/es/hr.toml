[labels.es.model.hr_employee.action.activate]
label = "Activar"
description = "Completar la incorporación y marcar al empleado como activo"

[labels.es.model.hr_employee.action.offboard]
label = "Desvincular"
description = "Cerrar el registro laboral; solo se revierte con una decisión de RR. HH."

[labels.es.model.hr_leave_request]
