[labels.es.module]
name = "Firma"
description = "Plantillas de documentos y solicitudes de firma. Una solicitud puede apuntar a un PDF de Documentos: al enviarla se guarda una copia exacta, y un responsable crea un enlace de un solo uso que quien firma abre sin cuenta para leer, escribir su nombre y aceptar. Solo una firma electrónica simple: el enlace es la única comprobación. Los agentes no crean enlaces."
summary = "Plantillas de documentos y solicitudes de firma; un PDF de Documentos puede firmarse con un enlace de un solo uso. Firma electrónica simple."

[labels.es.model.sign_template]
name = "Plantilla"
description = "Un documento que se puede enviar a firmar"

[labels.es.model.sign_template.field.name]
label = "Nombre"
description = "Nombre de la plantilla, por ejemplo Contrato de trabajo"

[labels.es.model.sign_template.field.description]
label = "Descripción"
description = "Para qué sirve el documento y quién lo firma"

[labels.es.model.sign_template.field.body]
label = "Cuerpo"
description = "El texto del documento, o una referencia a dónde se guarda el archivo"

[labels.es.model.sign_template.field.signer_role]
label = "Rol del firmante"
description = "Función de la persona que firma, por ejemplo Cliente"

[labels.es.model.sign_template.field.active]
label = "Activo"
description = "Indica si las solicitudes nuevas pueden usar la plantilla"

[labels.es.model.sign_request]
name = "Solicitud"
description = "Una solicitud para que una persona firme un documento"

[labels.es.model.sign_request.field.template_id]
label = "Plantilla"
description = "La plantilla de documento que se envía; vacía en una solicitud sobre un documento de Documentos"

[labels.es.model.sign_request.field.document_id]
label = "Documento"
description = "El PDF de Documentos que quien firma lee y firma; al enviar la solicitud se toma su SHA-256 y se guarda una copia exacta"

[labels.es.model.sign_request.field.title]
label = "Título"
description = "Asunto que ve el firmante"

[labels.es.model.sign_request.field.message]
label = "Mensaje"
description = "Mensaje que ve el firmante en la solicitud"

[labels.es.model.sign_request.field.signer_name]
label = "Nombre del firmante"
description = "Nombre de la persona que debe firmar"

[labels.es.model.sign_request.field.signer_email]
label = "Correo electrónico del firmante"
description = "Correo electrónico de quien firma; opcional, obop no envía correo en una solicitud sobre un documento"

[labels.es.model.sign_request.field.sent_on]
label = "Fecha de envío"
description = "Día en que se envió la solicitud (YYYY-MM-DD)"

[labels.es.model.sign_request.field.expires_on]
label = "Fecha de caducidad"
description = "Último día en que se puede firmar la solicitud (YYYY-MM-DD)"

[labels.es.model.sign_request.field.signed_on]
label = "Fecha de firma"
description = "Día en que se firmó el documento (YYYY-MM-DD)"

[labels.es.model.sign_request.field.signer_ip]
label = "IP del firmante"
description = "Dirección desde la que llegó la firma, según la informa la cadena de proxies (prueba)"

[labels.es.model.sign_request.field.signer_user_agent]
label = "Agente de usuario del firmante"
description = "Navegador con el que se hizo la firma (prueba)"

[labels.es.model.sign_request.field.signature_reference]
label = "Referencia de la firma"
description = "Dónde se guarda la firma; typed:NOMBRE para un nombre escrito mediante un enlace"

[labels.es.model.sign_request.field.document_hash]
label = "Hash del documento"
description = "Hash SHA-256 (hex) del documento firmado, para probar que no se cambió después; se establece al enviar una solicitud sobre un documento"

[labels.es.model.sign_request.field.document_file]
label = "Copia guardada"
description = "La copia exacta del PDF enviado a firma, guardada para que reemplazar el archivo en Documentos no pueda cambiar lo que se firmó; nadie tiene el grupo, solo un administrador la lee"

[labels.es.model.sign_request.field.signed_at]
label = "Firmada a las"
description = "Cuándo firmó quien firma mediante el enlace (UTC, reloj del servidor)"

[labels.es.model.sign_request.field.signed_name]
label = "Nombre escrito"
description = "El nombre completo que escribió quien firma (prueba); signer_name sigue siendo el nombre que se pidió"

[labels.es.model.sign_request.field.consent_version]
label = "Versión del consentimiento"
description = "Versión e idioma del texto de consentimiento que vio quien firma, por ejemplo v1-draft/es"

[labels.es.model.sign_request.field.state]
label = "Estado"
description = "Estado de la solicitud: borrador, enviada, firmada, rechazada, caducada"

[labels.es.model.sign_request.field.state.options]
draft = "Borrador"
sent = "Enviado"
signed = "Firmado"
declined = "Rechazado"
expired = "Caducado"

[labels.es.model.sign_request.action.send]
label = "Enviar"
description = "Enviar la solicitud al firmante"

[labels.es.model.sign_request.action.sign]
label = "Firmar"
description = "Registra a mano que el firmante firmó; solo para una solicitud sin documento, porque una solicitud sobre un documento la firma el firmante mediante el enlace"

[labels.es.model.sign_request.action.sign.assert.document_request]
message = "Una solicitud sobre un documento la firma el firmante mediante el enlace; no se puede marcar como firmada a mano"

[labels.es.model.sign_request.action.decline]
label = "Rechazar"
description = "Registrar que el firmante rechazó"

[labels.es.model.sign_request.action.expire]
label = "Marcar como caducado"
description = "Registrar que la solicitud caducó sin firma"

[labels.es.model.sign_request.action.send_document]
label = "Enviar documento"
description = "Enviar una solicitud sobre un documento de Documentos: toma el SHA-256 del PDF, guarda una copia exacta y pasa la solicitud a enviada; después cree el enlace de firma"

[labels.es.model.sign_link]
name = "Enlace de firma"
description = "Un enlace de un solo uso que permite a una persona firmar una solicitud; solo se guarda un hash del secreto, así que el enlace se muestra una vez al crearlo"

[labels.es.model.sign_link.field.request_id]
label = "Solicitud"
description = "La solicitud de firma que abre este enlace"

[labels.es.model.sign_link.field.expires_at]
label = "Válido hasta"
description = "Cuándo deja de funcionar el enlace (UTC); como máximo 14 días después de crearlo y nunca después del último día de la solicitud"

[labels.es.model.sign_link.field.used_at]
label = "Usado"
description = "Cuándo se usó el enlace para firmar (UTC); un enlace funciona una sola vez"

[labels.es.model.sign_link.field.revoked_at]
label = "Revocado"
description = "Cuándo se revocó el enlace (UTC); establézcalo para revocar el enlace"

[labels.es.model.sign_link.field.link]
label = "Dirección del enlace"
description = "El enlace en sí: solo en la respuesta de create, se muestra una vez, nunca se guarda y nunca lo devuelven get, list ni search"
