[labels.es.module]
name = "Contabilidad Suecia"
description = "Localización sueca de la contabilidad: datos de la empresa, series de asientos, códigos y casillas de IVA, y un informe de IVA por periodo que aprueba el grupo accounting.approver. SIN VERIFICAR: nada se ha comprobado con Skatteverket (SKV 4700) ni con SIE. No incluye plan contable BAS; el usuario elige las cuentas. Importes en öre, tipos en puntos básicos. Desde aquí no se presenta nada."

[labels.es.model.accounting_se_company]
name = "Empresa"
description = "La empresa sueca a la que pertenecen los libros; normalmente un registro"

[labels.es.model.accounting_se_company.field.name]
label = "Nombre"
description = "Nombre legal de la empresa"

[labels.es.model.accounting_se_company.field.org_number]
label = "Número de organización"
description = "Número de organización, diez dígitos como 556000-0000; para un empresario individual es un número personal y, por tanto, un dato personal"

[labels.es.model.accounting_se_company.field.vat_number]
label = "Número de IVA"
description = "Número de IVA como SE556000000001; vacío si la empresa no está registrada en el IVA"

[labels.es.model.accounting_se_company.field.f_skatt]
label = "F-skatt"
description = "Si la empresa está aprobada para el régimen F-skatt (F-tax)"

[labels.es.model.accounting_se_company.field.fiscal_year_start_month]
label = "Mes de inicio del ejercicio"
description = "Mes en que empieza el ejercicio, de 1 a 12; 1 significa año natural"

[labels.es.model.accounting_se_company.field.vat_period]
label = "Periodo de IVA"
description = "Con qué frecuencia se presenta la declaración de IVA: monthly, quarterly, yearly"

[labels.es.model.accounting_se_company.field.vat_period.options]
monthly = "Mensual"
quarterly = "Trimestral"
yearly = "Anual"

[labels.es.model.accounting_se_company.field.currency]
label = "Moneda"
description = "Código de moneda ISO 4217 de los libros, normalmente SEK"

[labels.es.model.accounting_se_company.field.address]
label = "Dirección"
description = "Dirección registrada"

[labels.es.model.accounting_se_company.field.contact_email]
label = "Correo de contacto"
description = "Correo de contacto para la contabilidad"

[labels.es.model.accounting_se_voucher_series]
name = "Serie de asientos"
description = "Una serie de asientos, una letra como A que agrupa asientos de un mismo tipo"

[labels.es.model.accounting_se_voucher_series.field.code]
label = "Código"
description = "Código de la serie, de una a tres letras, por ejemplo A; no hay dos series con el mismo código"

[labels.es.model.accounting_se_voucher_series.field.name]
label = "Nombre"
description = "Qué contiene la serie, por ejemplo Asientos manuales"

[labels.es.model.accounting_se_voucher_series.field.journal_id]
label = "Diario"
description = "El diario contable cuyos asientos pertenecen a la serie"

[labels.es.model.accounting_se_voucher_series.field.is_default]
label = "Predeterminada"
description = "Si la serie se usa cuando no se indica ninguna"

[labels.es.model.accounting_se_voucher_series.field.active]
label = "Activa"
description = "Si la serie todavía puede usarse"

[labels.es.model.accounting_se_voucher_series.field.note]
label = "Nota"
description = "Observaciones sobre cómo se usa la serie"

[labels.es.model.accounting_se_vat_box]
name = "Casilla de IVA"
description = "Una casilla de la declaración de IVA sueca. SIN VERIFICAR hasta que se compruebe con SKV 4700"

[labels.es.model.accounting_se_vat_box.field.box]
label = "Casilla"
description = "Número de casilla tal como figura en el formulario, por ejemplo 05; no hay dos casillas con el mismo número"

[labels.es.model.accounting_se_vat_box.field.label]
label = "Título"
description = "Título de la casilla en sueco tal como figura en el formulario"

[labels.es.model.accounting_se_vat_box.field.kind]
label = "Tipo"
description = "Qué contiene la casilla: base (base imponible), output (IVA repercutido), input (IVA soportado), result (IVA a pagar o a devolver)"

[labels.es.model.accounting_se_vat_box.field.kind.options]
base = "Base imponible"
output = "IVA repercutido"
input = "IVA soportado"
result = "Resultado"

[labels.es.model.accounting_se_vat_box.field.not_used]
label = "Sin uso"
description = "Si la empresa no usa la casilla; un importe que cae en una casilla sin uso es un error"

[labels.es.model.accounting_se_vat_box.field.review]
label = "Verificación"
description = "Estado de verificación de la casilla: unverified, verified. Empieza sin verificar; solo el aprobador verifica, tras comprobar con SKV 4700"

[labels.es.model.accounting_se_vat_box.field.review.options]
unverified = "Sin verificar"
verified = "Verificada"

[labels.es.model.accounting_se_vat_box.field.verified]
label = "Verificada"
description = "Si el propietario ha verificado la casilla; falso hasta entonces"

[labels.es.model.accounting_se_vat_box.field.verified_by]
label = "Verificada por"
description = "Nombre de usuario de la persona que verificó"

[labels.es.model.accounting_se_vat_box.field.verified_on]
label = "Verificada el"
description = "Fecha de la verificación (AAAA-MM-DD)"

[labels.es.model.accounting_se_vat_box.field.source]
label = "Fuente"
description = "De dónde procede la casilla y qué se comprobó, por ejemplo la edición de SKV 4700; vacío significa que no se comprobó ninguna fuente"

[labels.es.model.accounting_se_vat_box.action.verify]
label = "Verificar"
description = "Marcar la casilla como comprobada con SKV 4700 (solo aprobadores)"

[labels.es.model.accounting_se_vat_box.action.unverify]
label = "Quitar verificación"
description = "Retirar la verificación de la casilla (solo aprobadores)"

[labels.es.model.accounting_se_vat_code]
name = "Código de IVA"
description = "Un código de IVA que puede llevar una línea del libro mayor, vinculado a una casilla de base, una casilla de IVA y cuentas. SIN VERIFICAR hasta que se compruebe con SKV 4700"

[labels.es.model.accounting_se_vat_code.field.code]
label = "Código"
description = "Código corto como S25 (venta al 25 por ciento); no hay dos códigos con el mismo valor"

[labels.es.model.accounting_se_vat_code.field.label]
label = "Descripción"
description = "Qué significa el código en palabras"

[labels.es.model.accounting_se_vat_code.field.treatment]
label = "Tratamiento"
description = "Tipo de operación: sale_domestic, purchase_domestic, reverse_charge_eu, reverse_charge_non_eu, sale_eu_goods, sale_eu_services, export, exempt, none"

[labels.es.model.accounting_se_vat_code.field.treatment.options]
sale_domestic = "Venta en Suecia"
purchase_domestic = "Compra en Suecia"
reverse_charge_eu = "Inversión del sujeto pasivo, UE"
reverse_charge_non_eu = "Inversión del sujeto pasivo, fuera de la UE"
sale_eu_goods = "Venta de bienes a la UE"
sale_eu_services = "Venta de servicios a la UE"
export = "Venta de exportación"
exempt = "Exento"
none = "Sin IVA"

[labels.es.model.accounting_se_vat_code.field.rate_bp]
label = "Tipo de IVA (puntos básicos)"
description = "Tipo de IVA en puntos básicos: 2500 significa 25,00 por ciento, 1200 12,00, 600 6,00, 0 ninguno"

[labels.es.model.accounting_se_vat_code.field.base_box_id]
label = "Casilla de base"
description = "Casilla que recibe el importe neto de las líneas con este código; vacía si no hay ninguna"

[labels.es.model.accounting_se_vat_code.field.base_side]
label = "Lado de la base"
description = "Qué lado de la línea cuenta como base: credit o debit"

[labels.es.model.accounting_se_vat_code.field.base_side.options]
credit = "Haber"
debit = "Debe"

[labels.es.model.accounting_se_vat_code.field.vat_box_id]
label = "Casilla de IVA"
description = "Casilla que recibe el importe de IVA contabilizado en la cuenta de IVA; vacía si no hay ninguna"

[labels.es.model.accounting_se_vat_code.field.vat_account_id]
label = "Cuenta de IVA"
description = "La cuenta en la que se contabiliza el importe de IVA. La elige el usuario de su propio plan contable; el paquete no incluye ninguna"

[labels.es.model.accounting_se_vat_code.field.vat_side]
label = "Lado de la cuenta de IVA"
description = "Qué lado de la cuenta de IVA cuenta como IVA para la casilla: credit o debit"

[labels.es.model.accounting_se_vat_code.field.vat_side.options]
credit = "Haber"
debit = "Debe"

[labels.es.model.accounting_se_vat_code.field.tax_id]
label = "Impuesto"
description = "El tipo de impuesto contable al que corresponde el código, si existe"

[labels.es.model.accounting_se_vat_code.field.active]
label = "Activo"
description = "Si el código todavía puede ponerse en líneas nuevas"

[labels.es.model.accounting_se_vat_code.field.review]
label = "Verificación"
description = "Estado de verificación del código: unverified, verified. Empieza sin verificar; solo el aprobador verifica, tras comprobar con SKV 4700"

[labels.es.model.accounting_se_vat_code.field.review.options]
unverified = "Sin verificar"
verified = "Verificado"

[labels.es.model.accounting_se_vat_code.field.verified]
label = "Verificado"
description = "Si el propietario ha verificado el código; falso hasta entonces"

[labels.es.model.accounting_se_vat_code.field.verified_by]
label = "Verificado por"
description = "Nombre de usuario de la persona que verificó"

[labels.es.model.accounting_se_vat_code.field.verified_on]
label = "Verificado el"
description = "Fecha de la verificación (AAAA-MM-DD)"

[labels.es.model.accounting_se_vat_code.field.source]
label = "Fuente"
description = "De dónde procede el código y qué se comprobó, por ejemplo la edición de SKV 4700; vacío significa que no se comprobó ninguna fuente"

[labels.es.model.accounting_se_vat_code.action.verify]
label = "Verificar"
description = "Marcar el código como comprobado con SKV 4700 (solo aprobadores)"

[labels.es.model.accounting_se_vat_code.action.unverify]
label = "Quitar verificación"
description = "Retirar la verificación del código (solo aprobadores)"

[labels.es.model.accounting_se_vat_report]
name = "Informe de IVA"
description = "Un informe de IVA de un periodo, preparado a partir del libro mayor y aprobado por una persona antes de usarse. SIN VERIFICAR: este paquete no lo ha comparado con SKV 4700"

[labels.es.model.accounting_se_vat_report.field.name]
label = "Nombre"
description = "Nombre del periodo, por ejemplo 2026-Q3"

[labels.es.model.accounting_se_vat_report.field.period_kind]
label = "Duración del periodo"
description = "Duración del periodo: month, quarter, year"

[labels.es.model.accounting_se_vat_report.field.period_kind.options]
month = "Mes"
quarter = "Trimestre"
year = "Año"

[labels.es.model.accounting_se_vat_report.field.start_on]
label = "Primer día"
description = "Primer día del periodo (AAAA-MM-DD)"

[labels.es.model.accounting_se_vat_report.field.end_on]
label = "Último día"
description = "Último día del periodo (AAAA-MM-DD)"

[labels.es.model.accounting_se_vat_report.field.due_on]
label = "Fecha de vencimiento"
description = "Día en que debe llegar la declaración; lo indica quien prepara, el paquete no lo calcula"

[labels.es.model.accounting_se_vat_report.field.company_id]
label = "Empresa"
description = "La empresa a la que se refiere el informe"

[labels.es.model.accounting_se_vat_report.field.output_vat]
label = "IVA repercutido"
description = "IVA repercutido del periodo en öre, suma de las líneas repercutidas"

[labels.es.model.accounting_se_vat_report.field.input_vat]
label = "IVA soportado"
description = "IVA soportado deducible del periodo en öre, suma de las líneas soportadas"

[labels.es.model.accounting_se_vat_report.field.vat_to_pay]
label = "IVA a pagar"
description = "IVA repercutido menos IVA soportado en öre; negativo significa devolución (casilla 49)"

[labels.es.model.accounting_se_vat_report.field.boxes_confirmed]
label = "Casillas confirmadas"
description = "El aprobador confirma que cada casilla del informe se ha comparado con el formulario SKV 4700 y que las asignaciones usadas están verificadas"

[labels.es.model.accounting_se_vat_report.field.notes]
label = "Notas"
description = "Observaciones de quien prepara o aprueba"

[labels.es.model.accounting_se_vat_report.field.state]
label = "Estado"
description = "Estado del informe: draft, proposed, approved, filed"

[labels.es.model.accounting_se_vat_report.field.state.options]
draft = "Borrador"
proposed = "Propuesto"
approved = "Aprobado"
filed = "Presentado"

[labels.es.model.accounting_se_vat_report.action.propose]
label = "Proponer"
description = "Proponer el informe para su aprobación; los agentes pueden hacerlo"

[labels.es.model.accounting_se_vat_report.action.withdraw]
label = "Retirar"
description = "Devolver un informe propuesto a borrador"

[labels.es.model.accounting_se_vat_report.action.approve]
label = "Aprobar"
description = "Aprobar el informe (solo aprobadores; las casillas deben estar confirmadas como comprobadas con SKV 4700)"

[labels.es.model.accounting_se_vat_report.action.approve.assert.boxes_checked]
message = "Las casillas no se han confirmado como comprobadas con SKV 4700"

[labels.es.model.accounting_se_vat_report.action.record_filed]
label = "Registrar presentación"
description = "Registrar que la declaración se presentó a Skatteverket fuera de este sistema (solo aprobadores)"

[labels.es.model.accounting_se_vat_report_line]
name = "Línea de informe de IVA"
description = "Una casilla de un informe de IVA con su importe"

[labels.es.model.accounting_se_vat_report_line.field.report_id]
label = "Informe"
description = "El informe al que pertenece la línea"

[labels.es.model.accounting_se_vat_report_line.field.box_id]
label = "Casilla"
description = "La casilla de IVA"

[labels.es.model.accounting_se_vat_report_line.field.kind]
label = "Tipo"
description = "Tipo de la casilla, copiado por quien prepara: base, output, input, result"

[labels.es.model.accounting_se_vat_report_line.field.kind.options]
base = "Base imponible"
output = "IVA repercutido"
input = "IVA soportado"
result = "Resultado"

[labels.es.model.accounting_se_vat_report_line.field.amount]
label = "Importe"
description = "Importe de la casilla en öre"

[labels.es.model.accounting_se_vat_report_line.field.vouchers]
label = "Asientos"
description = "Referencias a los asientos que forman el importe, una por línea, para que un revisor pueda seguirlo"
