[labels.es.model.user_account]
name = "Cuenta de usuario"
description = "Una persona que puede iniciar sesión en esta instancia, con los grupos de permisos que tiene. Solo la cambian los administradores; un agente solo puede proponer un cambio"

[labels.es.model.user_account.field.groups]
label = "Grupos"
description = "Los grupos de permisos de la cuenta, separados por comas. Entrada de add y set_groups: la lista completa que la cuenta debe tener después"

[labels.es.model.user_account.field.previous_groups]
label = "Grupos anteriores"
description = "Resultado de set_groups: los grupos que la cuenta tenía antes"

[labels.es.model.user_account.field.password]
label = "Contraseña"
description = "Entrada de add: la contraseña inicial (al menos 12 caracteres); la persona elige la suya al iniciar sesión por primera vez. Nunca se muestra"

[labels.es.model.user_account.field.must_change_password]
label = "Debe cambiar la contraseña"
description = "Si la persona debe elegir una contraseña nueva en el próximo inicio de sesión"

[labels.es.model.user_account.field.note]
label = "Nota"
description = "Entrada de offboard: un motivo breve que se guarda en el registro de seguridad (sin secretos; 200 caracteres)"

[labels.es.model.user_account.field.revoked]
label = "Revocado"
description = "Resultado de offboard: lo que se terminó definitivamente, en palabras"

[labels.es.model.user_account.field.admin]
label = "Administrador"
description = "Si la cuenta pertenece al grupo de administradores"

[labels.es.model.user_account.field.disabled]
label = "Desactivada"
description = "Si la cuenta está desactivada: no puede iniciar sesión y sus tokens no funcionan"

[labels.es.model.user_account.field.offboarded]
label = "Dada de baja"
description = "Si la cuenta se dio de baja: desactivada, con todas las sesiones, tokens de agente y aplicaciones conectadas revocados definitivamente"

[labels.es.model.user_account.field.mfa_enabled]
label = "Dos factores"
description = "Si la cuenta tiene un segundo factor de inicio de sesión (una aplicación de autenticación o una clave de acceso)"

[labels.es.model.user_account.field.sessions]
label = "Sesiones"
description = "Sesiones iniciadas que siguen siendo válidas"

[labels.es.model.user_account.action.add]
label = "Añadir"
description = "Crear una cuenta. Indique id (el nombre de usuario), password (al menos 12 caracteres) y groups. La persona elige una contraseña nueva al iniciar sesión por primera vez"

[labels.es.model.user_account.action.set_groups]
label = "Establecer grupos"
description = "Sustituir los grupos de permisos de una cuenta. Indique id y groups (la lista completa después). Surte efecto en la próxima solicitud de la cuenta. Se rechaza para grupos desconocidos y al quitar el grupo de administradores a uno mismo o al último administrador"

[labels.es.model.user_account.action.offboard]
label = "Dar de baja"
description = "Desactivar una cuenta y terminar definitivamente cada sesión, token de agente y aplicación conectada. Activarla más tarde no los devuelve. Indique id y, si quiere, note"

[labels.es.model.user_account.action.disable]
label = "Desactivar"
description = "Desactivar una cuenta: no puede iniciar sesión y sus tokens dejan de funcionar hasta que se active de nuevo. Indique id"

[labels.es.model.user_account.action.enable]
label = "Activar"
description = "Volver a activar una cuenta desactivada. Los accesos revocados por una baja siguen revocados. Indique id"

[labels.es.model.device]
name = "Dispositivo"
description = "Un teléfono o tableta en el que una aplicación móvil tiene la sesión iniciada: se crea cuando la aplicación inicia sesión y termina al revocarla. Una persona ve, renombra y revoca sus propios dispositivos; los administradores de dispositivos ven y revocan todos."

[labels.es.model.device.field.user]
label = "Usuario"
description = "La cuenta a la que pertenece el dispositivo"

[labels.es.model.device.field.name]
label = "Nombre"
description = "Cómo se llama el dispositivo; la persona puede renombrarlo"

[labels.es.model.device.field.client_name]
label = "Aplicación"
description = "La aplicación móvil que inició sesión, tal como se llamó a sí misma"

[labels.es.model.device.field.platform]
label = "Plataforma"
description = "La plataforma que indicó la aplicación, por ejemplo android o ios"

[labels.es.model.device.field.app_version]
label = "Versión de la aplicación"
description = "La versión de la aplicación, tal como la indicó al iniciar sesión y en cada renovación"

[labels.es.model.device.field.push_token]
label = "Token push"
description = "La dirección del servicio push de este dispositivo. No se muestra a nadie y no se escribe en esta versión: el push no forma parte de la primera entrega móvil"

[labels.es.model.device.field.registered_at]
label = "Sesión iniciada"
description = "Cuándo inició sesión la aplicación en este dispositivo"

[labels.es.model.device.field.last_seen]
label = "Última actividad"
description = "Cuándo renovó el dispositivo su sesión por última vez (la hora de la última renovación, no de cada solicitud)"

[labels.es.model.device.field.expires_at]
label = "Caduca"
description = "Cuándo termina la sesión del dispositivo si no se renueva"

[labels.es.model.device.field.state]
label = "Estado"
description = "active mientras el dispositivo puede iniciar sesión; revoked una vez terminado"

[labels.es.model.device.field.state.options]
active = "Activo"
revoked = "Revocado"

[labels.es.model.device.field.revoked_at]
label = "Revocado el"
description = "Cuándo se terminó el dispositivo"

[labels.es.model.device.field.grant]
label = "Familia de sesión"
description = "La familia de tokens de renovación a la que está ligado el dispositivo (un identificador, no un token)"

[labels.es.model.device.action.revoke]
label = "Revocar"
description = "Terminar un dispositivo para siempre: sus tokens de renovación dejan de funcionar, su token de acceso se detiene en la siguiente solicitud y la aplicación debe iniciar sesión de nuevo. Una persona revoca sus propios dispositivos; un agente solo puede proponerlo. Indique id"
