[labels.sv.module]
name = "Fältservice"
description = "Uppdrag hos kunder som utförs av en tekniker: schemalagt, på väg, pågår, klart eller annullerat. Ett uppdrag registrerar kund, arbetsplats, tekniker, planerad dag och starttid (minuter efter midnatt), använda reservdelar och om kunden måste signera. Adress och kontaktuppgifter till arbetsplatsen är personuppgifter. Kräver paketen Personal och Produkter."

[labels.sv.model.field_service_job]
name = "Uppdrag"
description = "Ett uppdrag hos en kund"

[labels.sv.model.field_service_job.field.name]
label = "Namn"
description = "Uppdragets korta titel, till exempel Byte av pannpump"

