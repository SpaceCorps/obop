[labels.sv.module]
name = "Signering"
description = "Dokumentmallar och signeringsbegäranden. En begäran kan peka på en PDF i Dokument: vid skickandet sparas en exakt kopia, och en chef skapar en engångslänk som den som ska signera öppnar utan konto för att läsa, skriva sitt namn och godkänna. Bara en enkel elektronisk signatur: länken är den enda kontrollen. Agenter skapar inga länkar."
summary = "Dokumentmallar och signeringsbegäranden; en PDF i Dokument kan signeras via en engångslänk. Enkel elektronisk signatur."

[labels.sv.model.sign_template]
name = "Mall"
description = "Ett dokument som kan skickas ut för signering"

[labels.sv.model.sign_template.field.name]
label = "Namn"
description = "Mallens namn, till exempel Anställningsavtal"

[labels.sv.model.sign_template.field.description]
label = "Beskrivning"
description = "Vad dokumentet är till för och vem som signerar"

[labels.sv.model.sign_template.field.body]
label = "Brödtext"
description = "Dokumenttexten, eller en hänvisning till var filen förvaras"

[labels.sv.model.sign_template.field.signer_role]
label = "Undertecknarens roll"
description = "Rollen för personen som signerar, till exempel Kund"

[labels.sv.model.sign_template.field.active]
label = "Aktiv"
description = "Om nya begäranden kan använda mallen"

[labels.sv.model.sign_request]
name = "Signeringsbegäran"
description = "En begäran om att en person ska signera ett dokument"

[labels.sv.model.sign_request.field.template_id]
label = "Mall"
description = "Dokumentmallen som skickas; tom för en begäran om ett dokument i Dokument"

[labels.sv.model.sign_request.field.document_id]
label = "Dokument"
description = "PDF:en i Dokument som signeraren läser och signerar; när begäran skickas tas dess SHA-256 och en exakt kopia sparas"

[labels.sv.model.sign_request.field.title]
label = "Titel"
description = "Ämne som visas för undertecknaren"

[labels.sv.model.sign_request.field.message]
label = "Meddelande"
description = "Meddelande som visas för undertecknaren i begäran"

[labels.sv.model.sign_request.field.signer_name]
label = "Undertecknarens namn"
description = "Namn på personen som ska signera"

[labels.sv.model.sign_request.field.signer_email]
label = "Undertecknarens e-post"
description = "Signerarens e-postadress; valfri, obop skickar inget e-postmeddelande för en begäran om ett dokument"

[labels.sv.model.sign_request.field.sent_on]
label = "Skickad den"
description = "Dagen då begäran skickades (ÅÅÅÅ-MM-DD)"

[labels.sv.model.sign_request.field.expires_on]
label = "Utgångsdatum"
description = "Sista dagen begäran kan signeras (ÅÅÅÅ-MM-DD)"

[labels.sv.model.sign_request.field.show_history]
label = "Visa tidigare signaturer för den som signerar"
description = "Visar för den som signerar vilka som signerat samma fil (samma dokument och SHA-256) genom en begäran med ikryssad ruta: inskrivet namn och tid. Personen får veta innan hen signerar att också hens uppgifter visas. Bara för en fil som flera namngivna personer signerar tillsammans, aldrig för personer utan koppling. En begäran som signerades innan rutan kryssades visas aldrig. Tom betyder av"

[labels.sv.model.sign_request.field.signed_on]
label = "Signerad den"
description = "Dagen då dokumentet signerades (ÅÅÅÅ-MM-DD)"

[labels.sv.model.sign_request.field.signer_ip]
label = "Undertecknarens IP-adress"
description = "Adressen som signaturen kom från, så som proxykedjan rapporterar den (bevis)"

[labels.sv.model.sign_request.field.signer_user_agent]
label = "Undertecknarens webbläsare"
description = "Webbläsare som signaturen gjordes med (bevis)"

[labels.sv.model.sign_request.field.signature_reference]
label = "Signaturreferens"
description = "Var signaturen finns; typed:NAMN för ett namn som skrivits via en länk"

[labels.sv.model.sign_request.field.document_hash]
label = "Dokumentets hashvärde"
description = "SHA-256-hash (hex) av filen som skickades för signering; sätts när en begäran om ett dokument skickas. Posten är inte manipulationssäker: en administratör eller den som kan skriva i databasen kan ändra den"

[labels.sv.model.sign_request.field.document_file]
label = "Sparad kopia"
description = "Den exakta kopian av PDF:en som skickades för signering, sparad så att ett utbyte av filen i Dokument inte kan ändra vad som signerades; ingen har gruppen, bara en administratör läser den"

[labels.sv.model.sign_request.field.signed_at]
label = "Signeringstid"
description = "När signeraren signerade via länken (UTC, serverns klocka)"

[labels.sv.model.sign_request.field.signed_name]
label = "Skrivet namn"
description = "Det fullständiga namn som signeraren skrev (bevis); signer_name förblir namnet som begärdes"

[labels.sv.model.sign_request.field.consent_version]
label = "Version av samtycket"
description = "Samtyckestextens id: dess version, språket för inskickningen (formulärets lang om det anger ett av de sju; om formuläret saknar fältet lang helt, adressens; annars webbläsarens, instansens och till sist engelska; inget bevis för sidan som visades) och de 8 första hextecknen i en hash av texterna på det språket, till exempel v1-draft/sv/9e91bef0"

[labels.sv.model.sign_request.field.state]
label = "Status"
description = "Begärans status: utkast, skickad, signerad, avböjd, utgången"

[labels.sv.model.sign_request.field.state.options]
draft = "Utkast"
sent = "Skickad"
signed = "Signerad"
declined = "Avböjd"
expired = "Utgången"

[labels.sv.model.sign_request.action.send]
label = "Skicka"
description = "Skicka begäran till undertecknaren"

[labels.sv.model.sign_request.action.sign]
label = "Signera"
description = "Registrera för hand att undertecknaren har signerat; bara för en begäran utan dokument, eftersom en begäran om ett dokument signeras av undertecknaren via länken"

[labels.sv.model.sign_request.action.sign.assert.document_request]
message = "En begäran om ett dokument signeras av undertecknaren via länken; den kan inte markeras som signerad för hand"

[labels.sv.model.sign_request.action.decline]
label = "Avböj"
description = "Registrera att undertecknaren avböjde"

[labels.sv.model.sign_request.action.expire]
label = "Markera som utgången"
description = "Registrera att begäran gick ut utan signatur"

[labels.sv.model.sign_request.action.send_document]
label = "Skicka dokument"
description = "Skicka en begäran om ett dokument i Dokument: tar PDF:ens SHA-256, sparar en exakt kopia och flyttar begäran till skickad; skapa därefter signeringslänken"

[labels.sv.model.sign_link]
name = "Signeringslänk"
description = "En engångslänk som låter en person signera en begäran; bara en hash av hemligheten sparas, så länken visas en gång när den skapas"

[labels.sv.model.sign_link.field.request_id]
label = "Begäran"
description = "Signeringsbegäran som den här länken öppnar"

[labels.sv.model.sign_link.field.expires_at]
label = "Giltig till"
description = "När länken slutar fungera (UTC); högst 14 dagar efter att den skapades och aldrig efter begärans sista dag"

[labels.sv.model.sign_link.field.used_at]
label = "Använd"
description = "När länken användes för att signera (UTC); en länk fungerar bara en gång"

[labels.sv.model.sign_link.field.revoked_at]
label = "Återkallad"
description = "När länken återkallades (UTC); sätt värdet för att återkalla länken"

[labels.sv.model.sign_link.field.link]
label = "Länkadress"
description = "Själva länken: bara i svaret på create, visas en gång, sparas aldrig och returneras aldrig av get, list eller search"
