[labels.sv.module]
name = "Utlägg"
description = "Anställdas utlägg med flödet utkast, inskickad, godkänd och betald. Utbetalning är en separat behörighet. Att godkänna, avslå och betala ut kräver mänskligt godkännande; agenter får bara föreslå. Kvitto som foto eller skanning; godkända, betalda och avslagna utlägg är låsta. Nummer ur en årlig serie; en anställd ser bara sina egna utlägg, chefer och ekonomi ser alla."
summary = "Anställdas utläggsansökningar med flödet utkast, inskickad, godkänd och betald."

[labels.sv.model.expenses_expense]
name = "Utlägg"
plural = "Utlägg"
description = "Ett belopp som en anställd lagt ut för företaget och vill få ersatt"

[labels.sv.model.expenses_expense.guard]
message = "Ett godkänt, utbetalt eller avslaget utlägg kan inte ändras, utom dess kvitto och betalningsuppgifterna."

[labels.sv.model.expenses_expense.field.description]
label = "Beskrivning"
description = "Vad pengarna användes till"

[labels.sv.model.expenses_expense.field.employee]
label = "Anställd"
description = "Användarnamn för personen som begär ersättning; den som skapar utlägget om inget annat anges"

[labels.sv.model.expenses_expense.field.submitted_by]
label = "Inskickat av"
description = "Användarnamnet på den som skickade in utlägget, registrerat av åtgärden Skicka in; den personen får inte heller godkänna det, om inte självgodkännande är tillåtet"

[labels.sv.model.expenses_expense.field.spent_on]
label = "Utfört den"
description = "Inköpsdatum (ÅÅÅÅ-MM-DD)"

[labels.sv.model.expenses_expense.field.category]
label = "Kategori"
description = "Utläggskategori: resor, måltider, logi, förbrukningsmaterial, programvara, övrigt"

[labels.sv.model.expenses_expense.field.category.options]
travel = "Resor"
meals = "Måltider"
lodging = "Logi"
supplies = "Förbrukningsmaterial"
software = "Programvara"
other = "Övrigt"

[labels.sv.model.expenses_expense.field.amount]
label = "Belopp"
description = "Belopp som den anställde ska ha tillbaka (valutans minsta enhet, till exempel ören)"

[labels.sv.model.expenses_expense.field.currency]
label = "Valuta"
description = "Valutakod enligt ISO 4217, till exempel SEK"

[labels.sv.model.expenses_expense.field.receipt_note]
label = "Kvittotext"
description = "Var kvittot förvaras och vad det visar"

[labels.sv.model.expenses_expense.field.paid_on]
label = "Betaldatum"
description = "Dagen då den anställde fick ersättning (ÅÅÅÅ-MM-DD)"

[labels.sv.model.expenses_expense.field.payment_reference]
label = "Betalningsreferens"
description = "Banköverföringens referens för ersättningen"

[labels.sv.model.expenses_expense.field.state]
label = "Status"
description = "Ansökans status: utkast, inskickad, godkänd, betald, avslagen"

[labels.sv.model.expenses_expense.field.state.options]
draft = "Utkast"
submitted = "Inskickad"
approved = "Godkänd"
paid = "Betald"
refused = "Avslagen"

[labels.sv.model.expenses_expense.action.submit]
label = "Skicka in"
description = "Skicka in ansökan för godkännande"
done = "Inskickad för godkännande"

[labels.sv.model.expenses_expense.action.approve]
label = "Godkänn"
description = "Godkänn en inskickad ansökan (endast chef)"
done = "Utlägg godkänt"

[labels.sv.model.expenses_expense.action.pay]
label = "Betala"
description = "Registrera ersättningen som utbetald (endast ekonomi); betaldatum blir i dag om inget anges"
confirm = "Registrera det här utlägget som betalt?"
done = "Utlägg markerat som betalt"

[labels.sv.model.expenses_expense.action.refuse]
label = "Avslå"
description = "Avslå en inskickad ansökan (endast chef)"
confirm = "Avslå det här utlägget? Ett avslaget utlägg kan inte längre ändras."
done = "Utlägg avslaget"

[labels.sv.model.expenses_expense.field.number]
label = "Nummer"
description = "Utläggsnummer som EXP-2026-0042, tilldelas när utlägget skapas; serien börjar om varje år"

[labels.sv.model.expenses_expense.field.receipt]
description = "Foto eller skanning av kvittot (PDF eller bild); kan bara laddas ned av den som får läsa utlägget"
label = "Kvitto"

[labels.sv.model.expenses_expense.section.expense]
label = "Utlägg"

[labels.sv.model.expenses_expense.section.notes]
label = "Anteckningar"

[labels.sv.model.expenses_expense.section.claimed_by]
label = "Begärt av"

[labels.sv.model.expenses_expense.section.payment]
label = "Betalning"

[labels.sv.model.expenses_expense.filter.my_claims]
label = "Mina utlägg"

[labels.sv.model.expenses_expense.filter.to_approve]
label = "Att godkänna"

[labels.sv.model.expenses_expense.filter.to_pay]
label = "Att betala"
