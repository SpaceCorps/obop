[labels.sv.model.pos_payment.field.paid_on]
label = "Betaldatum"
description = "Betalningsdagen (ÅÅÅÅ-MM-DD)"

[labels.sv.model.pos_payment.field.provider_reference]
label = "Betaltjänstens referens"
description = "Referens från kortterminalen eller betaltjänsten; aldrig ett kortnummer"
