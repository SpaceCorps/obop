[labels.sv.module]
name = "Kassa"
description = "Butikskassor: en kassakonfiguration, kassapass med kassakontroll som öppnas och stängs, order med rader och betalningsrader per betalsätt. Återbetalning och stängning av kassapass kräver en chefs godkännande; agenter får bara föreslå dem. Totaler, växel och kassadifferenser anges, de beräknas inte. Kortnummer får aldrig lagras; spara bara betaltjänstens referens. Kräver paketet Produkter."

[labels.sv.model.pos_config]
name = "Kassa"
description = "En försäljningsplats (en kassa eller en butik) och dess regler"

[labels.sv.model.pos_config.field.name]
label = "Namn"
description = "Kassans eller butikens namn, till exempel Butiken på Storgatan"

[labels.sv.model.pos_config.field.currency]
label = "Valuta"
description = "Valutakod enligt ISO 4217, till exempel SEK"

[labels.sv.model.pos_config.field.receipt_header]
label = "Kvittohuvud"
description = "Text som skrivs ut överst på kvitton"

[labels.sv.model.pos_config.field.cash_control]
label = "Kassakontroll"
description = "Om kassapass måste räkna kontanterna i kassalådan vid öppning och stängning"

[labels.sv.model.pos_config.field.default_opening_cash]
label = "Ingående kassa (standard)"
description = "Kontanter som normalt lämnas kvar i kassalådan över natten (valutans minsta enhet)"

[labels.sv.model.pos_config.field.allow_refunds]
label = "Tillåt återbetalningar"
description = "Om kassörer får föreslå återbetalningar vid den här kassan"

[labels.sv.model.pos_config.field.active]
label = "Aktiv"
description = "Om kassan används"

[labels.sv.model.pos_session]
name = "Kassapass"
description = "Ett säljpass vid en kassa, från öppning till stängning av kassalådan"

[labels.sv.model.pos_session.field.config_id]
label = "Kassa"
description = "Kassan som kassapasset tillhör"

[labels.sv.model.pos_session.field.cashier]
label = "Kassör"
description = "Namn på kassören som öppnade kassapasset"

[labels.sv.model.pos_session.field.opened_on]
label = "Öppnad den"
description = "Dagen då kassapasset öppnades (ÅÅÅÅ-MM-DD)"

[labels.sv.model.pos_session.field.closed_on]
label = "Stängd den"
description = "Dagen då kassapasset stängdes (ÅÅÅÅ-MM-DD)"

[labels.sv.model.pos_session.field.opening_cash]
label = "Ingående kassa"
description = "Kontanter som räknades i kassalådan vid öppning (valutans minsta enhet)"

[labels.sv.model.pos_session.field.expected_cash]
label = "Förväntad kassa"
description = "Kontanter som kassalådan ska innehålla vid stängning: ingående kassa plus kontantbetalningar (anges, beräknas inte)"

[labels.sv.model.pos_session.field.closing_cash]
label = "Utgående kassa"
description = "Kontanter som faktiskt räknades i kassalådan vid stängning"

[labels.sv.model.pos_session.field.cash_difference]
label = "Kassadifferens"
description = "Utgående kassa minus förväntad kassa; negativt betyder att pengar saknas"

[labels.sv.model.pos_session.field.note]
label = "Anteckning"
description = "Förklaring till en eventuell kassadifferens"

[labels.sv.model.pos_session.field.state]
label = "Status"
description = "Kassapassets status: öppet, stängt"

[labels.sv.model.pos_session.field.state.options]
open = "Öppet"
closed = "Stängt"

[labels.sv.model.pos_session.action.close]
label = "Stäng"
description = "Stäng kassapasset när kassalådan har räknats (endast chef)"

[labels.sv.model.pos_order]
name = "Order"
description = "En försäljning som slagits in i en kassa"

[labels.sv.model.pos_order.field.session_id]
label = "Kassapass"
description = "Kassapasset som försäljningen gjordes i"

[labels.sv.model.pos_order.field.receipt_number]
label = "Kvittonummer"
description = "Nummer som skrivs ut på kvittot. Fritext: paket kan inte generera nummerserier"

[labels.sv.model.pos_order.field.ordered_on]
label = "Orderdatum"
