[labels.sv.model.pos_order.field.state.options]
draft = "Utkast"
paid = "Betald"
refunded = "Återbetald"
cancelled = "Annullerad"

[labels.sv.model.pos_order.action.pay]
label = "Betala"
description = "Försäljningen är helt betald"

[labels.sv.model.pos_order.action.cancel]
label = "Annullera"
description = "Annullera en försäljning som aldrig betalades"

[labels.sv.model.pos_order.action.refund]
label = "Återbetala"
description = "Återbetala en betald försäljning till kunden (endast chef)"

[labels.sv.model.pos_order_line]
name = "Orderrad"
description = "En produktrad i en försäljning"

[labels.sv.model.pos_order_line.field.order_id]
label = "Order"
description = "Försäljningen som raden tillhör"

[labels.sv.model.pos_order_line.field.product_id]
label = "Produkt"
description = "Den sålda produkten"

[labels.sv.model.pos_order_line.field.description]
label = "Beskrivning"
description = "Text som visas på kvittot"

[labels.sv.model.pos_order_line.field.quantity]
label = "Antal"
description = "Antal sålda enheter"

[labels.sv.model.pos_order_line.field.unit_price]
label = "Styckpris"
description = "Pris per enhet inklusive skatt (valutans minsta enhet)"

[labels.sv.model.pos_order_line.field.discount_bp]
