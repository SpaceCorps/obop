[labels.sv.module]
name = "Bokföring"
description = "Kontoplan, verifikationsserier, skattesatser, verifikationer med debet- och kreditrader, räkenskapsår, perioder och kontoutdragsrader. Belopp anges i valutans minsta enhet, skattesatser i baspunkter (2000 är 20,00 procent). Inget beräknas automatiskt. Bokföring samt stängning av period eller räkenskapsår kräver mänskligt godkännande; agenter får bara föreslå."

[labels.sv.model.accounting_account]
name = "Konto"
description = "Ett konto i kontoplanen"

[labels.sv.model.accounting_account.field.code]
label = "Kod"
description = "Kontonummer som det används i kontoplanen, till exempel 1510"

[labels.sv.model.accounting_account.field.name]
label = "Namn"
description = "Kontonamn, till exempel Kundfordringar"

[labels.sv.model.accounting_account.field.account_type]
label = "Kontotyp"
description = "Kontotyp: asset_receivable, asset_cash, asset_current, asset_fixed, liability_payable, liability_current, liability_non_current, equity, income, income_other, expense, expense_direct_cost"

[labels.sv.model.accounting_account.field.account_type.options]
asset_receivable = "Kundfordran"
asset_cash = "Kassa och bank"
asset_current = "Omsättningstillgång"
asset_fixed = "Anläggningstillgång"
liability_payable = "Leverantörsskuld"
liability_current = "Kortfristig skuld"
liability_non_current = "Långfristig skuld"
equity = "Eget kapital"
income = "Intäkt"
income_other = "Övrig intäkt"
expense = "Kostnad"
expense_direct_cost = "Direkt kostnad"

[labels.sv.model.accounting_account.field.reconcile]
label = "Avstämning"
description = "Om öppna poster på kontot kan stämmas av (kundfordringar, leverantörsskulder, bankkonton för genomgångsposter)"

[labels.sv.model.accounting_account.field.deprecated]
label = "Utfasat"
