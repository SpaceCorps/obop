[labels.sv.module]
name = "E-handel"
description = "En webbutik: kategorier, erbjudanden med bilder och översättningar, leveranssätt, rabattkoder, skattesatser och webbeställningar. Servern drar av lagret, tillämpar rabatter och skatter och räknar ut priserna själv. Betalning med banköverföring, kort (Stripe Checkout) eller i demoläge. Återbetalningar kräver en chef. Kunduppgifter är aldrig offentliga. Kräver paketet Produkter."

