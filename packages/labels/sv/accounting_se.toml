[labels.sv.module]
name = "Bokföring Sverige"
description = "Svensk lokalisering av Bokföring: företagsuppgifter, verifikationsserier, momskoder och momsrutor samt en momsrapport per period som godkänns av gruppen accounting.approver. OVERIFIERAT: inget är kontrollerat mot Skatteverket (SKV 4700) eller SIE. Ingen BAS-kontoplan ingår; konton väljer användaren. Belopp i öre, satser i baspunkter. Inget lämnas in härifrån."

[labels.sv.model.accounting_se_company]
name = "Företag"
description = "Det svenska företaget som böckerna tillhör; normalt en post"

[labels.sv.model.accounting_se_company.field.name]
label = "Namn"
description = "Företagets juridiska namn"

[labels.sv.model.accounting_se_company.field.org_number]
label = "Organisationsnummer"
description = "Organisationsnummer, tio siffror som 556000-0000; för en enskild näringsidkare är det ett personnummer och alltså en personuppgift"

[labels.sv.model.accounting_se_company.field.vat_number]
label = "Momsregistreringsnummer"
description = "Momsregistreringsnummer som SE556000000001; tomt när företaget inte är momsregistrerat"

[labels.sv.model.accounting_se_company.field.f_skatt]
label = "F-skatt"
description = "Om företaget är godkänt för F-skatt"

[labels.sv.model.accounting_se_company.field.fiscal_year_start_month]
