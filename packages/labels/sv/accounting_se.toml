description = "Månaden då räkenskapsåret börjar, 1 till 12; 1 betyder kalenderår"

[labels.sv.model.accounting_se_company.field.vat_period]
label = "Momsperiod"
description = "Hur ofta momsdeklarationen lämnas: monthly, quarterly, yearly"

[labels.sv.model.accounting_se_company.field.vat_period.options]
monthly = "Månadsvis"
quarterly = "Kvartalsvis"
yearly = "Årsvis"

[labels.sv.model.accounting_se_company.field.currency]
label = "Valuta"
