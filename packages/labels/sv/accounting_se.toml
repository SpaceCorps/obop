[labels.sv.model.accounting_se_company.field.address]
label = "Adress"
description = "Registrerad adress"

[labels.sv.model.accounting_se_company.field.contact_email]
label = "Kontakt-e-post"
description = "Kontakt-e-post för bokföringen"

