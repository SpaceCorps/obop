[labels.sv.module]
name = "Tillverkning"
description = "Stycklistor och tillverkningsorder med flödet utkast, bekräftad, pågår och klar. En order listar komponenterna den förbrukar; när ordern avslutas skapas de lagerrörelser som tar komponenterna ur lager på produktionsplatsen och lägger in den färdiga produkten där. Klara och avbrutna order är låsta."
summary = "Stycklistor och tillverkningsorder med flödet utkast, bekräftad, pågår och klar."

[labels.sv.model.manufacturing_bom]
name = "Stycklista"
plural = "Stycklistor"
description = "Ett recept: komponenterna som behövs för att tillverka en produkt"

[labels.sv.model.manufacturing_bom.field.product_id]
label = "Produkt"
description = "Färdigprodukten som receptet tillverkar"

[labels.sv.model.manufacturing_bom.field.name]
label = "Namn"
description = "Receptets namn, till exempel Standardmontering"

[labels.sv.model.manufacturing_bom.field.quantity]
label = "Antal"
description = "Antal enheter färdigprodukt som en tillverkningsomgång ger"

[labels.sv.model.manufacturing_bom.field.instructions]
label = "Instruktioner"
description = "Monteringsanvisningar för verkstadsgolvet"

[labels.sv.model.manufacturing_bom.field.active]
label = "Aktiv"
description = "Om receptet kan användas för nya order"

[labels.sv.model.manufacturing_bom_line]
name = "Stycklisterad"
plural = "Komponenter"
description = "En komponent i en stycklista"

[labels.sv.model.manufacturing_bom_line.field.bom_id]
label = "Stycklista"
description = "Receptet som komponenten tillhör"

[labels.sv.model.manufacturing_bom_line.field.component_id]
label = "Komponent"
description = "Produkten som förbrukas"

[labels.sv.model.manufacturing_bom_line.field.quantity]
label = "Antal"
description = "Antal enheter av komponenten som används per omgång"

[labels.sv.model.manufacturing_order]
name = "Tillverkningsorder"
plural = "Tillverkningsorder"
description = "En instruktion att tillverka ett antal av en produkt"

[labels.sv.model.manufacturing_order.field.number]
label = "Nummer"
description = "Ordernummer som MO-00042, tilldelas när ordern skapas"

[labels.sv.model.manufacturing_order.field.bom_id]
label = "Stycklista"
description = "Receptet som ska följas"

[labels.sv.model.manufacturing_order.field.quantity]
label = "Antal"
description = "Antal enheter färdigprodukt som ska tillverkas"

[labels.sv.model.manufacturing_order.field.planned_on]
label = "Planerat datum"
description = "Datum då tillverkningen ska starta (ÅÅÅÅ-MM-DD)"

[labels.sv.model.manufacturing_order.field.deadline]
label = "Tidsfrist"
description = "Datum då varorna behövs (ÅÅÅÅ-MM-DD)"

[labels.sv.model.manufacturing_order.field.responsible]
label = "Ansvarig"
description = "Namn på personen som leder omgången"

[labels.sv.model.manufacturing_order.field.state]
label = "Status"
description = "Orderstatus: utkast, bekräftad, pågår, klar, annullerad"

[labels.sv.model.manufacturing_order.field.state.options]
draft = "Utkast"
confirmed = "Bekräftad"
in_progress = "Pågår"
done = "Klar"
cancelled = "Annullerad"

[labels.sv.model.manufacturing_order.action.confirm]
label = "Bekräfta"
description = "Bekräfta en order i utkast så att tillverkningen kan planeras"

[labels.sv.model.manufacturing_order.action.confirm.assert.has_location]
message = "Välj produktionsplatsen först: när ordern slutförs tas komponenterna ut och produkten läggs in där"

[labels.sv.model.manufacturing_order.action.confirm.assert.has_components]
message = "Lägg till komponenterna först: en order utan komponenter flyttar inget lager när den slutförs"

[labels.sv.model.manufacturing_order.action.start]
label = "Starta"
description = "Starta tillverkningen av en bekräftad order"

[labels.sv.model.manufacturing_order.action.finish]
label = "Avsluta"
description = "Markera tillverkningen som avslutad: med en produktionsplats skapas en lagerrörelse i utkast per komponent som tar den därifrån och en som lägger in den färdiga produkten där, med ordernumret som ursprung, för lagret att validera (kräver gruppen inventory.user)"

[labels.sv.model.manufacturing_order.action.cancel]
label = "Annullera"
description = "Annullera en order som inte har bekräftats"

[labels.sv.model.manufacturing_order.field.product_id]
label = "Produkt"
description = "Den färdiga produkt som tillverkas; hämtas från stycklistan när den inte anges"

[labels.sv.model.manufacturing_order.field.location_id]
label = "Produktionsplats"
description = "Produktionsplatsen: när ordern avslutas skapas de lagerrörelser som tar komponenterna härifrån och lägger den färdiga produkten här; tomt skapar inga rörelser"

[labels.sv.model.manufacturing_order_line]
name = "Orderkomponent"
plural = "Orderkomponenter"
description = "En komponent som en tillverkningsorder förbrukar, med antalet för hela ordern"

[labels.sv.model.manufacturing_order_line.field.order_id]
label = "Tillverkningsorder"
description = "Tillverkningsordern som förbrukar komponenten"

[labels.sv.model.manufacturing_order_line.field.component_id]
label = "Komponent"
description = "Produkten som förbrukas"

[labels.sv.model.manufacturing_order_line.field.quantity]
label = "Antal"
description = "Antal enheter av komponenten som hela ordern förbrukar"
