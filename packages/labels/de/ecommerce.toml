[labels.de.module]
name = "E-Commerce"
description = "Ein Onlineshop: Kategorien, Shop-Einträge mit Übersetzungen, Versandarten, Rabattcodes und Webbestellungen mit Positionen. Besucher bestellen ohne Konto; der Server berechnet jeden Preis aus dem veröffentlichten Eintrag. Erstattungen brauchen die Genehmigung einer Führungskraft; Agenten dürfen sie nur vorschlagen. Benötigt das Paket Produkte."

[labels.de.model.ecommerce_category]
name = "Kategorie"
description = "Eine Gruppe von Einträgen, die im Shop zusammen angezeigt werden"

[labels.de.model.ecommerce_category.field.name]
label = "Name"
description = "Kategoriename, wie er im Shop erscheint"

[labels.de.model.ecommerce_category.field.slug]
label = "URL-Pfad"
description = "URL-Teil der Kategorie, Kleinbuchstaben mit Bindestrichen"

[labels.de.model.ecommerce_category.field.description]
label = "Beschreibung"
description = "Kurzer Text zur Kategorie"

[labels.de.model.ecommerce_category.field.sequence]
label = "Reihenfolge"
description = "Reihenfolge unter den Kategorien, niedrigste zuerst"

[labels.de.model.ecommerce_category.field.published]
label = "Veröffentlicht"
description = "Ob die Kategorie für Kunden sichtbar ist"

[labels.de.model.ecommerce_listing]
name = "Shop-Eintrag"
description = "Ein Produkt, wie es im Onlineshop erscheint"

[labels.de.model.ecommerce_listing.field.product_id]
label = "Produkt"
description = "Das online verkaufte Produkt"

[labels.de.model.ecommerce_listing.field.title]
label = "Titel"
description = "Titel, wie er im Shop erscheint"

[labels.de.model.ecommerce_listing.field.slug]
label = "URL-Pfad"
description = "URL-Teil der Produktseite, Kleinbuchstaben mit Bindestrichen"

[labels.de.model.ecommerce_listing.field.summary]
label = "Zusammenfassung"
description = "Ein bis zwei Sätze für die Produktkarten"

[labels.de.model.ecommerce_listing.field.description]
label = "Beschreibung"
description = "Beschreibung auf der Produktseite, in Markdown"

[labels.de.model.ecommerce_listing.field.category_id]
label = "Kategorie"
description = "Die Kategorie, unter der der Eintrag angezeigt wird"

[labels.de.model.ecommerce_listing.field.price]
label = "Preis"
description = "Shop-Preis inklusive Steuer (kleinste Währungseinheit, z. B. Cent)"

[labels.de.model.ecommerce_listing.field.compare_at_price]
label = "Streichpreis"
description = "Früherer Preis, durchgestrichen angezeigt (kleinste Währungseinheit)"

[labels.de.model.ecommerce_listing.field.currency]
label = "Währung"
description = "Währungscode der Preise nach ISO 4217, zum Beispiel EUR; leer bedeutet die Shop-Währung aus den Instanzeinstellungen"

[labels.de.model.ecommerce_listing.field.sku]
label = "Artikelnummer"
description = "Artikelnummer (SKU), auf der Produktseite angezeigt"

[labels.de.model.ecommerce_listing.field.stock_policy]
label = "Bestandsregel"
description = "Was bei leerem Lager passiert: immer verfügbar, bei Ausverkauf sperren, Nachbestellung erlauben"

[labels.de.model.ecommerce_listing.field.stock_policy.options]
always_available = "Immer verfügbar"
block_when_out = "Bei Ausverkauf sperren"
allow_backorder = "Nachbestellung erlauben"

[labels.de.model.ecommerce_listing.field.stock_quantity]
label = "Lagerbestand"
description = "Vorrätige Stückzahl, im Zusammenspiel mit der Bestandsregel. Bestellungen verringern sie nicht: von Hand anpassen"

[labels.de.model.ecommerce_listing.field.published]
label = "Veröffentlicht"
description = "Ob der Eintrag für Kunden sichtbar ist"

[labels.de.model.ecommerce_listing_translation]
name = "Übersetzung des Shop-Eintrags"
description = "Ein in eine andere Sprache übersetzter Shop-Eintrag"

[labels.de.model.ecommerce_listing_translation.field.listing_id]
label = "Shop-Eintrag"
description = "Der Eintrag, der hier übersetzt wird"

[labels.de.model.ecommerce_listing_translation.field.lang]
label = "Sprache"
description = "Sprache der Übersetzung: en, de, fr, pl, fi, sv oder es"

[labels.de.model.ecommerce_listing_translation.field.lang.options]
en = "Englisch"
de = "Deutsch"
fr = "Französisch"
pl = "Polnisch"
fi = "Finnisch"
sv = "Schwedisch"
es = "Spanisch"

[labels.de.model.ecommerce_listing_translation.field.title]
label = "Titel"
description = "Übersetzter Titel"

[labels.de.model.ecommerce_listing_translation.field.summary]
label = "Zusammenfassung"
description = "Übersetzter Kartentext"

[labels.de.model.ecommerce_listing_translation.field.description]
label = "Beschreibung"
description = "Übersetzte Beschreibung in Markdown"

[labels.de.model.ecommerce_listing_translation.field.published]
label = "Veröffentlicht"
description = "Ob die Übersetzung angezeigt wird; sie ist nur erreichbar, solange ihr Eintrag veröffentlicht ist"

[labels.de.model.ecommerce_shipping_method]
name = "Versandart"
description = "Eine Art, Bestellungen zuzustellen, mit ihrem Preis"

[labels.de.model.ecommerce_shipping_method.field.name]
label = "Name"
description = "Name an der Kasse, zum Beispiel Standardversand"

[labels.de.model.ecommerce_shipping_method.field.carrier]
label = "Versanddienstleister"
description = "Dienstleister, der zustellt, zum Beispiel DHL"

[labels.de.model.ecommerce_shipping_method.field.price]
label = "Preis"
