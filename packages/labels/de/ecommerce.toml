description = "Wie oft der Code insgesamt eingelöst werden darf; leer bedeutet unbegrenzt"

[labels.de.model.ecommerce_discount_code.field.used_count]
label = "Eingelöst"
description = "Wie oft er bereits eingelöst wurde (wird von Hand gepflegt)"

[labels.de.model.ecommerce_discount_code.field.minimum_order]
label = "Mindestbestellwert"
description = "Kleinste Bestellsumme, für die der Code gilt (kleinste Währungseinheit)"

[labels.de.model.ecommerce_discount_code.field.active]
label = "Aktiv"
description = "Ob der Code verwendet werden kann"

