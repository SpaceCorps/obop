[labels.de.model.ecommerce_discount_code.field.value]
label = "Wert"
description = "Ermäßigung: Basispunkte bei Prozent (1000 sind 10,00 Prozent), kleinste Währungseinheit bei Festbetrag"

[labels.de.model.ecommerce_discount_code.field.starts_on]
label = "Beginnt am"
