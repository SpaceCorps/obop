[labels.de.module]
name = "Buchführung Schweden"
description = "Schwedische Lokalisierung der Buchführung: Firmendaten, Belegserien, Mehrwertsteuercodes und -felder sowie ein Mehrwertsteuerbericht je Periode, den die Gruppe accounting.approver freigibt. UNGEPRÜFT: nichts wurde mit Skatteverket (SKV 4700) oder SIE abgeglichen. Kein BAS-Kontenplan enthalten; Konten wählt der Nutzer. Beträge in Öre, Sätze in Basispunkten. Nichts wird von hier eingereicht."

[labels.de.model.accounting_se_company]
name = "Unternehmen"
description = "Das schwedische Unternehmen, dem die Bücher gehören; normalerweise ein Datensatz"

[labels.de.model.accounting_se_company.field.name]
label = "Name"
description = "Rechtlicher Name des Unternehmens"

[labels.de.model.accounting_se_company.field.org_number]
label = "Organisationsnummer"
description = "Organisationsnummer, zehn Ziffern wie 556000-0000; bei einem Einzelunternehmer ist es eine Personennummer und damit ein personenbezogenes Datum"

[labels.de.model.accounting_se_company.field.vat_number]
label = "Umsatzsteuer-Identifikationsnummer"
description = "Umsatzsteuer-Identifikationsnummer wie SE556000000001; leer, wenn das Unternehmen nicht umsatzsteuerpflichtig registriert ist"

[labels.de.model.accounting_se_company.field.f_skatt]
label = "F-Steuer"
description = "Ob das Unternehmen für die F-Steuer (F-skatt) zugelassen ist"

[labels.de.model.accounting_se_company.field.fiscal_year_start_month]
label = "Startmonat des Geschäftsjahres"
description = "Monat, in dem das Geschäftsjahr beginnt, 1 bis 12; 1 bedeutet Kalenderjahr"

[labels.de.model.accounting_se_company.field.vat_period]
label = "Umsatzsteuerperiode"
description = "Wie oft die Umsatzsteuererklärung abgegeben wird: monthly, quarterly, yearly"

[labels.de.model.accounting_se_company.field.vat_period.options]
monthly = "Monatlich"
quarterly = "Vierteljährlich"
yearly = "Jährlich"

[labels.de.model.accounting_se_company.field.currency]
label = "Währung"
description = "ISO-4217-Währungscode der Bücher, normalerweise SEK"

[labels.de.model.accounting_se_company.field.address]
label = "Adresse"
description = "Eingetragene Adresse"

[labels.de.model.accounting_se_company.field.contact_email]
label = "Kontakt-E-Mail"
description = "Kontakt-E-Mail für die Buchführung"

[labels.de.model.accounting_se_voucher_series]
name = "Belegserie"
description = "Eine Belegserie, ein Buchstabe wie A, der Belege einer Art zusammenfasst"

[labels.de.model.accounting_se_voucher_series.field.code]
label = "Code"
description = "Seriencode, ein bis drei Buchstaben, zum Beispiel A; keine zwei Serien haben denselben Code"

[labels.de.model.accounting_se_voucher_series.field.name]
label = "Name"
description = "Was die Serie enthält, zum Beispiel Manuelle Belege"

[labels.de.model.accounting_se_voucher_series.field.journal_id]
label = "Journal"
description = "Das Buchführungsjournal, dessen Belege zur Serie gehören"

[labels.de.model.accounting_se_voucher_series.field.is_default]
label = "Standard"
description = "Ob die Serie verwendet wird, wenn keine angegeben ist"

[labels.de.model.accounting_se_voucher_series.field.active]
label = "Aktiv"
description = "Ob die Serie noch verwendet werden kann"

[labels.de.model.accounting_se_voucher_series.field.note]
label = "Notiz"
description = "Anmerkungen dazu, wie die Serie verwendet wird"

[labels.de.model.accounting_se_vat_box]
name = "Umsatzsteuerfeld"
description = "Ein Feld der schwedischen Umsatzsteuererklärung. UNGEPRÜFT, bis es mit SKV 4700 abgeglichen wurde"

[labels.de.model.accounting_se_vat_box.field.box]
label = "Feld"
description = "Feldnummer wie auf dem Formular, zum Beispiel 05; keine zwei Felder haben dieselbe Nummer"

[labels.de.model.accounting_se_vat_box.field.label]
label = "Bezeichnung"
description = "Bezeichnung des Feldes auf Schwedisch, wie auf dem Formular"

[labels.de.model.accounting_se_vat_box.field.kind]
label = "Art"
description = "Was das Feld enthält: base (Bemessungsgrundlage), output (Umsatzsteuer auf Ausgänge), input (Vorsteuer), result (zu zahlende oder zu erstattende Steuer)"

[labels.de.model.accounting_se_vat_box.field.kind.options]
base = "Bemessungsgrundlage"
output = "Ausgangsumsatzsteuer"
input = "Vorsteuer"
result = "Ergebnis"

[labels.de.model.accounting_se_vat_box.field.not_used]
label = "Nicht verwendet"
description = "Ob das Unternehmen das Feld nicht verwendet; ein Betrag in einem nicht verwendeten Feld ist ein Fehler"

[labels.de.model.accounting_se_vat_box.field.review]
label = "Prüfung"
description = "Prüfstatus des Feldes: unverified, verified. Beginnt ungeprüft; nur der Freigeber prüft, nach Abgleich mit SKV 4700"

[labels.de.model.accounting_se_vat_box.field.review.options]
unverified = "Ungeprüft"
verified = "Geprüft"

[labels.de.model.accounting_se_vat_box.field.verified]
label = "Geprüft"
description = "Ob das Feld vom Eigentümer geprüft wurde; bis dahin falsch"

[labels.de.model.accounting_se_vat_box.field.verified_by]
label = "Geprüft von"
description = "Anmeldename der Person, die geprüft hat"

[labels.de.model.accounting_se_vat_box.field.verified_on]
label = "Geprüft am"
description = "Datum der Prüfung (JJJJ-MM-TT)"

[labels.de.model.accounting_se_vat_box.field.source]
label = "Quelle"
description = "Woher das Feld stammt und was geprüft wurde, zum Beispiel die Ausgabe von SKV 4700; leer heißt, dass keine Quelle geprüft wurde"

[labels.de.model.accounting_se_vat_box.action.verify]
label = "Prüfen"
description = "Das Feld als mit SKV 4700 abgeglichen markieren (nur Freigeber)"

[labels.de.model.accounting_se_vat_box.action.unverify]
label = "Prüfung zurücknehmen"
description = "Die Prüfung des Feldes zurücknehmen (nur Freigeber)"

[labels.de.model.accounting_se_vat_code]
name = "Umsatzsteuercode"
description = "Ein Umsatzsteuercode, den eine Hauptbuchzeile tragen kann, verknüpft mit einem Grundlagenfeld, einem Steuerfeld und Konten. UNGEPRÜFT, bis er mit SKV 4700 abgeglichen wurde"

[labels.de.model.accounting_se_vat_code.field.code]
label = "Code"
description = "Kurzer Code wie S25 (Verkauf mit 25 Prozent); keine zwei Codes haben denselben Wert"

[labels.de.model.accounting_se_vat_code.field.label]
label = "Beschreibung"
description = "Was der Code in Worten bedeutet"

[labels.de.model.accounting_se_vat_code.field.treatment]
label = "Behandlung"
description = "Art des Geschäftsvorfalls: sale_domestic, purchase_domestic, reverse_charge_eu, reverse_charge_non_eu, sale_eu_goods, sale_eu_services, export, exempt, none"

[labels.de.model.accounting_se_vat_code.field.treatment.options]
sale_domestic = "Inlandsverkauf"
purchase_domestic = "Inlandseinkauf"
reverse_charge_eu = "Reverse Charge, EU"
reverse_charge_non_eu = "Reverse Charge, außerhalb der EU"
sale_eu_goods = "Verkauf von Waren in die EU"
sale_eu_services = "Verkauf von Dienstleistungen in die EU"
export = "Exportverkauf"
exempt = "Steuerfrei"
none = "Keine Steuer"

[labels.de.model.accounting_se_vat_code.field.rate_bp]
label = "Steuersatz (Basispunkte)"
description = "Steuersatz in Basispunkten: 2500 bedeutet 25,00 Prozent, 1200 12,00, 600 6,00, 0 keine"

[labels.de.model.accounting_se_vat_code.field.base_box_id]
label = "Grundlagenfeld"
description = "Feld, das den Nettobetrag von Zeilen mit diesem Code aufnimmt; leer, wenn keines"

[labels.de.model.accounting_se_vat_code.field.base_side]
label = "Seite der Grundlage"
description = "Welche Seite der Zeile als Grundlage zählt: credit oder debit"

[labels.de.model.accounting_se_vat_code.field.base_side.options]
credit = "Haben"
debit = "Soll"

[labels.de.model.accounting_se_vat_code.field.vat_box_id]
label = "Steuerfeld"
description = "Feld, das den auf dem Steuerkonto gebuchten Steuerbetrag aufnimmt; leer, wenn keines"

[labels.de.model.accounting_se_vat_code.field.vat_account_id]
label = "Steuerkonto"
description = "Das Konto, auf das der Steuerbetrag gebucht wird. Vom Nutzer aus dem eigenen Kontenplan gewählt; das Paket liefert keines"

[labels.de.model.accounting_se_vat_code.field.vat_side]
label = "Seite des Steuerkontos"
description = "Welche Seite des Steuerkontos als Steuer für das Feld zählt: credit oder debit"

[labels.de.model.accounting_se_vat_code.field.vat_side.options]
credit = "Haben"
debit = "Soll"

[labels.de.model.accounting_se_vat_code.field.tax_id]
label = "Steuersatz-Eintrag"
description = "Der Buchführungssteuersatz, dem der Code entspricht, falls es einen gibt"

[labels.de.model.accounting_se_vat_code.field.active]
label = "Aktiv"
description = "Ob der Code noch auf neue Zeilen gesetzt werden kann"

[labels.de.model.accounting_se_vat_code.field.review]
label = "Prüfung"
description = "Prüfstatus des Codes: unverified, verified. Beginnt ungeprüft; nur der Freigeber prüft, nach Abgleich mit SKV 4700"

[labels.de.model.accounting_se_vat_code.field.review.options]
unverified = "Ungeprüft"
verified = "Geprüft"

[labels.de.model.accounting_se_vat_code.field.verified]
label = "Geprüft"
description = "Ob der Code vom Eigentümer geprüft wurde; bis dahin falsch"

[labels.de.model.accounting_se_vat_code.field.verified_by]
label = "Geprüft von"
description = "Anmeldename der Person, die geprüft hat"

[labels.de.model.accounting_se_vat_code.field.verified_on]
label = "Geprüft am"
description = "Datum der Prüfung (JJJJ-MM-TT)"

[labels.de.model.accounting_se_vat_code.field.source]
label = "Quelle"
description = "Woher der Code stammt und was geprüft wurde, zum Beispiel die Ausgabe von SKV 4700; leer heißt, dass keine Quelle geprüft wurde"

[labels.de.model.accounting_se_vat_code.action.verify]
label = "Prüfen"
description = "Den Code als mit SKV 4700 abgeglichen markieren (nur Freigeber)"

[labels.de.model.accounting_se_vat_code.action.unverify]
label = "Prüfung zurücknehmen"
description = "Die Prüfung des Codes zurücknehmen (nur Freigeber)"

[labels.de.model.accounting_se_vat_report]
name = "Umsatzsteuerbericht"
