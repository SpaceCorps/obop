sale = "Verkauf"
purchase = "Einkauf"
cash = "Kasse"
bank = "Bank"
general = "Allgemein"

[labels.de.model.accounting_journal.field.default_account_id]
label = "Standardkonto"
description = "Standardkonto für Buchungen dieses Journals (bei einem Bankjournal das Bankkonto)"

[labels.de.model.accounting_journal.field.currency]
label = "Währung"
description = "Währungscode des Journals nach ISO 4217, zum Beispiel EUR; leer bedeutet die Firmenwährung"

[labels.de.model.accounting_journal.field.active]
label = "Aktiv"
description = "Ob das Journal noch Buchungen aufnehmen kann"

[labels.de.model.accounting_tax]
