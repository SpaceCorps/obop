description = "Ein Journal, das Buchungen einer Art zusammenfasst (Verkauf, Einkauf, Bank, Kasse, Sonstiges)"

[labels.de.model.accounting_journal.field.name]
label = "Name"
description = "Name des Journals, zum Beispiel Kundenrechnungen"

[labels.de.model.accounting_journal.field.code]
label = "Code"
description = "Kurzcode des Journals, zum Beispiel INV; keine zwei Journale haben denselben"

