[labels.de.module]
name = "Buchhaltung"
description = "Kontenplan, Journale, Steuersätze, Buchungen mit Soll- und Haben-Zeilen, Geschäftsjahre, Perioden und Kontoauszugszeilen. Beträge in der kleinsten Währungseinheit. Gebucht wird nur bei gleicher Summe Soll und Haben, mit lückenloser Jahresnummer. Codes sind eindeutig. Buchen und Abschließen brauchen eine menschliche Genehmigung (accounting.approver); Agenten dürfen nur vorschlagen."
summary = "Kontenplan, Journale, Steuern, Perioden und Buchungen. Buchen und Abschließen brauchen eine menschliche Genehmigung."

[labels.de.model.accounting_account]
name = "Konto"
description = "Ein Konto des Kontenplans"

[labels.de.model.accounting_account.field.code]
label = "Code"
description = "Kontonummer wie im Kontenplan, zum Beispiel 400000; keine zwei Konten haben dieselbe"

[labels.de.model.accounting_account.field.name]
label = "Name"
description = "Kontobezeichnung, zum Beispiel Forderungen aus Lieferungen und Leistungen"

[labels.de.model.accounting_account.field.account_type]
label = "Kontoart"
description = "Art des Kontos: asset_receivable, asset_cash, asset_current, asset_fixed, liability_payable, liability_current, liability_non_current, equity, income, income_other, expense, expense_direct_cost"

[labels.de.model.accounting_account.field.account_type.options]
asset_receivable = "Forderungen"
asset_cash = "Liquide Mittel"
asset_current = "Umlaufvermögen"
asset_fixed = "Anlagevermögen"
liability_payable = "Verbindlichkeiten"
liability_current = "Kurzfristige Verbindlichkeiten"
liability_non_current = "Langfristige Verbindlichkeiten"
equity = "Eigenkapital"
income = "Erlöse"
income_other = "Sonstige Erlöse"
expense = "Aufwand"
expense_direct_cost = "Direkte Kosten"

[labels.de.model.accounting_account.field.reconcile]
