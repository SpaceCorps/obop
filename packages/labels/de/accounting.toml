[labels.de.model.accounting_account.field.deprecated]
label = "Veraltet"
description = "Ob das Konto für neue Buchungen gesperrt ist"

[labels.de.model.accounting_account.field.note]
label = "Notiz"
description = "Interne Hinweise zur Verwendung des Kontos"

[labels.de.model.accounting_journal]
