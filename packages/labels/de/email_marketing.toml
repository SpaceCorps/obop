[labels.de.model.email_marketing_contact.field.name]
label = "Name"
description = "Name des Kontakts"

[labels.de.model.email_marketing_contact.field.consent_status]
label = "Einwilligungsstatus"
description = "Erlaubnis zum Anschreiben: ausstehend, eingewilligt, abgemeldet, unzustellbar"

[labels.de.model.email_marketing_contact.field.consent_status.options]
pending = "Ausstehend"
