label = "Name"
description = "Name der Liste, zum Beispiel Newsletter"

[labels.de.model.email_marketing_list.field.description]
label = "Beschreibung"
description = "Was Abonnenten erhalten"

[labels.de.model.email_marketing_list.field.is_public]
label = "Öffentlich"
description = "Ob sich Besucher selbst anmelden können"

[labels.de.model.email_marketing_contact]
name = "Kontakt"
