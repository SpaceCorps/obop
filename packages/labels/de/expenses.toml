[labels.de.module]
name = "Spesen"
description = "Spesenabrechnungen von Mitarbeitern mit dem Ablauf Entwurf, eingereicht, genehmigt und bezahlt. Das Bezahlen braucht eine eigene Berechtigung und eine menschliche Genehmigung; Belege werden per Notiz referenziert. Nummer aus einer Jahresserie; Mitarbeiter sehen nur ihre eigenen Abrechnungen, Führungskräfte und Finanzen alle."
summary = "Spesenabrechnungen von Mitarbeitern mit dem Ablauf Entwurf, eingereicht, genehmigt und bezahlt."

[labels.de.model.expenses_expense]
name = "Ausgabe"
description = "Ein Betrag, den ein Mitarbeiter für das Unternehmen ausgegeben hat und erstattet haben möchte"

[labels.de.model.expenses_expense.field.description]
label = "Beschreibung"
description = "Wofür das Geld ausgegeben wurde"

[labels.de.model.expenses_expense.field.employee]
label = "Mitarbeiter"
description = "Benutzername der Person, die die Spesen geltend macht; standardmäßig die Person, die die Abrechnung anlegt"

[labels.de.model.expenses_expense.field.spent_on]
label = "Ausgegeben am"
description = "Datum des Kaufs (YYYY-MM-DD)"

[labels.de.model.expenses_expense.field.category]
label = "Kategorie"
description = "Ausgabenkategorie: Reise, Verpflegung, Unterkunft, Material, Software, Sonstiges"

[labels.de.model.expenses_expense.field.category.options]
travel = "Reise"
meals = "Verpflegung"
lodging = "Unterkunft"
supplies = "Material"
software = "Software"
other = "Sonstiges"

[labels.de.model.expenses_expense.field.amount]
label = "Betrag"
description = "Dem Mitarbeiter geschuldeter Betrag (kleinste Währungseinheit, z. B. Cent)"

[labels.de.model.expenses_expense.field.currency]
label = "Währung"
description = "Währungscode nach ISO 4217, zum Beispiel EUR"

[labels.de.model.expenses_expense.field.receipt_note]
label = "Belegnotiz"
description = "Wo der Beleg aufbewahrt wird und was er zeigt"

[labels.de.model.expenses_expense.field.paid_on]
label = "Bezahlt am"
description = "Datum, an dem der Mitarbeiter erstattet wurde (YYYY-MM-DD)"

[labels.de.model.expenses_expense.field.payment_reference]
label = "Zahlungsreferenz"
description = "Überweisungsreferenz der Erstattung"

[labels.de.model.expenses_expense.field.state]
label = "Status"
description = "Status der Abrechnung: Entwurf, eingereicht, genehmigt, bezahlt, abgelehnt"

[labels.de.model.expenses_expense.field.state.options]
draft = "Entwurf"
submitted = "Eingereicht"
approved = "Genehmigt"
paid = "Bezahlt"
refused = "Abgelehnt"

[labels.de.model.expenses_expense.action.submit]
label = "Einreichen"
description = "Die Abrechnung zur Genehmigung einreichen"

[labels.de.model.expenses_expense.action.approve]
label = "Genehmigen"
description = "Eine eingereichte Abrechnung genehmigen (nur Führungskräfte)"

[labels.de.model.expenses_expense.action.pay]
label = "Bezahlen"
description = "Die Erstattung als bezahlt erfassen (nur Finanzen)"

[labels.de.model.expenses_expense.action.refuse]
label = "Ablehnen"
description = "Eine eingereichte Abrechnung ablehnen (nur Führungskräfte)"

[labels.de.model.expenses_expense.field.number]
label = "Nummer"
description = "Abrechnungsnummer wie EXP-2026-0042, wird beim Anlegen vergeben; die Serie beginnt jedes Jahr neu"
