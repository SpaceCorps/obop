description = "URL-Pfad der Seite ohne Schrägstriche an den Enden, Kleinbuchstaben mit Bindestrichen, zum Beispiel ueber-uns. Die Seite mit dem Pfad home ist die Startseite"

[labels.de.model.website_page.field.body]
label = "Inhalt"
description = "Seiteninhalt in Markdown (eine sichere Teilmenge: Überschriften, Listen, Links, Hervorhebungen, Code, Zitate, Tabellen)"

[labels.de.model.website_page.field.seo_title]
label = "SEO-Titel"
description = "In Suchergebnissen angezeigter Titel; leer bedeutet den Seitentitel"

[labels.de.model.website_page.field.seo_description]
label = "SEO-Beschreibung"
