# Machine-drafted labels of the built-in Mail module (docs/spec/mail.md).

[labels.de.module]
name = "E-Mail"
description = "Ausgehende E-Mail: Mailserver (SMTP-Relays und Anbieter-APIs über die Connectors), Vorlagen in sieben Sprachen, eine Warteschlange mit Wiederholungen und ein Versandprotokoll, das nie den Text zeigt."
summary = "E-Mails über Ihr eigenes SMTP-Relay oder einen Anbieter senden, mit Vorlagen und Versandprotokoll."

