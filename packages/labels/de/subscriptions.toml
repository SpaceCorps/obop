[labels.de.module]
name = "Abonnements"
description = "Wiederkehrende Tarife und Kundenabonnements mit dem Ablauf Testphase, aktiv, überfällig und storniert. Das Datum der nächsten Rechnung wird erfasst; Rechnungen werden nicht selbstständig erstellt."
summary = "Wiederkehrende Tarife und Kundenabonnements mit dem Ablauf Testphase, aktiv, überfällig und storniert."

[labels.de.model.subscriptions_plan]
name = "Tarif"
description = "Ein wiederkehrendes Angebot, das Kunden abonnieren können"

[labels.de.model.subscriptions_plan.field.name]
label = "Name"
description = "Name des Tarifs, zum Beispiel Team jährlich"

[labels.de.model.subscriptions_plan.field.code]
label = "Code"
description = "Kurzcode des Tarifs"

[labels.de.model.subscriptions_plan.field.interval]
