description = "Das wiederkehrende Abonnement eines Kunden für einen Tarif"

[labels.de.model.subscriptions_subscription.field.customer_id]
label = "Kunde"
description = "Der Kunde, der abonniert hat"

[labels.de.model.subscriptions_subscription.field.plan_id]
label = "Tarif"
description = "Der abonnierte Tarif"

[labels.de.model.subscriptions_subscription.field.started_on]
label = "Begonnen am"
description = "Datum, an dem das Abonnement begann (YYYY-MM-DD)"

[labels.de.model.subscriptions_subscription.field.trial_ends_on]
label = "Testphase endet am"
description = "Datum, an dem die kostenlose Testphase endet (YYYY-MM-DD)"

[labels.de.model.subscriptions_subscription.field.next_invoice_on]
label = "Nächste Rechnung am"
