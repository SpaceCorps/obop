[labels.de.model.subscriptions_subscription.field.state]
label = "Status"
description = "Abonnementstatus: Testphase, aktiv, überfällig, storniert"

[labels.de.model.subscriptions_subscription.field.state.options]
trial = "Testphase"
active = "Aktiv"
