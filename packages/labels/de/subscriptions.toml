[labels.de.model.subscriptions_subscription.action.cancel]
label = "Stornieren"
description = "Ein aktives Abonnement stornieren"

[labels.de.model.subscriptions_subscription.action.cancel_overdue]
label = "Wegen Verzug stornieren"
