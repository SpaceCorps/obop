[labels.de.module]
name = "Personal"
description = "Mitarbeiter, Abteilungen und Abwesenheitsanträge. Personenbezogene Daten sind streng klassifiziert: Gehalt, Bankverbindung und Ausweisnummer sind nur für Führungskräfte sichtbar, Gesundheits- und Gewerkschaftsdaten nur für die Sonderlesegruppe. Mitarbeiter sehen und stellen nur ihre eigenen Abwesenheitsanträge; hr.manager sieht alle."

