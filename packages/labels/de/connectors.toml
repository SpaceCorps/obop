name = "Konnektoren"
description = "Externe Systeme anbinden und Personen ihre eigenen Konten verbinden lassen, mit eingebauten Kontrollen zur Unterstützung der DSGVO: dokumentierte Rechtsgrundlage, widerrufbare Einwilligung, Datenminimierung, Pseudonymisierung nach Datenklasse, Protokoll ohne Nutzdaten und Verarbeitungsverzeichnis. Technische Kontrollen, keine Rechtsberatung oder Zertifizierung."

