[labels.de.module]
name = "Einkauf"
description = "Lieferanten, Bestellungen und Bestellpositionen mit dem Ablauf Entwurf, gesendet, bestätigt, eingegangen und storniert. Eine Bestellung hat eine Nummer aus einer Serie, ihre Summe ist die Summe ihrer Positionen, und der Wareneingang erzeugt je Position eine Lagerbewegung als Entwurf am Wareneingangsort (das Lager validiert sie)."
summary = "Lieferanten, Bestellungen und Bestellpositionen mit dem Ablauf Entwurf, gesendet, bestätigt, eingegangen."

