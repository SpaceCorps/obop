[labels.de.module]
name = "Fertigung"
description = "Stücklisten und Fertigungsaufträge mit dem Ablauf Entwurf, bestätigt, in Bearbeitung und erledigt. Ein Auftrag listet die Komponenten, die er verbraucht; beim Fertigstellen entstehen die Lagerbewegungen, die diese Komponenten am Produktionsort entnehmen und das Fertigprodukt dort einbuchen. Erledigte und stornierte Aufträge sind gesperrt."
summary = "Stücklisten und Fertigungsaufträge mit dem Ablauf Entwurf, bestätigt, in Bearbeitung und erledigt."

[labels.de.model.manufacturing_bom]
name = "Stückliste"
plural = "Stücklisten"
description = "Eine Rezeptur: die Komponenten, die zur Herstellung eines Produkts nötig sind"

[labels.de.model.manufacturing_bom.field.product_id]
label = "Produkt"
description = "Das Fertigprodukt, das die Stückliste herstellt"

[labels.de.model.manufacturing_bom.field.name]
label = "Name"
description = "Name der Stückliste, zum Beispiel Standardmontage"

[labels.de.model.manufacturing_bom.field.quantity]
label = "Menge"
description = "Stückzahl des Fertigprodukts, die ein Durchlauf erzeugt"

[labels.de.model.manufacturing_bom.field.instructions]
label = "Anweisungen"
description = "Montagehinweise für die Werkstatt"

[labels.de.model.manufacturing_bom.field.active]
label = "Aktiv"
description = "Ob die Stückliste für neue Aufträge verwendet werden kann"

[labels.de.model.manufacturing_bom_line]
name = "Stücklistenposition"
plural = "Komponenten"
description = "Eine Komponente einer Stückliste"

[labels.de.model.manufacturing_bom_line.field.bom_id]
label = "Stückliste"
description = "Die Stückliste, zu der die Komponente gehört"

[labels.de.model.manufacturing_bom_line.field.component_id]
label = "Komponente"
description = "Das verbrauchte Produkt"

[labels.de.model.manufacturing_bom_line.field.quantity]
label = "Menge"
description = "Stückzahl der Komponente pro Durchlauf"

[labels.de.model.manufacturing_order]
name = "Fertigungsauftrag"
plural = "Fertigungsaufträge"
description = "Eine Anweisung, eine Menge eines Produkts herzustellen"

[labels.de.model.manufacturing_order.guard]
message = "Ein erledigter oder stornierter Fertigungsauftrag kann nicht geändert werden."

[labels.de.model.manufacturing_order.field.number]
label = "Nummer"
description = "Auftragsnummer wie MO-00042, wird beim Anlegen des Auftrags vergeben"

[labels.de.model.manufacturing_order.field.bom_id]
label = "Stückliste"
description = "Die Stückliste, nach der gefertigt wird"

[labels.de.model.manufacturing_order.field.quantity]
label = "Menge"
description = "Stückzahl des herzustellenden Fertigprodukts"

[labels.de.model.manufacturing_order.field.planned_on]
label = "Geplant am"
description = "Datum, an dem die Produktion beginnen soll (YYYY-MM-DD)"

[labels.de.model.manufacturing_order.field.deadline]
label = "Frist"
description = "Datum, an dem die Ware benötigt wird (YYYY-MM-DD)"

[labels.de.model.manufacturing_order.field.responsible]
label = "Verantwortlich"
description = "Name der Person, die den Durchlauf verantwortet"

[labels.de.model.manufacturing_order.field.state]
label = "Status"
description = "Auftragsstatus: Entwurf, bestätigt, in Bearbeitung, erledigt, storniert"

[labels.de.model.manufacturing_order.field.state.options]
draft = "Entwurf"
confirmed = "Bestätigt"
in_progress = "In Bearbeitung"
done = "Erledigt"
cancelled = "Storniert"

[labels.de.model.manufacturing_order.action.confirm]
label = "Bestätigen"
description = "Einen Auftragsentwurf bestätigen, damit die Produktion geplant werden kann; dafür braucht er das Fertigprodukt, einen Produktionsort und mindestens eine Komponentenzeile"
done = "Bestellung bestätigt"

[labels.de.model.manufacturing_order.action.confirm.assert.has_product]
message = "Wählen Sie zuerst das Fertigprodukt: Beim Abschluss des Auftrags wird es am Produktionsort eingelagert"

[labels.de.model.manufacturing_order.action.confirm.assert.has_location]
message = "Wählen Sie zuerst den Produktionsort: Beim Abschluss des Auftrags werden dort die Komponenten entnommen und das Produkt eingelagert"

[labels.de.model.manufacturing_order.action.confirm.assert.has_components]
message = "Fügen Sie zuerst die Komponenten hinzu: Ein Auftrag ohne Komponenten bewegt beim Abschluss keinen Bestand"

[labels.de.model.manufacturing_order.action.start]
label = "Starten"
description = "Die Produktion eines bestätigten Auftrags starten"
done = "Produktion gestartet"

[labels.de.model.manufacturing_order.action.finish]
label = "Fertigstellen"
description = "Die Produktion als abgeschlossen markieren: mit einem Produktionsort entsteht je Komponente eine Lagerbewegung im Entwurf, die sie dort entnimmt, und eine, die das Fertigprodukt dort einbucht, mit der Auftragsnummer als Herkunftsbeleg, zur Validierung durch das Lager (erfordert die Gruppe inventory.user)"
confirm = "Produktion als fertig markieren? Lagerbewegungen entnehmen die Komponenten und buchen das fertige Produkt am Produktionsort ein. Ein erledigter Auftrag kann nicht mehr geändert werden."
done = "Produktion abgeschlossen"

[labels.de.model.manufacturing_order.action.cancel]
label = "Stornieren"
description = "Einen Auftrag stornieren, der noch nicht bestätigt wurde"
confirm = "Diesen Auftrag stornieren?"
done = "Auftrag storniert"

[labels.de.model.manufacturing_order.field.product_id]
label = "Produkt"
description = "Das hergestellte Fertigprodukt; wird aus der Stückliste übernommen, wenn es fehlt"

[labels.de.model.manufacturing_order.field.location_id]
label = "Produktionsort"
description = "Der Produktionsort: beim Fertigstellen entstehen die Lagerbewegungen, die die Komponenten hier entnehmen und das Fertigprodukt hier einbuchen; leer erzeugt keine Bewegungen"

[labels.de.model.manufacturing_order_line]
name = "Auftragskomponente"
plural = "Auftragskomponenten"
description = "Eine Komponente, die ein Fertigungsauftrag verbraucht, mit der Stückzahl für den ganzen Auftrag"

[labels.de.model.manufacturing_order_line.guard]
message = "Die Komponenten eines erledigten oder stornierten Fertigungsauftrags können nicht geändert werden."

[labels.de.model.manufacturing_order_line.field.order_id]
label = "Fertigungsauftrag"
description = "Der Fertigungsauftrag, der die Komponente verbraucht"

[labels.de.model.manufacturing_order_line.field.component_id]
label = "Komponente"
description = "Das verbrauchte Produkt"

[labels.de.model.manufacturing_order_line.field.quantity]
label = "Menge"
description = "Stückzahl der Komponente, die der ganze Auftrag verbraucht"

[labels.de.model.manufacturing_order.filter.in_progress]
label = "In Arbeit"

[labels.de.model.manufacturing_order.filter.late]
label = "Verspätet"
