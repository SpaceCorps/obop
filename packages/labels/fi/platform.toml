[labels.fi.model.user_account.action.set_groups]
label = "Aseta ryhmät"
description = "Korvaa tilin käyttöoikeusryhmät. Anna id ja groups (koko luettelo jälkeenpäin). Tulee voimaan tilin seuraavassa pyynnössä. Hylätään tuntemattomille ryhmille sekä silloin, kun ylläpitäjäryhmä otetaan itseltä tai viimeiseltä ylläpitäjältä"

[labels.fi.model.user_account.action.offboard]
label = "Poista lopullisesti"
description = "Poista tili käytöstä ja päätä pysyvästi jokainen istunto, agenttitunniste ja yhdistetty sovellus. Käyttöönotto myöhemmin ei palauta niitä. Anna id ja halutessasi note"

[labels.fi.model.user_account.action.disable]
label = "Poista käytöstä"
description = "Poista tili käytöstä: se ei voi kirjautua ja sen tunnisteet lakkaavat toimimasta, kunnes tili otetaan uudelleen käyttöön. Anna id"

[labels.fi.model.user_account.action.enable]
label = "Ota käyttöön"
description = "Ota käytöstä poistettu tili uudelleen käyttöön. Lopullisen poiston yhteydessä peruutetut oikeudet pysyvät peruutettuina. Anna id"

[labels.fi.model.device]
name = "Laite"
description = "Puhelin tai tabletti, johon mobiilisovellus on kirjautunut: syntyy sovelluksen kirjautuessa ja päättyy mitätöimällä. Henkilö näkee, nimeää uudelleen ja mitätöi omat laitteensa; laitteiden ylläpitäjät näkevät ja mitätöivät kaikki."

[labels.fi.model.device.field.user]
label = "Käyttäjä"
description = "Tili, jolle laite kuuluu"

[labels.fi.model.device.field.name]
label = "Nimi"
description = "Laitteen nimi; henkilö voi nimetä sen uudelleen"

[labels.fi.model.device.field.client_name]
label = "Sovellus"
description = "Kirjautunut mobiilisovellus sellaisena kuin se nimesi itsensä"

[labels.fi.model.device.field.platform]
label = "Alusta"
description = "Sovelluksen ilmoittama alusta, esimerkiksi android tai ios"

[labels.fi.model.device.field.app_version]
label = "Sovelluksen versio"
description = "Sovelluksen versio sellaisena kuin se ilmoitti sen kirjautuessa ja jokaisella uusimiskerralla"

[labels.fi.model.device.field.push_token]
label = "Push-tunnus"
description = "Tämän laitteen push-palvelun osoite. Ei näytetä kenellekään eikä kirjoiteta tässä versiossa: push ei kuulu mobiilin ensimmäiseen vaiheeseen"

[labels.fi.model.device.field.registered_at]
label = "Kirjautunut"
description = "Milloin sovellus kirjautui tälle laitteelle"

[labels.fi.model.device.field.last_seen]
label = "Viimeksi aktiivinen"
description = "Milloin laite viimeksi uusi kirjautumisensa (viimeisen uusimisen aika, ei jokaisen pyynnön)"

[labels.fi.model.device.field.expires_at]
label = "Päättyy"
description = "Milloin laitteen kirjautuminen päättyy, ellei sitä uusita"

[labels.fi.model.device.field.state]
label = "Tila"
description = "active niin kauan kuin laite saa kirjautua; revoked, kun se on päätetty"

[labels.fi.model.device.field.state.options]
active = "Aktiivinen"
revoked = "Mitätöity"

[labels.fi.model.device.field.revoked_at]
label = "Mitätöity"
description = "Milloin laite päätettiin"

[labels.fi.model.device.field.grant]
label = "Kirjautumisperhe"
description = "Päivitystunnusten perhe, johon laite on sidottu (tunniste, ei tunnus)"

[labels.fi.model.device.action.revoke]
label = "Mitätöi"
description = "Päätä laite lopullisesti: sen päivitystunnukset lakkaavat toimimasta, sen käyttötunnus lakkaa toimimasta seuraavassa pyynnössä ja sovelluksen on kirjauduttava uudelleen. Henkilö mitätöi omat laitteensa; agentti voi vain ehdottaa sitä. Anna id"

[labels.fi.model.user_account.field.oid]
label = "Objektitunnus"
description = "Komennon bind_sso syöte: henkilön objektitunnus Microsoft-hakemistossa, GUID (ei sähköpostiosoite eikä käyttäjän pääasiallinen nimi)"

[labels.fi.model.user_account.field.sso_oid]
label = "Microsoft-objektitunnus"
description = "Objektitunnus, johon tili on sidottu Microsoft-kirjautumista varten; tyhjä, jos tiliä ei ole sidottu"

[labels.fi.model.user_account.field.sso_only]
label = "Vain Microsoft"
description = "Kirjautuuko tili vain Microsoftilla: sillä ei ole omaa salasana- tai pääsyavainkirjautumista. Komennon set_sso_only syöte (true tai false)"

[labels.fi.model.user_account.action.bind_sso]
label = "Sido Microsoftiin"
description = "Sido olemassa oleva tili henkilön Microsoft-identiteettiin, jotta hän voi kirjautua Microsoftilla. Anna id ja oid (henkilön objektitunnus hakemistossa, GUID). Ei luo tiliä eikä anna oikeuksia"

[labels.fi.model.user_account.action.unbind_sso]
label = "Poista sidos Microsoftiin"
description = "Poista tilin sidos Microsoft-identiteettiin. Hylätään, kun tili kirjautuu vain Microsoftilla. Anna id"

[labels.fi.model.user_account.action.set_sso_only]
label = "Aseta vain Microsoft"
description = "Tili kirjautuu vain Microsoftilla (se hylkää silloin pelkän salasanan ja pelkän pääsyavaimen) tai asetus poistetaan. Anna id ja sso_only (true tai false). Tilin on oltava sidottu, ja vähintään kahden muun ylläpitäjän on voitava yhä kirjautua paikallisesti toisella tekijällä. Päättää tilin istunnot"

[labels.fi.model.sso_provider]
name = "Microsoft-kirjautuminen"
description = "Microsoft Entra -vuokraaja, jolla henkilöt kirjautuvat: yksi vuokraaja, lukittu sen tunnuksella. Vain ylläpitäjät muuttavat sitä, ei koskaan agentti"

[labels.fi.model.sso_provider.field.tenant]
label = "Vuokraaja"
description = "Vuokraajan tunnus (GUID), jota vasten jokainen Microsoft-kirjautuminen tarkistetaan"

[labels.fi.model.sso_provider.field.client_id]
label = "Asiakastunnus"
description = "Sovellusrekisteröinnin sovellustunnus (asiakastunnus) tässä vuokraajassa"

[labels.fi.model.sso_provider.field.client_secret]
label = "Asiakassalaisuus"
description = "Komennon configure syöte: sovellusrekisteröinnin asiakassalaisuus, tallennettuna sinetöitynä palvelimen salaisuudella. Ei koskaan näytetä"

[labels.fi.model.sso_provider.field.enabled]
label = "Käytössä"
description = "Tarjoaako kirjautumissivu vaihtoehtoa ”Kirjaudu Microsoftilla”"

[labels.fi.model.sso_provider.field.secret_set]
label = "Salaisuus tallennettu"
description = "Onko asiakassalaisuus tallennettu"

[labels.fi.model.sso_provider.field.modified_at]
label = "Muutettu"
description = "Milloin asetukset muutettiin viimeksi"

[labels.fi.model.sso_provider.field.last_editor]
label = "Viimeksi muuttanut"
description = "Kuka muutti viimeksi"

[labels.fi.model.sso_provider.field.break_glass]
label = "Varaylläpitäjät"
description = "Ylläpitäjät, jotka kirjautuvat paikallisesti salasanalla ja toisella tekijällä (tie sisään, kun Microsoftia ei tavoiteta), pilkuilla erotettuina"

[labels.fi.model.sso_provider.field.break_glass_enough]
label = "Varaylläpitäjiä riittävästi"
description = "Onko heitä tarpeeksi (vähintään kaksi), jotta tili voi kirjautua vain Microsoftilla"

[labels.fi.model.sso_provider.action.configure]
label = "Määritä"
description = "Aseta Microsoft Entra -vuokraaja, jolla henkilöt kirjautuvat. Anna tenant (vuokraajan tunnus, GUID; common, organizations ja consumers hylätään), client_id (sovellusrekisteröinnin sovellustunnus) ja ensimmäisellä kerralla client_secret; enabled on oletuksena true. Tilit sidotaan komennolla user_account.bind_sso. Hylätään agenteilta"

[labels.fi.model.sso_provider.action.clear]
label = "Poista"
description = "Poista Microsoft-kirjautumisen asetukset. Sidokset säilyvät. Vain Microsoftilla kirjautuvat tilit pääsevät silloin sisään vain ylläpitäjien kautta, joilla on salasana ja toinen tekijä. Hylätään agenteilta"
