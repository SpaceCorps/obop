[labels.fi.module]
name = "Allekirjoitus"
description = "Asiakirjapohjat ja allekirjoituspyynnöt. Pyyntö voi viitata Asiakirjat-sovelluksen PDF-tiedostoon: lähetys säilyttää siitä tarkan kopion, ja esimies luo kertakäyttöisen linkin, jonka allekirjoittaja avaa ilman tiliä lukeakseen, kirjoittaakseen nimensä ja hyväksyäkseen. Vain yksinkertainen sähköinen allekirjoitus: linkki on ainoa tarkistus. Agentit eivät luo linkkejä."
summary = "Asiakirjapohjat ja allekirjoituspyynnöt; PDF allekirjoitetaan kertakäyttölinkillä. Yksinkertainen sähköinen allekirjoitus."

[labels.fi.model.sign_template]
name = "Asiakirjamalli"
description = "Asiakirja, joka voidaan lähettää allekirjoitettavaksi"

[labels.fi.model.sign_template.field.name]
label = "Nimi"
description = "Mallin nimi, esimerkiksi Työsopimus"

[labels.fi.model.sign_template.field.description]
label = "Kuvaus"
description = "Mihin asiakirjaa käytetään ja kuka sen allekirjoittaa"

[labels.fi.model.sign_template.field.body]
label = "Sisältö"
description = "Asiakirjan teksti tai viite paikkaan, jossa tiedosto säilytetään"

[labels.fi.model.sign_template.field.signer_role]
label = "Allekirjoittajan rooli"
description = "Allekirjoittajan rooli, esimerkiksi Asiakas"

[labels.fi.model.sign_template.field.active]
label = "Aktiivinen"
description = "Voivatko uudet pyynnöt käyttää mallia"

[labels.fi.model.sign_request]
name = "Allekirjoituspyyntö"
description = "Pyyntö, että yksi henkilö allekirjoittaa yhden asiakirjan"

[labels.fi.model.sign_request.field.template_id]
label = "Malli"
description = "Lähetettävä asiakirjapohja; tyhjä pyynnössä, joka koskee Asiakirjat-sovelluksen asiakirjaa"

[labels.fi.model.sign_request.field.document_id]
label = "Asiakirja"
description = "Asiakirjat-sovelluksen PDF, jonka allekirjoittaja lukee ja allekirjoittaa; pyynnön lähettäminen ottaa sen SHA-256:n ja säilyttää tarkan kopion"

[labels.fi.model.sign_request.field.title]
label = "Otsikko"
description = "Allekirjoittajalle näytettävä aihe"

[labels.fi.model.sign_request.field.message]
label = "Viesti"
description = "Allekirjoittajalle pyynnössä näytettävä viesti"

[labels.fi.model.sign_request.field.signer_name]
label = "Allekirjoittajan nimi"
description = "Allekirjoittavan henkilön nimi"

[labels.fi.model.sign_request.field.signer_email]
label = "Allekirjoittajan sähköposti"
description = "Allekirjoittajan sähköpostiosoite; valinnainen, obop ei lähetä sähköpostia asiakirjaa koskevasta pyynnöstä"

[labels.fi.model.sign_request.field.sent_on]
label = "Lähetetty"
description = "Päivä, jona pyyntö lähetettiin (YYYY-MM-DD)"

[labels.fi.model.sign_request.field.expires_on]
label = "Vanhenee"
description = "Viimeinen päivä, jona pyynnön voi allekirjoittaa (YYYY-MM-DD)"

[labels.fi.model.sign_request.field.signed_on]
label = "Allekirjoitettu"
description = "Päivä, jona asiakirja allekirjoitettiin (YYYY-MM-DD)"

[labels.fi.model.sign_request.field.signer_ip]
label = "Allekirjoittajan IP-osoite"
description = "Osoite, josta allekirjoitus tuli, välityspalvelinketjun ilmoittamana (todiste)"

[labels.fi.model.sign_request.field.signer_user_agent]
label = "Allekirjoittajan selain"
description = "Selain, jolla allekirjoitus tehtiin (todiste)"

[labels.fi.model.sign_request.field.signature_reference]
label = "Allekirjoitusviite"
description = "Missä allekirjoitus säilytetään; typed:NIMI linkin kautta kirjoitetulle nimelle"

[labels.fi.model.sign_request.field.document_hash]
label = "Asiakirjan tiiviste"
description = "Allekirjoitettavaksi lähetetyn tiedoston SHA-256-tiiviste (hex); asetetaan, kun asiakirjaa koskeva pyyntö lähetetään. Tallennetta ei ole suojattu muutoksilta: ylläpitäjä tai kuka tahansa, joka voi kirjoittaa tietokantaan, voi muuttaa sen"

[labels.fi.model.sign_request.field.document_file]
label = "Säilytetty kopio"
description = "Allekirjoitettavaksi lähetetyn PDF:n tarkka kopio, jotta tiedoston vaihtaminen Asiakirjat-sovelluksessa ei voi muuttaa sitä, mitä allekirjoitettiin; kukaan ei omista ryhmää, vain ylläpitäjä lukee sen"

[labels.fi.model.sign_request.field.signed_at]
label = "Allekirjoitusaika"
description = "Milloin allekirjoittaja allekirjoitti linkin kautta (UTC, palvelimen kello)"

[labels.fi.model.sign_request.field.signed_name]
label = "Kirjoitettu nimi"
description = "Koko nimi, jonka allekirjoittaja kirjoitti (todiste); signer_name pysyy pyydettynä nimenä"

[labels.fi.model.sign_request.field.consent_version]
label = "Suostumuksen versio"
description = "Suostumustekstin tunniste: sen versio, lähetyksen kieli (lomakkeen ilmoittama, muuten osoitteen, muuten selaimen, muuten instanssin kieli; ei todiste näytetystä sivusta) ja tämän kielen tekstien tiivisteen 8 ensimmäistä heksamerkkiä, esimerkiksi v1-draft/fi/a670b631"

[labels.fi.model.sign_request.field.state]
label = "Tila"
description = "Pyynnön tila: luonnos, lähetetty, allekirjoitettu, hylätty, vanhentunut"

[labels.fi.model.sign_request.field.state.options]
draft = "Luonnos"
sent = "Lähetetty"
signed = "Allekirjoitettu"
declined = "Hylätty"
expired = "Vanhentunut"

[labels.fi.model.sign_request.action.send]
label = "Lähetä"
description = "Lähetä pyyntö allekirjoittajalle"

[labels.fi.model.sign_request.action.sign]
label = "Allekirjoita"
description = "Kirjaa käsin, että allekirjoittaja allekirjoitti; vain pyynnölle, joka ei koske asiakirjaa, sillä asiakirjaa koskevan pyynnön allekirjoittaja allekirjoittaa linkin kautta"

[labels.fi.model.sign_request.action.sign.assert.document_request]
message = "Asiakirjaa koskevan pyynnön allekirjoittaja allekirjoittaa linkin kautta; sitä ei voi merkitä käsin allekirjoitetuksi"

[labels.fi.model.sign_request.action.decline]
label = "Kieltäydy"
description = "Kirjaa, että allekirjoittaja kieltäytyi"

[labels.fi.model.sign_request.action.expire]
label = "Merkitse vanhentuneeksi"
description = "Kirjaa, että pyyntö vanheni allekirjoittamatta"

[labels.fi.model.sign_request.action.send_document]
label = "Lähetä asiakirja"
description = "Lähetä pyyntö Asiakirjat-sovelluksen asiakirjasta: ottaa PDF:n SHA-256:n, säilyttää tarkan kopion ja siirtää pyynnön tilaan lähetetty; luo sen jälkeen allekirjoituslinkki"

[labels.fi.model.sign_link]
name = "Allekirjoituslinkki"
description = "Kertakäyttöinen linkki, jolla yksi henkilö voi allekirjoittaa yhden pyynnön; vain salaisuuden tiiviste säilytetään, joten linkki näytetään kerran, kun se luodaan"

[labels.fi.model.sign_link.field.request_id]
label = "Pyyntö"
description = "Allekirjoituspyyntö, jonka tämä linkki avaa"

[labels.fi.model.sign_link.field.expires_at]
label = "Voimassa asti"
description = "Milloin linkki lakkaa toimimasta (UTC); enintään 14 päivää luomisesta eikä koskaan pyynnön viimeisen päivän jälkeen"

[labels.fi.model.sign_link.field.used_at]
label = "Käytetty"
description = "Milloin linkkiä käytettiin allekirjoittamiseen (UTC); linkki toimii vain kerran"

[labels.fi.model.sign_link.field.revoked_at]
label = "Peruutettu"
description = "Milloin linkki peruutettiin (UTC); aseta arvo peruuttaaksesi linkin"

[labels.fi.model.sign_link.field.link]
label = "Linkkiosoite"
description = "Itse linkki: vain create-vastauksessa, näytetään kerran, ei koskaan tallenneta eikä koskaan palauteta komennoilla get, list tai search"
