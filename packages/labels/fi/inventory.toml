description = "Asiakirjoihin tulostettava lyhyt koodi, esimerkiksi VARASTO1"

[labels.fi.model.inventory_warehouse.field.address]
label = "Osoite"
description = "Toimipaikan postiosoite"

[labels.fi.model.inventory_warehouse.field.active]
label = "Aktiivinen"
description = "Onko varasto käytössä"

[labels.fi.model.inventory_location]
