[labels.fi.module]
name = "Varastonhallinta"
description = "Varastot, varastopaikat, varastosaldot ja varastosiirrot. Siirron vahvistaminen vähentää määrän lähtöpaikan saldosta ja lisää sen kohdepaikan saldoon yhdellä kertaa; puuttuva saldorivi luodaan. Yksi rivi per tuote, paikka ja erä; negatiiviset määrät sallitaan. Määrä muuttuu vain siirroilla; valmiit ja perutut siirrot lukitaan. Rivin tuote ja paikka ovat kiinteät."
summary = "Varastot, varastopaikat, varastosaldot ja varastosiirrot."

[labels.fi.model.inventory_warehouse]
