[labels.fi.module]
name = "Kirjanpito Ruotsi"
description = "Kirjanpidon ruotsalainen lokalisointi: yrityksen tiedot, tositesarjat, alv-koodit ja -ruudut sekä jaksokohtainen alv-raportti, jonka ryhmä accounting.approver hyväksyy. TARKISTAMATON: mitään ei ole tarkistettu Skatteverketin (SKV 4700) tai SIE:n mukaan. BAS-tilikarttaa ei sisälly; käyttäjä valitsee tilit. Summat örinä, verokannat peruspisteinä. Täältä ei toimiteta mitään."

[labels.fi.model.accounting_se_company]
