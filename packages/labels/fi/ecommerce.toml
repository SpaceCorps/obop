[labels.fi.module]
name = "Verkkokauppa"
description = "Verkkokauppa: luokat, tuotteet kuvilla ja käännöksillä, toimitustavat, alennuskoodit, verokannat ja verkkotilaukset. Palvelin vähentää varaston, soveltaa alennukset ja verot ja laskee hinnat itse. Maksu tilisiirrolla, kortilla (Stripe Checkout) tai esittelytilassa. Hyvitykset vaativat esimiehen. Asiakastiedot eivät ole koskaan julkisia. Vaatii Tuotteet-paketin."

