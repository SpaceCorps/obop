[labels.fi.module]
name = "Projektit"
description = "Projektit, välitavoitteet ja tehtävät vastuuhenkilöineen, määräaikoineen ja tilakulkuineen. Edistymistä seurataan tilan mukaan, ei lasketa tehtävien työmäärästä."

[labels.fi.model.projects_project]
