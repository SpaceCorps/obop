description = "Lisätiedot, hyväksymiskriteerit ja linkit"

[labels.fi.model.projects_task.field.state]
label = "Tila"
description = "Tehtävän tila: tehtävänä, työn alla, valmis, peruutettu"

[labels.fi.model.projects_task.field.state.options]
todo = "Tehtävänä"
doing = "Työn alla"
done = "Valmis"
cancelled = "Peruutettu"

[labels.fi.model.projects_task.action.begin]
label = "Aloita"
description = "Ryhdy tekemään tehtävänä olevaa tehtävää"

[labels.fi.model.projects_task.action.complete]
label = "Merkitse valmiiksi"
