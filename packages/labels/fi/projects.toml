label = "Aloita"
description = "Siirrä suunniteltu projekti aktiiviseksi"

[labels.fi.model.projects_project.action.finish]
label = "Päätä"
description = "Merkitse aktiivinen projekti valmiiksi"

[labels.fi.model.projects_project.action.reopen]
label = "Avaa uudelleen"
description = "Avaa päättynyt projekti uudelleen"

[labels.fi.model.projects_milestone]
name = "Välitavoite"
