[labels.fi.model.projects_project.field.name]
label = "Nimi"
description = "Projektin nimi"

[labels.fi.model.projects_project.field.code]
label = "Koodi"
description = "Raporteissa käytettävä lyhyt viite, esimerkiksi WEB-24"

[labels.fi.model.projects_project.field.project_manager]
label = "Projektipäällikkö"
description = "Projektista vastaavan henkilön nimi"

[labels.fi.model.projects_project.field.start_on]
label = "Alkaa"
description = "Suunniteltu aloituspäivä (YYYY-MM-DD)"

[labels.fi.model.projects_project.field.deadline]
label = "Määräaika"
