[labels.fi.model.helpdesk_ticket.field.priority]
label = "Prioriteetti"
description = "Kuinka pian pyyntö pitää käsitellä: matala, normaali, korkea, kiireellinen"

[labels.fi.model.helpdesk_ticket.field.priority.options]
