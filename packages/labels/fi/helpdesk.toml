[labels.fi.module]
name = "Asiakastuki"
description = "Asiakastukitiketit prioriteetin, vakavuuden ja palvelutasotavoitteiden kanssa sekä avoin-, käynnissä-, ratkaistu- ja suljettu-kulussa. Tavoitteet kirjataan, mutta niitä ei valvota. Jokainen tiketti saa numeron sarjasta luotaessa."

[labels.fi.model.helpdesk_sla]
name = "SLA"
description = "Palvelutasosopimus: kuinka nopeasti tietyn prioriteetin tiketteihin pitää vastata ja ne ratkaista"

[labels.fi.model.helpdesk_sla.field.name]
label = "Nimi"
description = "Sopimuksen nimi, esimerkiksi Kiireellinen 4 tunnissa"

[labels.fi.model.helpdesk_sla.field.priority]
label = "Prioriteetti"
description = "Tiketin prioriteetti, jota sopimus koskee: matala, normaali, korkea, kiireellinen"

[labels.fi.model.helpdesk_sla.field.priority.options]
low = "Matala"
normal = "Normaali"
high = "Korkea"
urgent = "Kiireellinen"

[labels.fi.model.helpdesk_sla.field.first_response_minutes]
label = "Ensivastaus (min)"
description = "Tavoiteaika ensimmäiseen vastaukseen minuutteina"

[labels.fi.model.helpdesk_sla.field.resolution_minutes]
label = "Ratkaisuaika (min)"
description = "Tavoiteaika tiketin ratkaisuun minuutteina"

[labels.fi.model.helpdesk_sla.field.active]
label = "Aktiivinen"
description = "Voiko sopimuksen liittää uusiin tiketteihin"

