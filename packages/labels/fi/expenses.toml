[labels.fi.module]
name = "Kulut"
description = "Kulukorvaukset luonnos-, lähetetty-, hyväksytty- ja maksettu-kulussa. Maksaminen on oma käyttöoikeutensa. Hyväksyminen, hylkääminen ja maksaminen vaativat ihmisen hyväksynnän; agentit vain ehdottavat. Kuitti kuvana tai skannauksena; hyväksytyt, maksetut ja hylätyt korvaukset lukitaan. Vuosisarjan numero; työntekijä näkee vain omat korvauksensa, esihenkilöt ja talous kaikki."
summary = "Työntekijöiden kulukorvaukset luonnos-, lähetetty-, hyväksytty- ja maksettu-kulussa."

[labels.fi.model.expenses_expense]
name = "Kulu"
plural = "Kulut"
description = "Summa, jonka työntekijä on käyttänyt yrityksen lukuun ja jonka hän haluaa korvattavaksi"

[labels.fi.model.expenses_expense.guard]
message = "Hyväksyttyä, maksettua tai hylättyä kulukorvausta ei voi muuttaa, paitsi sen kuittia ja maksutietoja."

[labels.fi.model.expenses_expense.field.description]
label = "Kuvaus"
description = "Mihin rahat käytettiin"

[labels.fi.model.expenses_expense.field.employee]
label = "Työntekijä"
description = "Kulun hakevan henkilön käyttäjänimi; korvauksen luova henkilö, ellei toisin määritetä"

[labels.fi.model.expenses_expense.field.submitted_by]
label = "Lähettäjä"
description = "Korvauksen lähettäneen henkilön käyttäjänimi, jonka Lähetä-toiminto tallentaa; hänkään ei voi hyväksyä sitä, ellei oma hyväksyntä ole sallittu"

[labels.fi.model.expenses_expense.field.spent_on]
label = "Ostopäivä"
description = "Oston päivämäärä (YYYY-MM-DD)"

[labels.fi.model.expenses_expense.field.category]
label = "Luokka"
description = "Kululuokka: matkat, ateriat, majoitus, tarvikkeet, ohjelmisto, muu"

[labels.fi.model.expenses_expense.field.category.options]
travel = "Matkat"
meals = "Ateriat"
lodging = "Majoitus"
supplies = "Tarvikkeet"
software = "Ohjelmisto"
other = "Muu"

[labels.fi.model.expenses_expense.field.amount]
label = "Summa"
description = "Työntekijälle maksettava summa (valuutan pienin yksikkö, esimerkiksi sentit)"

[labels.fi.model.expenses_expense.field.currency]
label = "Valuutta"
description = "ISO 4217 -valuuttakoodi, esimerkiksi EUR"

[labels.fi.model.expenses_expense.field.receipt_note]
label = "Kuitin huomautus"
description = "Missä kuitti säilytetään ja mitä se osoittaa"

[labels.fi.model.expenses_expense.field.paid_on]
label = "Korvattu"
description = "Päivä, jona työntekijälle korvattiin kulu (YYYY-MM-DD)"

[labels.fi.model.expenses_expense.field.payment_reference]
label = "Maksuviite"
description = "Korvauksen tilisiirron viite"

[labels.fi.model.expenses_expense.field.state]
label = "Tila"
description = "Korvauksen tila: luonnos, hyväksyttävänä, hyväksytty, maksettu, hylätty"

[labels.fi.model.expenses_expense.field.state.options]
draft = "Luonnos"
submitted = "Hyväksyttävänä"
approved = "Hyväksytty"
paid = "Maksettu"
refused = "Hylätty"

[labels.fi.model.expenses_expense.action.submit]
label = "Lähetä hyväksyttäväksi"
description = "Lähetä kulukorvaus hyväksyttäväksi"
done = "Lähetetty hyväksyttäväksi"

[labels.fi.model.expenses_expense.action.approve]
label = "Hyväksy"
description = "Hyväksy lähetetty kulukorvaus (vain esihenkilö)"
done = "Kulukorvaus hyväksytty"

[labels.fi.model.expenses_expense.action.pay]
label = "Maksa"
description = "Kirjaa korvaus maksetuksi (vain talous); maksupäivä on tänään, ellei sitä ole annettu"
confirm = "Kirjataanko tämä kulukorvaus maksetuksi?"
done = "Kulukorvaus merkitty maksetuksi"

[labels.fi.model.expenses_expense.action.refuse]
label = "Hylkää"
description = "Hylkää lähetetty kulukorvaus (vain esihenkilö)"
confirm = "Hylätäänkö tämä kulukorvaus? Hylättyä kulukorvausta ei voi enää muuttaa."
done = "Kulukorvaus hylätty"

[labels.fi.model.expenses_expense.field.number]
label = "Numero"
description = "Korvauksen numero, esimerkiksi EXP-2026-0042, annetaan korvausta luotaessa; sarja alkaa alusta joka vuosi"

[labels.fi.model.expenses_expense.field.receipt]
description = "Kuitin valokuva tai skannaus (PDF tai kuva); ladattavissa vain niille, jotka saavat lukea korvauksen"
label = "Kuitti"

[labels.fi.model.expenses_expense.section.expense]
label = "Kulu"

[labels.fi.model.expenses_expense.section.notes]
label = "Muistiinpanot"

[labels.fi.model.expenses_expense.section.claimed_by]
label = "Hakija"

[labels.fi.model.expenses_expense.section.payment]
label = "Maksu"
