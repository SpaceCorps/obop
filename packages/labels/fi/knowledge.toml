[labels.fi.module]
name = "Tietämys"
description = "Wiki: ylätason artikkelin kautta puuksi järjestetyt artikkelit luonnos-, julkaistu- ja arkistoitu-kulussa, näkyvyysasetus ja tunnisteet. Näkyvyys on käyttöliittymän ja ihmisten noudatettava merkintä; alustalla ei ole vielä rivikohtaisia oikeuksia, joten kaikki Tietämys-ryhmien jäsenet voivat lukea kaikki artikkelit."

[labels.fi.model.knowledge_article]
name = "Artikkeli"
description = "Tietämyskannan artikkeli"

[labels.fi.model.knowledge_article.field.title]
label = "Otsikko"
description = "Artikkelin otsikko"

[labels.fi.model.knowledge_article.field.parent_id]
label = "Ylätaso"
description = "Artikkeli, jonka alle tämä sijoitetaan; tyhjä ylimmän tason artikkelille"

[labels.fi.model.knowledge_article.field.body]
label = "Sisältö"
description = "Artikkelin sisältö (Markdown)"

[labels.fi.model.knowledge_article.field.visibility]
label = "Näkyvyys"
description = "Kenelle artikkeli on tarkoitettu: yksityinen, työtila, julkinen"

[labels.fi.model.knowledge_article.field.visibility.options]
private = "Yksityinen"
