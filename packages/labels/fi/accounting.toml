asset_cash = "Kassa ja pankki"
asset_current = "Lyhytaikaiset vastaavat"
asset_fixed = "Pysyvät vastaavat"
liability_payable = "Ostovelat"
liability_current = "Lyhytaikainen vieras pääoma"
liability_non_current = "Pitkäaikainen vieras pääoma"
equity = "Oma pääoma"
