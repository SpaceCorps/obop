description = "Tilin tyyppi: myyntisaamiset, kassa ja pankki, lyhytaikaiset vastaavat, pysyvät vastaavat, ostovelat, lyhyt- tai pitkäaikainen vieras pääoma, oma pääoma, tuotot, kulut"

[labels.fi.model.accounting_account.field.account_type.options]
