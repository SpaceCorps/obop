[labels.fi.module]
name = "Kirjanpito"
description = "Tilikartta, päiväkirjat, verokannat, kirjaukset debet- ja kredit-riveineen, tilikaudet, jaksot ja tiliotteen rivit. Kirjaus näyttää debet- ja kredit-summansa, ja kirjaaminen evätään, ellei ne ole yhtä suuret; numero annetaan katkeamattomasta vuosisarjasta. Kirjaaminen sekä jakson tai tilikauden sulkeminen vaativat ihmisen hyväksynnän; agentit voivat vain ehdottaa niitä."

[labels.fi.model.accounting_account]
name = "Tili"
description = "Tilikartan tili"

[labels.fi.model.accounting_account.field.code]
