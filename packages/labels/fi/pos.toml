[labels.fi.model.pos_session.field.cash_difference]
label = "Kassaero"
description = "Loppukassa miinus odotettu käteinen, kun loppukassa on laskettu; negatiivinen tarkoittaa, että rahaa puuttuu"

[labels.fi.model.pos_session.field.note]
