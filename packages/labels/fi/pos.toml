[labels.fi.model.pos_session.field.opening_cash]
label = "Alkukassa"
description = "Avattaessa laatikosta laskettu käteinen (valuutan pienin yksikkö); ellei annettu, kassan edellisellä sulkemisella laskettu summa, muuten kassan tavallinen alkukassa"

[labels.fi.model.pos_session.field.expected_cash]
label = "Odotettu kassa"
description = "Käteinen, joka laatikossa pitäisi olla suljettaessa: alkukassa plus istunnon maksettujen myyntien käteismaksut, miinus siinä palautettujen suljettujen istuntojen myyntien käteinen; suljetun istunnon osalta summa, jolla se suljettiin"

