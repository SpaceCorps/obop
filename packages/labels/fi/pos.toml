[labels.fi.module]
name = "Kassa"
description = "Myymälän kassat: kassapisteen asetukset, kassavuorot, myynnit riveineen ja maksurivit maksutavoittain. Hyvitys ja vuoron sulkeminen vaativat esihenkilön hyväksynnän. Summat lasketaan, kuiteilla on katkeamaton vuosinumero, ja maksu luo rivikohtaisen luonnossiirron. Täsmäytys- ja hyvitysasetukset vain tallennetaan; mikään ei tarkista niitä. Korttinumeroita ei saa tallentaa. Vaatii Tuotteet-paketin."
summary = "Myymälän kassat: kassavuorot, myynnit riveineen ja maksut. Hyvitys ja sulkeminen vaativat hyväksynnän."

[labels.fi.model.pos_config]
name = "Kassapiste"
plural = "Kassapisteet"
description = "Kassapiste (kassa tai myymälä) ja sen asetukset"

[labels.fi.model.pos_config.field.name]
label = "Nimi"
description = "Kassan tai myymälän nimi, esimerkiksi Pääkadun myymälä"

[labels.fi.model.pos_config.field.currency]
label = "Valuutta"
description = "ISO 4217 -valuuttakoodi, esimerkiksi EUR"

[labels.fi.model.pos_config.field.receipt_header]
label = "Kuitin ylätunniste"
description = "Kuittien yläreunaan tulostettava teksti"

[labels.fi.model.pos_config.field.cash_control]
label = "Kassan täsmäytys"
description = "Onko kassalaatikon käteinen tarkoitus laskea avattaessa ja suljettaessa; vain tallennetaan, mikään ei tarkista sitä"

[labels.fi.model.pos_config.field.default_opening_cash]
label = "Oletusalkukassa"
description = "Käteinen, joka tavallisesti jätetään laatikkoon yöksi (valuutan pienin yksikkö)"

[labels.fi.model.pos_config.field.allow_refunds]
label = "Salli hyvitykset"
description = "Onko hyvitysten tarkoitus olla sallittuja tässä kassapisteessä; vain tallennetaan, mikään ei tarkista sitä"

[labels.fi.model.pos_config.field.active]
label = "Aktiivinen"
