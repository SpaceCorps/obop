[labels.fi.module]
name = "Verkkosivusto"
description = "Julkisen verkkosivuston sisältö: sivut, valikkokohdat, blogikirjoitukset, niiden käännökset ja kävijöiden lähettämät lomakeviestit. Kun julkinen sivusto on käytössä, julkaistu sisältö tarjoillaan kävijöille hakukoneystävällisenä ilman kirjautumista; vain julkiseksi merkityt kentät näkyvät. Julkaisu vaatii ihmisen hyväksynnän. Lähettäjät ovat henkilötietoja."

[labels.fi.model.website_page]
name = "Sivu"
description = "Verkkosivuston sivu"

[labels.fi.model.website_page.field.title]
label = "Otsikko"
description = "Sivun otsikko"

[labels.fi.model.website_page.field.slug]
label = "URL-tunnus"
description = "Sivun URL-polku ilman vinoviivoja päissä, pienillä kirjaimilla ja viivoilla, esimerkiksi tietoa-meista. Sivu, jonka URL-tunnus on home, on etusivu"

[labels.fi.model.website_page.field.body]
label = "Sisältö"
description = "Sivun sisältö Markdown-muodossa (turvallinen osajoukko: otsikot, luettelot, linkit, korostukset, koodi, lainaukset, taulukot)"

[labels.fi.model.website_page.field.seo_title]
