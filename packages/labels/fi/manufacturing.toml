[labels.fi.model.manufacturing_bom.field.quantity]
label = "Määrä"
description = "Valmiin tuotteen yksiköt, jotka yksi ajo tuottaa"

[labels.fi.model.manufacturing_bom.field.instructions]
label = "Ohjeet"
description = "Kokoonpanomuistiinpanot tuotantolattialle"

[labels.fi.model.manufacturing_bom.field.active]
label = "Aktiivinen"
description = "Voiko reseptiä käyttää uusiin tilauksiin"

[labels.fi.model.manufacturing_bom_line]
name = "Osaluettelon rivi"
plural = "Komponentit"
description = "Osaluettelon yksi komponentti"

[labels.fi.model.manufacturing_bom_line.field.bom_id]
label = "Osaluettelo"
description = "Resepti, johon komponentti kuuluu"

[labels.fi.model.manufacturing_bom_line.field.component_id]
