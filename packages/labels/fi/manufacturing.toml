[labels.fi.model.manufacturing_order.guard]
message = "Valmista tai peruttua valmistustilausta ei voi muuttaa."

[labels.fi.model.manufacturing_order.field.number]
label = "Numero"
description = "Tilausnumero kuten MO-00042, annetaan kun tilaus luodaan"

[labels.fi.model.manufacturing_order.field.bom_id]
label = "Osaluettelo"
description = "Noudatettava resepti"

[labels.fi.model.manufacturing_order.field.quantity]
label = "Määrä"
description = "Valmistettavan tuotteen yksiköt"

[labels.fi.model.manufacturing_order.field.planned_on]
label = "Suunniteltu"
description = "Päivä, jona tuotannon pitäisi alkaa (YYYY-MM-DD)"

[labels.fi.model.manufacturing_order.field.deadline]
label = "Määräaika"
description = "Päivä, jolloin tuotteet tarvitaan (YYYY-MM-DD)"

[labels.fi.model.manufacturing_order.field.responsible]
label = "Vastuuhenkilö"
description = "Ajosta vastaavan henkilön nimi"

[labels.fi.model.manufacturing_order.field.state]
label = "Tila"
description = "Tilauksen tila: luonnos, vahvistettu, käynnissä, valmis, peruutettu"

[labels.fi.model.manufacturing_order.field.state.options]
draft = "Luonnos"
confirmed = "Vahvistettu"
in_progress = "Käynnissä"
done = "Valmis"
cancelled = "Peruutettu"

[labels.fi.model.manufacturing_order.action.confirm]
label = "Vahvista"
description = "Vahvista luonnostilaus, jotta tuotanto voidaan suunnitella"

[labels.fi.model.manufacturing_order.action.confirm.assert.has_location]
message = "Valitse ensin tuotantopaikka: kun tilaus valmistuu, komponentit otetaan sieltä ja tuote viedään sinne"

[labels.fi.model.manufacturing_order.action.confirm.assert.has_components]
message = "Lisää ensin komponentit: tilaus ilman komponentteja ei siirrä varastoa valmistuessaan"

[labels.fi.model.manufacturing_order.action.start]
label = "Aloita"
description = "Aloita vahvistetun tilauksen tuotanto"

[labels.fi.model.manufacturing_order.action.finish]
label = "Päätä"
description = "Merkitse tuotanto päättyneeksi: kun tuotantopaikka on annettu, jokaisesta komponentista syntyy luonnossiirto, joka ottaa sen sieltä, ja yksi, joka vie valmiin tuotteen sinne, tilausnumero lähdeasiakirjana, varaston vahvistettavaksi (vaatii ryhmän inventory.user)"

[labels.fi.model.manufacturing_order.action.cancel]
label = "Peruuta"
description = "Peruuta tilaus, jota ei ole vahvistettu"

[labels.fi.model.manufacturing_order.field.product_id]
label = "Tuote"
description = "Valmistettava valmis tuote; otetaan osaluettelosta, jos sitä ei anneta"

[labels.fi.model.manufacturing_order.field.location_id]
label = "Tuotantopaikka"
description = "Tuotantopaikka: tilauksen päättäminen luo varastosiirrot, jotka ottavat komponentit täältä ja vievät valmiin tuotteen tänne; tyhjä ei luo siirtoja"

[labels.fi.model.manufacturing_order_line]
name = "Tilauksen komponentti"
plural = "Tilauksen komponentit"
description = "Komponentti, jota valmistustilaus käyttää, ja sen määrä koko tilaukselle"

[labels.fi.model.manufacturing_order_line.guard]
message = "Valmiin tai perutun valmistustilauksen komponentteja ei voi muuttaa."

[labels.fi.model.manufacturing_order_line.field.order_id]
label = "Valmistustilaus"
description = "Valmistustilaus, joka käyttää komponenttia"

[labels.fi.model.manufacturing_order_line.field.component_id]
label = "Komponentti"
description = "Kulutettava tuote"

[labels.fi.model.manufacturing_order_line.field.quantity]
label = "Määrä"
description = "Komponentin yksiköt, jotka koko tilaus käyttää"
