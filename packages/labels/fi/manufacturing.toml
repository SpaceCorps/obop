[labels.fi.module]
name = "Valmistus"
description = "Osaluettelot ja valmistustilaukset kulkuineen luonnos, vahvistettu, käynnissä ja valmis. Tilaus luettelee käyttämänsä komponentit; tilauksen päättäminen luo varastosiirrot, jotka ottavat komponentit tuotantopaikasta ja vievät valmiin tuotteen sinne. Valmiit ja perutut tilaukset on lukittu."
summary = "Osaluettelot ja valmistustilaukset luonnos-, vahvistettu-, käynnissä- ja valmis-kulussa."

[labels.fi.model.manufacturing_bom]
name = "Osaluettelo"
