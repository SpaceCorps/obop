description = "Resepti: tuotteen valmistukseen tarvittavat komponentit"

[labels.fi.model.manufacturing_bom.field.product_id]
label = "Tuote"
description = "Valmis tuote, jonka resepti valmistaa"

[labels.fi.model.manufacturing_bom.field.name]
