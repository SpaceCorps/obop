# Machine-drafted labels of the built-in Mail module (docs/spec/mail.md).

[labels.pl.module]
name = "Poczta"
description = "Poczta wychodząca: serwery pocztowe (przekaźniki SMTP i API dostawców przez Konektory), szablony w siedmiu językach, kolejka z ponowieniami i dziennik wysyłek, który nigdy nie pokazuje treści."
summary = "Wysyłaj pocztę przez własny przekaźnik SMTP lub dostawcę, z szablonami i dziennikiem wysyłek."

[labels.pl.model.outbound_mail]
