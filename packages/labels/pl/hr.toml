[labels.pl.module]
name = "Kadry"
description = "Pracownicy, działy i wnioski urlopowe. Dane osobowe są ściśle klasyfikowane: wynagrodzenie, rachunek bankowy i numer identyfikacyjny widzą tylko kierownicy, a dane o zdrowiu i związkach zawodowych tylko specjalna grupa. Pracownik widzi i składa tylko własne wnioski urlopowe; hr.manager widzi wszystkie."
summary = "Pracownicy, działy i wnioski urlopowe; dane o wynagrodzeniu i zdrowiu dostępne tylko dla odpowiednich grup."

