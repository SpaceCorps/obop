[labels.pl.module]
name = "Marketing e-mailowy"
description = "Listy mailingowe, kontakty na nich ze statusem i datą zgody oraz kampanie z obiegiem wersja robocza, zaplanowane, wysłane. Wysyłka jest nieodwracalna i dociera do realnych osób, więc wymaga zatwierdzenia przez kierownika; agenci mogą ją tylko zaproponować. Statystyki kampanii są wpisywane lub importowane, nie obliczane. Kontakty to dane osobowe: nie wysyłaj do kontaktu bez wyrażonej zgody."
summary = "Listy mailingowe, kontakty ze zgodą i kampanie. Wysyłka wymaga zatwierdzenia przez człowieka."

[labels.pl.model.email_marketing_list]
name = "Lista"
description = "Lista mailingowa, do której mogą należeć kontakty"

[labels.pl.model.email_marketing_list.field.name]
label = "Nazwa"
description = "Nazwa listy, na przykład Newsletter"

[labels.pl.model.email_marketing_list.field.description]
label = "Opis"
description = "Co otrzymują subskrybenci"

[labels.pl.model.email_marketing_list.field.is_public]
label = "Publiczna"
description = "Czy odwiedzający mogą sami się zapisać"

[labels.pl.model.email_marketing_contact]
name = "Kontakt"
description = "Osoba na liście mailingowej"

[labels.pl.model.email_marketing_contact.field.list_id]
label = "Lista"
description = "Lista, na której jest kontakt"

[labels.pl.model.email_marketing_contact.field.email]
label = "E-mail"
description = "Adres e-mail"

[labels.pl.model.email_marketing_contact.field.name]
label = "Nazwa"
description = "Imię i nazwisko kontaktu"

[labels.pl.model.email_marketing_contact.field.consent_status]
label = "Status zgody"
description = "Zgoda na wysyłkę: oczekująca, zgoda wyrażona, zgoda wycofana, niedoręczalne"

[labels.pl.model.email_marketing_contact.field.consent_status.options]
pending = "Oczekujące"
