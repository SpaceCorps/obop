[labels.pl.module]
name = "Marketing e-mailowy"
description = "Listy mailingowe, kontakty ze statusem i datą zgody oraz kampanie z obiegiem wersja robocza, zaplanowane, wysłane. Żaden e-mail nie jest wysyłany: oznaczenie kampanii jako wysłanej tylko to odnotowuje i wymaga zatwierdzenia przez kierownika; agenci mogą je tylko zaproponować. Statystyki są wpisywane lub importowane, nie obliczane. Kontakty to dane osobowe: nie wysyłaj do kontaktu bez zgody."
summary = "Listy mailingowe, kontakty ze zgodą i kampanie. Żaden e-mail nie jest wysyłany; oznaczenie kampanii jako wysłanej wymaga zatwierdzenia."

