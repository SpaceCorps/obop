[labels.pl.model.email_marketing_contact.field.consent_source]
label = "Źródło zgody"
description = "Skąd pozyskano zgodę, na przykład formularz zapisu na stronie"

[labels.pl.model.email_marketing_campaign]
name = "Kampania"
