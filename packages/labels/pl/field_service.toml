[labels.pl.model.field_service_job.field.scheduled_start_minute]
label = "Planowany początek (min)"
description = "Planowany początek w minutach od północy (540 oznacza 09:00)"

[labels.pl.model.field_service_job.field.planned_minutes]
label = "Planowany czas (min)"
