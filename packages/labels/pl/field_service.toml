[labels.pl.model.field_service_job.field.site_contact_phone]
label = "Telefon osoby kontaktowej"
description = "Numer telefonu osoby, z którą należy się spotkać na miejscu"

[labels.pl.model.field_service_job.field.technician_id]
label = "Technik"
description = "Technik przypisany do zlecenia"

[labels.pl.model.field_service_job.field.priority]
label = "Priorytet"
description = "Pilność zlecenia: niski, normalny, wysoki, pilny"

[labels.pl.model.field_service_job.field.priority.options]
low = "Niski"
normal = "Normalny"
high = "Wysoki"
urgent = "Pilny"

[labels.pl.model.field_service_job.field.description]
label = "Opis"
