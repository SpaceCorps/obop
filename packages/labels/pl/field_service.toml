[labels.pl.module]
name = "Serwis terenowy"
description = "Zlecenia u klientów wykonywane przez technika na miejscu: zaplanowane, w drodze, w toku, wykonane lub anulowane. Zlecenie zapisuje klienta, miejsce, technika, planowany dzień i początek (minuty od północy), użyte części oraz to, czy klient musi potwierdzić wykonanie podpisem. Adres miejsca i dane kontaktowe to dane osobowe. Wymaga pakietów Kadry i Produkty."

[labels.pl.model.field_service_job]
name = "Zlecenie"
description = "Zlecenie wykonywane u klienta na miejscu"

[labels.pl.model.field_service_job.field.name]
label = "Nazwa"
description = "Krótki tytuł zlecenia, na przykład Wymiana pompy kotła"

[labels.pl.model.field_service_job.field.customer_id]
label = "Klient"
description = "Klient, którego dotyczy zlecenie"

[labels.pl.model.field_service_job.field.site_name]
label = "Nazwa miejsca"
description = "Nazwa miejsca, na przykład Magazyn główny"

[labels.pl.model.field_service_job.field.site_address]
label = "Adres miejsca"
description = "Adres, pod którym wykonywane są prace; często dom prywatny"

[labels.pl.model.field_service_job.field.site_city]
label = "Miejscowość"
description = "Miejscowość, w której znajduje się miejsce prac"

[labels.pl.model.field_service_job.field.site_postcode]
label = "Kod pocztowy"
description = "Kod pocztowy miejsca prac"

[labels.pl.model.field_service_job.field.site_country]
label = "Kraj"
description = "Kraj, w którym znajduje się miejsce prac"

[labels.pl.model.field_service_job.field.site_contact_name]
