[labels.pl.module]
name = "Księgowość"
description = "Plan kont, dzienniki, stawki podatku, operacje księgowe z pozycjami winien i ma, lata obrotowe, okresy i wyciągi bankowe. Operacja pokazuje sumy winien i ma, a księgowanie jest odrzucane, gdy się różnią; numer nadawany jest z ciągłej serii rocznej. Księgowanie i zamykanie okresów wymaga zatwierdzenia przez człowieka; agenci mogą je tylko zaproponować."

[labels.pl.model.accounting_account]
name = "Konto"
description = "Konto planu kont"

[labels.pl.model.accounting_account.field.code]
