description = "Nazwa konta, na przykład Należności z tytułu dostaw i usług"

[labels.pl.model.accounting_account.field.account_type]
label = "Typ konta"
description = "Typ konta: należności, środki pieniężne, aktywa obrotowe, aktywa trwałe, zobowiązania handlowe, zobowiązania krótkoterminowe, zobowiązania długoterminowe, kapitał własny, przychody, pozostałe przychody, koszty, koszty bezpośrednie"

