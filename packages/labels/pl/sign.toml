[labels.pl.module]
name = "Podpisy"
description = "Szablony dokumentów i prośby o podpis. Prośba może wskazywać plik PDF w Dokumentach: wysłanie zachowuje jego dokładną kopię, a menedżer tworzy jednorazowy link, który osoba podpisująca otwiera bez konta, aby przeczytać, wpisać imię i nazwisko i wyrazić zgodę. Tylko zwykły podpis elektroniczny: link jest jedynym sprawdzeniem. Agenci nie tworzą linków."
summary = "Szablony dokumentów i prośby o podpis; PDF z Dokumentów można podpisać jednorazowym linkiem. Zwykły podpis elektroniczny."

[labels.pl.model.sign_template]
name = "Szablon"
description = "Dokument, który można wysłać do podpisu"

[labels.pl.model.sign_template.field.name]
label = "Nazwa"
description = "Nazwa szablonu, na przykład Umowa o pracę"

[labels.pl.model.sign_template.field.description]
label = "Opis"
description = "Do czego służy dokument i kto go podpisuje"

[labels.pl.model.sign_template.field.body]
label = "Treść"
description = "Tekst dokumentu lub odwołanie do miejsca przechowywania pliku"

[labels.pl.model.sign_template.field.signer_role]
label = "Rola podpisującego"
description = "Rola osoby podpisującej, na przykład Klient"

[labels.pl.model.sign_template.field.active]
label = "Aktywny"
description = "Czy nowe wnioski mogą używać szablonu"

[labels.pl.model.sign_request]
name = "Wniosek o podpis"
description = "Prośba, aby jedna osoba podpisała jeden dokument"

[labels.pl.model.sign_request.field.template_id]
label = "Szablon"
description = "Szablon dokumentu do wysłania; puste przy prośbie o dokument z Dokumentów"

[labels.pl.model.sign_request.field.document_id]
label = "Dokument"
description = "Plik PDF w Dokumentach, który osoba podpisująca czyta i podpisuje; wysłanie prośby zapisuje jego SHA-256 i zachowuje dokładną kopię"

[labels.pl.model.sign_request.field.title]
label = "Tytuł"
description = "Temat widoczny dla podpisującego"

[labels.pl.model.sign_request.field.message]
label = "Wiadomość"
description = "Wiadomość widoczna dla podpisującego we wniosku"

[labels.pl.model.sign_request.field.signer_name]
label = "Imię i nazwisko podpisującego"
description = "Imię i nazwisko osoby, która musi podpisać"

[labels.pl.model.sign_request.field.signer_email]
label = "E-mail podpisującego"
description = "Adres e-mail osoby podpisującej; opcjonalny, obop nie wysyła e-maili przy prośbie o dokument"

[labels.pl.model.sign_request.field.sent_on]
label = "Data wysłania"
description = "Dzień wysłania wniosku (YYYY-MM-DD)"

[labels.pl.model.sign_request.field.expires_on]
label = "Data wygaśnięcia"
description = "Ostatni dzień, w którym można podpisać wniosek (YYYY-MM-DD)"

[labels.pl.model.sign_request.field.signed_on]
label = "Data podpisania"
description = "Dzień podpisania dokumentu (YYYY-MM-DD)"

[labels.pl.model.sign_request.field.signer_ip]
label = "IP podpisującego"
description = "Adres, z którego pochodził podpis, zgłoszony przez łańcuch proxy (dowód)"

[labels.pl.model.sign_request.field.signer_user_agent]
label = "Przeglądarka podpisującego"
description = "Przeglądarka użyta do złożenia podpisu (dowód)"

[labels.pl.model.sign_request.field.signature_reference]
label = "Referencja podpisu"
description = "Gdzie przechowywany jest podpis; typed:NAZWA dla imienia i nazwiska wpisanego przez link"

[labels.pl.model.sign_request.field.document_hash]
label = "Skrót dokumentu"
description = "Skrót SHA-256 (hex) pliku wysłanego do podpisu; ustawiany przy wysłaniu prośby o dokument. Zapis nie jest zabezpieczony przed zmianą: może go zmienić administrator lub każdy, kto może zapisywać w bazie danych"

[labels.pl.model.sign_request.field.document_file]
label = "Zachowana kopia"
description = "Dokładna kopia pliku PDF wysłanego do podpisu, zachowana, aby wymiana pliku w Dokumentach nie mogła zmienić tego, co podpisano; nikt nie ma tej grupy, czyta ją tylko administrator"

[labels.pl.model.sign_request.field.signed_at]
label = "Podpisano o"
description = "Kiedy osoba podpisująca podpisała przez link (UTC, zegar serwera)"

[labels.pl.model.sign_request.field.signed_name]
label = "Wpisane imię i nazwisko"
description = "Pełne imię i nazwisko wpisane przez osobę podpisującą (dowód); signer_name pozostaje nazwą, o którą poproszono"

[labels.pl.model.sign_request.field.consent_version]
label = "Wersja zgody"
description = "Identyfikator tekstu zgody: jego wersja, język wysłania (lang formularza, jeśli wskazuje jeden z siedmiu; jeśli formularz w ogóle nie ma pola lang, język adresu; w przeciwnym razie przeglądarki, instancji, a na końcu angielski; to nie dowód, jaka strona została pokazana) oraz pierwsze 8 znaków szesnastkowych skrótu tekstów w tym języku, na przykład v1-draft/pl/c3127377"

[labels.pl.model.sign_request.field.state]
label = "Status"
description = "Status wniosku: wersja robocza, wysłane, podpisane, odrzucone, wygasłe"

[labels.pl.model.sign_request.field.state.options]
draft = "Wersja robocza"
sent = "Wysłane"
signed = "Podpisane"
declined = "Odrzucone"
expired = "Wygasłe"

[labels.pl.model.sign_request.action.send]
label = "Wyślij"
description = "Wysyła wniosek do podpisującego"

[labels.pl.model.sign_request.action.sign]
label = "Podpisz"
description = "Ręcznie rejestruje, że podpisujący złożył podpis; tylko dla wniosku bez dokumentu, ponieważ wniosek dotyczący dokumentu podpisuje sam podpisujący przez link"

[labels.pl.model.sign_request.action.sign.assert.document_request]
message = "Wniosek dotyczący dokumentu podpisuje sam podpisujący przez link; nie można go ręcznie oznaczyć jako podpisanego"

[labels.pl.model.sign_request.action.decline]
label = "Odrzuć"
description = "Rejestruje, że podpisujący odmówił podpisu"

[labels.pl.model.sign_request.action.expire]
label = "Oznacz jako wygasłe"
description = "Rejestruje, że wniosek wygasł bez podpisu"

[labels.pl.model.sign_request.action.send_document]
label = "Wyślij dokument"
description = "Wyślij prośbę o dokument z Dokumentów: pobiera SHA-256 pliku PDF, zachowuje dokładną kopię i ustawia prośbę jako wysłaną; potem utwórz link do podpisu"

[labels.pl.model.sign_link]
name = "Link do podpisu"
description = "Jednorazowy link, dzięki któremu jedna osoba może podpisać jedną prośbę; zapisywany jest tylko skrót sekretu, więc link pokazywany jest raz, przy tworzeniu"

[labels.pl.model.sign_link.field.request_id]
label = "Prośba"
description = "Prośba o podpis, którą otwiera ten link"

[labels.pl.model.sign_link.field.expires_at]
label = "Ważny do"
description = "Kiedy link przestaje działać (UTC); najwyżej 14 dni od utworzenia i nigdy po ostatnim dniu prośby"

[labels.pl.model.sign_link.field.used_at]
label = "Użyty"
description = "Kiedy link został użyty do podpisu (UTC); link działa tylko raz"

[labels.pl.model.sign_link.field.revoked_at]
label = "Unieważniony"
description = "Kiedy link został unieważniony (UTC); ustaw wartość, aby unieważnić link"

[labels.pl.model.sign_link.field.link]
label = "Odnośnik"
description = "Sam link: tylko w odpowiedzi na create, pokazywany raz, nigdy nie zapisywany i nigdy nie zwracany przez get, list ani search"
