[labels.pl.module]
name = "Zakupy"
description = "Dostawcy, zamówienia zakupu i ich pozycje z obiegiem wersja robocza, wysłane, potwierdzone, przyjęte i anulowane. Zamówienie ma numer z serii, jego suma to suma pozycji, a przyjęcie towaru tworzy roboczą operację magazynową na pozycję w lokalizacji przyjęcia."
summary = "Dostawcy, zamówienia zakupu i ich pozycje z obiegiem wersja robocza, wysłane, potwierdzone, przyjęte."

[labels.pl.model.purchase_vendor]
name = "Dostawca"
plural = "Dostawcy"
description = "Warunki zakupu od kontaktu, u którego firma kupuje"

[labels.pl.model.purchase_vendor.field.party_id]
label = "Kontrahent"
description = "Rekord kontaktu dostawcy"

[labels.pl.model.purchase_vendor.field.vendor_reference]
label = "Nr klienta u dostawcy"
description = "Numer klienta Twojej firmy u tego dostawcy"

[labels.pl.model.purchase_vendor.field.payment_terms_days]
label = "Termin płatności (dni)"
description = "Liczba dni na zapłatę faktury"

[labels.pl.model.purchase_vendor.field.lead_time_days]
label = "Czas realizacji (dni)"
description = "Zwykła liczba dni od zamówienia do dostawy"

[labels.pl.model.purchase_vendor.field.iban]
label = "IBAN"
description = "Rachunek bankowy, na który płaci się dostawcy"

[labels.pl.model.purchase_vendor.field.active]
label = "Aktywny"
description = "Czy nadal kupujesz od tego dostawcy"

[labels.pl.model.purchase_order]
name = "Zamówienie zakupu"
plural = "Zamówienia zakupu"
description = "Zlecenie dla dostawcy na dostarczenie towarów lub usług"

[labels.pl.model.purchase_order.guard]
message = "Przyjętego lub anulowanego zamówienia nie można zmienić, z wyjątkiem jego notatek."

[labels.pl.model.purchase_order.field.reference]
label = "Referencja dostawcy"
description = "Numer oferty lub referencja dostawcy dla tego zamówienia, jeśli jest"

[labels.pl.model.purchase_order.field.vendor_id]
label = "Dostawca"
description = "Dostawca, u którego złożono zamówienie"

[labels.pl.model.purchase_order.field.ordered_on]
label = "Data zamówienia"
description = "Data złożenia zamówienia (YYYY-MM-DD)"

[labels.pl.model.purchase_order.field.expected_on]
label = "Oczekiwana data"
description = "Data, w której oczekuje się dostawy towarów (YYYY-MM-DD)"

[labels.pl.model.purchase_order.field.currency]
label = "Waluta"
description = "Kod waluty ISO 4217, na przykład PLN"

[labels.pl.model.purchase_order.field.total]
label = "Razem"
description = "Suma zamówienia: suma kwot pozycji (w jednostkach podrzędnych waluty, np. groszach)"

[labels.pl.model.purchase_order.field.notes]
label = "Notatki"
description = "Instrukcje dostawy i uwagi dla dostawcy"

[labels.pl.model.purchase_order.field.state]
label = "Status"
description = "Status zamówienia: wersja robocza, wysłane, potwierdzone, przyjęte, anulowane"

[labels.pl.model.purchase_order.field.state.options]
draft = "Wersja robocza"
sent = "Wysłane"
confirmed = "Potwierdzone"
received = "Przyjęte"
cancelled = "Anulowane"

[labels.pl.model.purchase_order.action.send]
label = "Wyślij"
description = "Wysyła zamówienie robocze do dostawcy jako zapytanie ofertowe"
done = "Oznaczono jako wysłane"

[labels.pl.model.purchase_order.action.confirm]
label = "Potwierdź"
description = "Zobowiązuje do zamówienia u dostawcy (tylko kierownik)"
confirm = "Potwierdzić to zamówienie u dostawcy?"
done = "Zamówienie potwierdzone"

[labels.pl.model.purchase_order.action.receive]
label = "Przyjmij"
description = "Rejestruje, że towar dotarł: tworzona jest robocza operacja magazynowa na pozycję do zatwierdzenia przez magazyn (wymaga grupy inventory.user)"
confirm = "Przyjąć towar? Gdy ustawiono miejsce przyjęcia, dla każdej pozycji powstaje szkic ruchu magazynowego do zatwierdzenia przez magazyn, a zamówienia nie będzie można już zmienić."
done = "Zamówienie przyjęte"

[labels.pl.model.purchase_order.action.cancel]
label = "Anuluj"
description = "Anuluje zamówienie, które nie zostało jeszcze wysłane"
confirm = "Anulować to zamówienie?"
done = "Zamówienie anulowane"

[labels.pl.model.purchase_order_line]
name = "Pozycja zamówienia"
plural = "Pozycje zamówienia"
description = "Jeden produkt lub usługa w zamówieniu zakupu"

[labels.pl.model.purchase_order_line.guard]
message = "Pozycji przyjętego lub anulowanego zamówienia nie można zmienić."

[labels.pl.model.purchase_order_line.field.order_id]
label = "Zamówienie"
description = "Zamówienie, do którego należy pozycja"

[labels.pl.model.purchase_order_line.field.product_id]
label = "Produkt"
description = "Zamawiany produkt"

[labels.pl.model.purchase_order_line.field.description]
label = "Opis"
description = "Sformułowanie dla dostawcy, jeśli różni się od nazwy produktu"

[labels.pl.model.purchase_order_line.field.quantity]
label = "Ilość"
description = "Liczba zamówionych sztuk"

[labels.pl.model.purchase_order_line.field.unit_price]
label = "Cena jednostkowa"
description = "Uzgodniona cena za sztukę (w jednostkach podrzędnych waluty, np. groszach)"

[labels.pl.model.purchase_order_line.field.received_quantity]
label = "Ilość przyjęta"
description = "Liczba sztuk, które faktycznie dotarły, jeśli różni się od zamówionej; puste oznacza, że dotarła zamówiona ilość. Ustaw przed przyjęciem zamówienia"

[labels.pl.model.purchase_order.field.number]
label = "Numer"
description = "Numer zamówienia zakupu, np. PO-00042, nadawany przy utworzeniu zamówienia"

[labels.pl.model.purchase_order.field.receive_location_id]
label = "Lokalizacja przyjęcia"
description = "Gdzie towar ma zostać przyjęty; przyjęcie zamówienia tworzy operacje magazynowe do tej lokalizacji"

[labels.pl.model.purchase_order_line.field.amount]
label = "Kwota"
description = "Kwota pozycji: ilość razy cena jednostkowa (w jednostkach podrzędnych waluty)"

[labels.pl.model.purchase_order_line.field.receipt_quantity]
label = "Ilość do przyjęcia"
description = "Liczba sztuk, które przyjęcie wprowadza na stan: ilość przyjęta, jeśli podana, w przeciwnym razie ilość zamówiona"
