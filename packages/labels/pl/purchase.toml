[labels.pl.model.purchase_order.field.state.options]
draft = "Wersja robocza"
sent = "Wysłane"
confirmed = "Potwierdzone"
received = "Przyjęte"
cancelled = "Anulowane"

[labels.pl.model.purchase_order.action.send]
