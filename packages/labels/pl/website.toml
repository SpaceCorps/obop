[labels.pl.module]
name = "Strona internetowa"
description = "Treści publicznej strony: strony, menu nawigacji, wpisy na blogu, ich tłumaczenia oraz zgłoszenia z formularzy. Przy włączonej stronie publicznej opublikowane treści są dostępne bez logowania, z SEO; widoczne są tylko pola publiczne. Publikację zatwierdza człowiek, agenci mogą ją tylko zaproponować. Dane nadawców są osobowe i nigdy publiczne."
summary = "Strony, menu, wpisy na blogu i zgłoszenia z formularzy, udostępniane jako strona publiczna przy włączonej stronie."

[labels.pl.model.website_page]
name = "Strona"
description = "Strona witryny internetowej"

[labels.pl.model.website_page.field.title]
label = "Tytuł"
description = "Tytuł strony"

[labels.pl.model.website_page.field.slug]
label = "Slug URL"
description = "Ścieżka URL strony bez ukośników na końcach, małe litery z myślnikami, na przykład o-nas. Strona ze slugiem home jest stroną główną"

[labels.pl.model.website_page.field.body]
label = "Treść"
description = "Treść strony w Markdown (bezpieczny podzbiór: nagłówki, listy, linki, wyróżnienia, kod, cytaty, tabele)"

[labels.pl.model.website_page.field.seo_title]
label = "Tytuł SEO"
description = "Tytuł wyświetlany w wynikach wyszukiwania; puste oznacza tytuł strony"

