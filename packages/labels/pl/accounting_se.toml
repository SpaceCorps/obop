description = "Jak często składana jest deklaracja VAT: monthly, quarterly, yearly"

[labels.pl.model.accounting_se_company.field.vat_period.options]
monthly = "Miesięcznie"
quarterly = "Kwartalnie"
yearly = "Rocznie"

[labels.pl.model.accounting_se_company.field.currency]
label = "Waluta"
description = "Kod waluty ISO 4217 dla ksiąg, zwykle SEK"

[labels.pl.model.accounting_se_company.field.address]
label = "Adres"
description = "Adres siedziby"

[labels.pl.model.accounting_se_company.field.contact_email]
