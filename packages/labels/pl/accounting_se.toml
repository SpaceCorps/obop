description = "Seria dowodów, litera jak A, która grupuje dowody jednego rodzaju"

[labels.pl.model.accounting_se_voucher_series.field.code]
label = "Kod"
description = "Kod serii, od jednej do trzech liter, na przykład A; żadne dwie serie nie mają tego samego kodu"

[labels.pl.model.accounting_se_voucher_series.field.name]
label = "Nazwa"
description = "Co zawiera seria, na przykład Dowody ręczne"

