[labels.pl.module]
name = "Księgowość Szwecja"
description = "Szwedzka lokalizacja księgowości: dane firmy, serie dowodów, kody i pola VAT oraz raport VAT za okres zatwierdzany przez grupę accounting.approver. NIEZWERYFIKOWANE: nic nie sprawdzono w Skatteverket (SKV 4700) ani w SIE. Plan kont BAS nie jest dołączony; konta wybiera użytkownik. Kwoty w öre, stawki w punktach bazowych. Stąd nic nie jest składane."

[labels.pl.model.accounting_se_company]
name = "Firma"
description = "Szwedzka firma, do której należą księgi; zwykle jeden rekord"

[labels.pl.model.accounting_se_company.field.name]
label = "Nazwa"
description = "Pełna nazwa prawna firmy"

[labels.pl.model.accounting_se_company.field.org_number]
label = "Numer organizacji"
description = "Numer organizacji, dziesięć cyfr jak 556000-0000; dla jednoosobowej działalności jest to numer osobisty, a więc dana osobowa"

[labels.pl.model.accounting_se_company.field.vat_number]
label = "Numer VAT"
description = "Numer VAT jak SE556000000001; puste, gdy firma nie jest zarejestrowana jako podatnik VAT"

[labels.pl.model.accounting_se_company.field.f_skatt]
label = "F-skatt"
description = "Czy firma ma zatwierdzony status F-skatt (F-tax)"

[labels.pl.model.accounting_se_company.field.fiscal_year_start_month]
label = "Miesiąc początku roku obrotowego"
