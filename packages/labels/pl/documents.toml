[labels.pl.module]
name = "Dokumenty"
description = "Rejestr dokumentów firmowych: foldery oraz dokumenty z rodzajem, właścicielem, terminem ważności i poufnością, z obiegiem wersja robocza, opublikowany, zarchiwizowany. Przechowuje odwołania, nie pliki. Poufność jest egzekwowana: dokumenty poufne i zastrzeżone widzą tylko właściciel i documents.manager."
summary = "Rejestr dokumentów firmowych z właścicielem, terminem ważności i poufnością oraz obiegiem wersja robocza, opublikowany, zarchiwizowany."

[labels.pl.model.documents_folder]
name = "Folder"
description = "Folder grupujący dokumenty"

[labels.pl.model.documents_folder.field.name]
label = "Nazwa"
description = "Nazwa folderu"

[labels.pl.model.documents_folder.field.parent_id]
label = "Element nadrzędny"
description = "Folder, w którym znajduje się ten folder"

[labels.pl.model.documents_folder.field.description]
label = "Opis"
description = "Co należy do folderu"

[labels.pl.model.documents_document]
name = "Dokument"
description = "Umowa, regulamin, certyfikat lub inny zarejestrowany dokument"

[labels.pl.model.documents_document.field.title]
label = "Tytuł"
description = "Tytuł dokumentu"

[labels.pl.model.documents_document.field.folder_id]
label = "Folder"
description = "Folder, w którym złożono dokument"

[labels.pl.model.documents_document.field.kind]
label = "Rodzaj"
description = "Typ dokumentu: umowa, faktura, regulamin, raport, certyfikat, inne"

[labels.pl.model.documents_document.field.kind.options]
contract = "Umowa"
invoice = "Faktura"
policy = "Regulamin"
report = "Raport"
certificate = "Certyfikat"
other = "Inne"

[labels.pl.model.documents_document.field.confidentiality]
label = "Poufność"
description = "Kto może go widzieć: dokumenty publiczne i wewnętrzne każdy z prawem odczytu dokumentów, poufne i zastrzeżone tylko właściciel i documents.manager"

[labels.pl.model.documents_document.field.confidentiality.options]
public = "Publiczne"
internal = "Wewnętrzne"
confidential = "Poufne"
restricted = "Zastrzeżone"

[labels.pl.model.documents_document.field.owner]
label = "Właściciel"
description = "Nazwa użytkownika osoby odpowiedzialnej za dokument; domyślnie osoba tworząca. Właściciele widzą swoje dokumenty poufne"

[labels.pl.model.documents_document.field.reference]
label = "Referencja"
description = "Numer referencyjny, na przykład numer umowy"

[labels.pl.model.documents_document.field.location]
label = "Lokalizacja"
description = "Miejsce przechowywania pliku, np. link lub pudło archiwalne"

[labels.pl.model.documents_document.field.expires_on]
label = "Data wygaśnięcia"
description = "Data, po której dokument przestaje być ważny (YYYY-MM-DD)"

[labels.pl.model.documents_document.field.summary]
label = "Podsumowanie"
description = "Treść dokumentu w kilku wierszach"

[labels.pl.model.documents_document.field.state]
label = "Status"
description = "Status dokumentu: wersja robocza, opublikowany, zarchiwizowany"

[labels.pl.model.documents_document.field.state.options]
draft = "Wersja robocza"
published = "Opublikowane"
archived = "Zarchiwizowane"

[labels.pl.model.documents_document.action.publish]
label = "Opublikuj"
description = "Czyni dokument roboczy aktualną wersją"

[labels.pl.model.documents_document.action.archive]
label = "Archiwizuj"
description = "Archiwizuje opublikowany dokument (tylko kierownik)"

[labels.pl.model.documents_document.field.open_to_all]
label = "Otwarty dla wszystkich"
description = "Czy każdy z prawem odczytu dokumentów może go zobaczyć: prawda dla dokumentów publicznych i wewnętrznych"
