[labels.fr.module]
name = "Ressources humaines"
description = "Employés, départements et demandes de congé. Les données personnelles sont classées strictement : la paie, la banque et l’identifiant national ne sont visibles que des responsables, et les données de santé et syndicales du groupe de lecture spécial. Un employé ne voit et ne dépose que ses propres demandes de congé ; hr.manager les voit toutes."
summary = "Employés, départements et demandes de congé, avec paie et données de santé réservées aux groupes autorisés."

