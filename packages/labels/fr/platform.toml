[labels.fr.model.device.field.app_version]
label = "Version de l'application"
description = "La version de l'application, telle qu'elle l'a indiquée à la connexion et à chaque renouvellement"

[labels.fr.model.device.field.push_token]
label = "Jeton push"
description = "L'adresse du service push pour cet appareil. N'est montrée à personne et n'est pas écrite dans cette version : le push ne fait pas partie de la première tranche mobile"

[labels.fr.model.device.field.registered_at]
label = "Connecté le"
description = "Quand l'application s'est connectée sur cet appareil"

[labels.fr.model.device.field.last_seen]
label = "Dernière activité"
description = "Quand l'appareil a renouvelé sa connexion pour la dernière fois (l'heure du dernier renouvellement, pas de chaque requête)"

[labels.fr.model.device.field.expires_at]
label = "Expire le"
description = "Quand la connexion de l'appareil prend fin si elle n'est pas renouvelée"

[labels.fr.model.device.field.state]
label = "État"
description = "active tant que l'appareil peut se connecter ; revoked une fois terminé"

[labels.fr.model.device.field.state.options]
active = "Actif"
revoked = "Révoqué"

[labels.fr.model.device.field.revoked_at]
label = "Révoqué le"
description = "Quand l'appareil a été terminé"

[labels.fr.model.device.field.grant]
label = "Famille de connexion"
description = "La famille de jetons d'actualisation à laquelle l'appareil est lié (un identifiant, pas un jeton)"

[labels.fr.model.device.action.revoke]
label = "Révoquer"
description = "Mettre fin à un appareil pour de bon : ses jetons d'actualisation ne fonctionnent plus, son jeton d'accès s'arrête à la prochaine requête et l'application doit se reconnecter. Une personne révoque ses propres appareils ; un agent ne peut que le proposer. Donner id"

[labels.fr.model.user_account.field.oid]
label = "ID d’objet"
description = "Entrée de bind_sso : l’ID d’objet de la personne dans l’annuaire Microsoft, un GUID (ni adresse e-mail ni nom d’utilisateur principal)"

[labels.fr.model.user_account.field.sso_oid]
label = "ID d’objet Microsoft"
description = "L’ID d’objet auquel le compte est lié pour se connecter avec Microsoft ; vide s’il n’est pas lié"

[labels.fr.model.user_account.field.sso_only]
label = "Microsoft uniquement"
description = "Si le compte se connecte uniquement avec Microsoft : il n’a ni mot de passe ni clé d’accès pour se connecter seul. Entrée de set_sso_only (true ou false)"

[labels.fr.model.user_account.action.bind_sso]
label = "Lier à Microsoft"
description = "Lier un compte existant à l’identité Microsoft d’une personne pour qu’elle puisse se connecter avec Microsoft. Donner id et oid (l’ID d’objet de la personne dans l’annuaire, un GUID). Ne crée aucun compte et n’accorde aucune permission"

[labels.fr.model.user_account.action.unbind_sso]
label = "Délier de Microsoft"
description = "Supprimer le lien d’un compte avec une identité Microsoft. Refusé tant que le compte se connecte uniquement avec Microsoft. Donner id"

[labels.fr.model.user_account.action.set_sso_only]
label = "Définir Microsoft uniquement"
description = "Faire se connecter un compte uniquement avec Microsoft (il refuse alors son mot de passe et sa clé d’accès seuls), ou l’annuler. Donner id et sso_only (true ou false). Le compte doit être lié, et au moins deux autres administrateurs doivent continuer à se connecter localement avec un second facteur. Met fin aux sessions du compte"

[labels.fr.model.sso_provider]
name = "Connexion Microsoft"
description = "Le locataire Microsoft Entra avec lequel les personnes se connectent : un seul locataire, fixé par son ID. Modifié uniquement par les administrateurs, jamais par un agent"

[labels.fr.model.sso_provider.field.tenant]
label = "Locataire"
description = "L’ID du locataire (un GUID) auquel toute connexion Microsoft est comparée"

[labels.fr.model.sso_provider.field.client_id]
label = "ID client"
description = "L’ID d’application (client) de l’inscription d’application dans ce locataire"

[labels.fr.model.sso_provider.field.client_secret]
label = "Secret client"
description = "Entrée de configure : le secret client de l’inscription d’application, conservé scellé sous le secret du serveur. Jamais affiché"

[labels.fr.model.sso_provider.field.enabled]
label = "Activé"
description = "Si la page de connexion propose « Se connecter avec Microsoft »"

[labels.fr.model.sso_provider.field.secret_set]
label = "Secret enregistré"
description = "Si un secret client est enregistré"

[labels.fr.model.sso_provider.field.modified_at]
label = "Modifié le"
description = "Quand la configuration a été modifiée pour la dernière fois"

[labels.fr.model.sso_provider.field.last_editor]
label = "Dernier auteur"
description = "Qui l’a modifiée en dernier"

[labels.fr.model.sso_provider.field.break_glass]
label = "Administrateurs de secours"
description = "Les administrateurs qui se connectent localement avec un mot de passe et un second facteur (la voie d’accès quand Microsoft est inaccessible), séparés par des virgules"

[labels.fr.model.sso_provider.field.break_glass_enough]
label = "Assez d’administrateurs de secours"
description = "Si leur nombre suffit (au moins deux) pour qu’un compte se connecte uniquement avec Microsoft"

[labels.fr.model.sso_provider.action.configure]
label = "Configurer"
description = "Définir le locataire Microsoft Entra avec lequel les personnes se connectent. Donner tenant (l’ID du locataire, un GUID ; common, organizations et consumers sont refusés), client_id (l’ID d’application de l’inscription d’application) et, la première fois, client_secret ; enabled vaut true par défaut. Les comptes sont liés avec user_account.bind_sso. Refusé pour les agents"

[labels.fr.model.sso_provider.action.clear]
label = "Supprimer"
description = "Supprimer la configuration de la connexion Microsoft. Les liens restent. Les comptes qui se connectent uniquement avec Microsoft ne peuvent alors entrer que par les administrateurs qui gardent un mot de passe et un second facteur. Refusé pour les agents"

[labels.fr.model.instance_brand]
name = "Marque de l'instance"
description = "L'image de marque de l'instance : le nom, l'identifiant court, le logo, ainsi qu'un titre et un message par langue. Un seul enregistrement, public par conception, modifié uniquement par une personne disposant de platform.admin et jamais par un agent"

[labels.fr.model.instance_brand.field.name]
label = "Nom"
description = "Le nom du produit, de 1 à 40 caractères (lettres, chiffres, espaces et - . , & ' + _ ( ) !). Obligatoire : une marque sans nom n'est pas enregistrée. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.slug]
label = "Identifiant court"
description = "Un identifiant court : a-z, 0-9 et -, commençant par une lettre, ne finissant pas par -, 30 caractères au plus. Vide : dérivé du nom. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.title_en]
label = "Titre (anglais)"
description = "Le titre en anglais : la ligne à côté du logo, 60 caractères au plus. Vide : le nom. C'est aussi le titre de chaque langue qui n'a pas le sien. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.title_de]
label = "Titre (allemand)"
description = "Le titre en allemand : la ligne à côté du logo, 60 caractères au plus. Vide : le titre anglais, puis le nom. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.title_fr]
label = "Titre (français)"
description = "Le titre en français : la ligne à côté du logo, 60 caractères au plus. Vide : le titre anglais, puis le nom. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.title_pl]
label = "Titre (polonais)"
description = "Le titre en polonais : la ligne à côté du logo, 60 caractères au plus. Vide : le titre anglais, puis le nom. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.title_fi]
label = "Titre (finnois)"
description = "Le titre en finnois : la ligne à côté du logo, 60 caractères au plus. Vide : le titre anglais, puis le nom. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.title_sv]
label = "Titre (suédois)"
description = "Le titre en suédois : la ligne à côté du logo, 60 caractères au plus. Vide : le titre anglais, puis le nom. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.title_es]
label = "Titre (espagnol)"
description = "Le titre en espagnol : la ligne à côté du logo, 60 caractères au plus. Vide : le titre anglais, puis le nom. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.message_en]
label = "Message (anglais)"
description = "Le message en anglais : un texte simple de 240 caractères au plus, sans lien ni balisage. Vide : aucun. C'est aussi le message de chaque langue qui n'a pas le sien. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.message_de]
label = "Message (allemand)"
description = "Le message en allemand : un texte simple de 240 caractères au plus, sans lien ni balisage. Vide : le message anglais, puis aucun. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.message_fr]
label = "Message (français)"
description = "Le message en français : un texte simple de 240 caractères au plus, sans lien ni balisage. Vide : le message anglais, puis aucun. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.message_pl]
label = "Message (polonais)"
description = "Le message en polonais : un texte simple de 240 caractères au plus, sans lien ni balisage. Vide : le message anglais, puis aucun. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.message_fi]
label = "Message (finnois)"
description = "Le message en finnois : un texte simple de 240 caractères au plus, sans lien ni balisage. Vide : le message anglais, puis aucun. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.message_sv]
label = "Message (suédois)"
description = "Le message en suédois : un texte simple de 240 caractères au plus, sans lien ni balisage. Vide : le message anglais, puis aucun. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.message_es]
label = "Message (espagnol)"
description = "Le message en espagnol : un texte simple de 240 caractères au plus, sans lien ni balisage. Vide : le message anglais, puis aucun. Public par conception, donc sans données personnelles"

[labels.fr.model.instance_brand.field.logo_svg]
label = "Logo (SVG)"
description = "Entrée de configure : le texte d'un fichier SVG, 16 Kio au plus, un sous-ensemble strict (formes et tracés en couleurs unies ; ni script, ni texte, ni image, ni lien). Ce qui est enregistré est le texte canonique que le serveur a réécrit, jamais l'entrée ; get ne le renvoie pas. Vide : il est effacé et le logo est alors dessiné à partir du nom"

[labels.fr.model.instance_brand.field.dry_run]
label = "Simulation"
description = "Entrée de configure et clear : true ou false. Avec true, tout est vérifié et rien n'est écrit ni journalisé ; la réponse dit ce qui se passerait et renvoie dry_run"

[labels.fr.model.instance_brand.field.set]
label = "Définie"
description = "Réponse de get : si une marque est définie, c'est-à-dire si l'enregistrement existe"

[labels.fr.model.instance_brand.field.v]
label = "Version du logo"
description = "Réponse de get et configure : la version du logo (16 chiffres hexadécimaux), qui change avec le logo ; vide quand aucune marque n'est définie"

[labels.fr.model.instance_brand.field.effective]
label = "En vigueur"
description = "Réponse de get : un objet JSON qui donne, pour chaque valeur en vigueur (name, slug, logo, tile_accent, authenticator_issuer, title_XX et message_XX; XX est le code de la langue : en, de, fr, pl, fi, sv, es), sa valeur et la source retenue : record, env, theme, unreadable ou default"

[labels.fr.model.instance_brand.field.fallbacks]
label = "Valeurs de repli"
description = "Réponse de get : une liste JSON des champs enregistrés qui ont échoué à la vérification de lecture et sont revenus à une valeur par défaut, chacun avec son champ et sa raison"

[labels.fr.model.instance_brand.field.changes]
label = "Modifications"
description = "Réponse de configure : une liste JSON des champs modifiés (avec dry_run, qui le seraient), chacun avec field, old et new ; le logo comme ancienne et nouvelle version"

[labels.fr.model.instance_brand.field.refusals]
label = "Refus"
description = "Réponse de configure avec dry_run : une liste JSON de ce qu'un vrai appel refuserait, chaque refus avec field et rule"

[labels.fr.model.instance_brand.field.cleared]
label = "Supprimée"
description = "Réponse de clear : si une marque a été supprimée (avec dry_run, si elle le serait)"

[labels.fr.model.instance_brand.action.configure]
label = "Configurer"
description = "Définir l'image de marque de l'instance. Ne donnez que les champs à modifier (les autres gardent leur valeur) ; le premier appel exige name. Champs : name, slug, title_XX, message_XX, logo_svg (texte SVG). Un texte vide efface un champ, sauf name. dry_run (true ou false) n'écrit rien. Répond par changes et v (avec dry_run aussi refusals). Seule une personne avec platform.admin peut l'exécuter"

[labels.fr.model.instance_brand.action.clear]
label = "Supprimer"
description = "Supprimer l'image de marque de l'instance : l'unique enregistrement est effacé, aucune marque n'est donc définie. dry_run (true ou false) vérifie sans rien supprimer. Répond par cleared : true quand une marque a été supprimée (avec dry_run, le serait), false sinon, et rien n'est écrit alors. Seule une personne avec platform.admin peut l'exécuter"

[labels.fr.model.import_map]
name = "Table d'import"
description = "D'où vient un enregistrement importé : la clé (système source, table source, identifiant source) de la ligne dont il est issu. Retrouver une clé avec search, un enregistrement avec get."

[labels.fr.model.import_map.field.model]
label = "Modèle"
description = "Le modèle de l'enregistrement importé"

[labels.fr.model.import_map.field.record]
label = "Enregistrement"
description = "L'identifiant de l'enregistrement importé"

[labels.fr.model.import_map.field.source_system]
label = "Système source"
description = "Le système externe d'où vient la ligne, tel que l'import l'a nommé"

[labels.fr.model.import_map.field.source_table]
label = "Table source"
description = "La table, la feuille ou le fichier de ce système d'où vient la ligne"

[labels.fr.model.import_map.field.source_id]
label = "Identifiant source"
description = "L'identifiant de la ligne dans cette table"

[labels.fr.model.import_map.field.imported_at]
label = "Importé le"
description = "Quand l'enregistrement a été importé"

[labels.fr.model.import_map.field.imported_by]
label = "Importé par"
description = "Qui l'a importé"
