[labels.fr.module]
name = "Point de vente"
description = "Caisses de magasin : sessions, commandes avec lignes et paiements. Un remboursement et la clôture de session exigent l’approbation d’un responsable. Totaux calculés, tickets numérotés sans rupture ; le paiement crée des mouvements de stock en brouillon. Les réglages de caisse et de remboursement sont seulement enregistrés ; rien ne les vérifie. Ne stockez aucun numéro de carte. Nécessite Produits."
summary = "Caisses de magasin : sessions, commandes et paiements. Remboursements et clôture exigent une approbation."

[labels.fr.model.pos_config]
name = "Caisse"
plural = "Caisses"
description = "Un point de vente (une caisse ou un magasin) et ses réglages"

[labels.fr.model.pos_config.field.name]
label = "Nom"
description = "Nom de la caisse ou du magasin, par exemple Boutique de la rue principale"

[labels.fr.model.pos_config.field.currency]
label = "Devise"
description = "Code de devise ISO 4217, par exemple EUR"

[labels.fr.model.pos_config.field.receipt_header]
label = "En-tête du ticket"
description = "Texte imprimé en haut des tickets"

[labels.fr.model.pos_config.field.cash_control]
label = "Contrôle de caisse"
description = "Indique si l’argent du tiroir-caisse doit être compté à l’ouverture et à la clôture ; seulement enregistré, rien ne le vérifie"

[labels.fr.model.pos_config.field.default_opening_cash]
label = "Fond de caisse par défaut"
description = "Espèces normalement laissées dans le tiroir pendant la nuit (plus petite unité monétaire)"

[labels.fr.model.pos_config.field.allow_refunds]
label = "Autoriser les remboursements"
description = "Indique si les remboursements doivent être permis à ce point de vente ; seulement enregistré, rien ne le vérifie"

[labels.fr.model.pos_config.field.active]
label = "Actif"
description = "Indique si le point de vente est utilisé"

[labels.fr.model.pos_session]
name = "Session"
plural = "Sessions"
description = "Une période de vente à un point de vente, de l’ouverture à la fermeture du tiroir-caisse"

[labels.fr.model.pos_session.guard]
message = "Une session clôturée ne peut pas être modifiée ; seule sa note peut encore expliquer un écart de caisse."

[labels.fr.model.pos_session.field.config_id]
label = "Configuration"
description = "Le point de vente auquel appartient la session"

[labels.fr.model.pos_session.field.cashier]
label = "Caissier"
description = "Nom du caissier qui a ouvert la session"

[labels.fr.model.pos_session.field.opened_on]
label = "Ouvert le"
description = "Jour d’ouverture de la session (YYYY-MM-DD)"

[labels.fr.model.pos_session.field.closed_on]
label = "Date de clôture"
description = "Jour de clôture de la session (YYYY-MM-DD)"

[labels.fr.model.pos_session.field.opening_cash]
label = "Fond de caisse"
description = "Espèces comptées dans le tiroir à l'ouverture (plus petite unité monétaire) ; à défaut, le montant compté à la dernière fermeture de la caisse, sinon le fonds de caisse habituel"

[labels.fr.model.pos_session.field.expected_cash]
label = "Caisse théorique"
description = "Espèces que le tiroir doit contenir à la clôture : le fonds de caisse plus les paiements en espèces des ventes payées de la session, moins les espèces des ventes de sessions clôturées remboursées pendant celle-ci ; une fois la session clôturée, le montant de sa clôture"

[labels.fr.model.pos_session.field.closing_cash]
label = "Caisse à la clôture"
description = "Espèces réellement comptées dans le tiroir à la clôture"

[labels.fr.model.pos_session.field.cash_difference]
label = "Écart de caisse"
description = "Espèces de fermeture moins espèces attendues, une fois les espèces de fermeture comptées ; négatif signifie qu'il manque de l'argent"

[labels.fr.model.pos_session.field.note]
label = "Note"
description = "Explication d’un éventuel écart de caisse"

[labels.fr.model.pos_session.field.state]
label = "Statut"
description = "Statut de la session : ouverte, clôturée"

[labels.fr.model.pos_session.field.state.options]
open = "Ouverte"
closed = "Clôturée"

[labels.fr.model.pos_session.action.close]
label = "Clôturer"
description = "Clôture la session une fois le tiroir compté (responsable uniquement)"
confirm = "Fermer cette session ? Comptez d'abord l'argent du tiroir ; une session fermée ne peut plus être modifiée."
done = "Session fermée"

[labels.fr.model.pos_session.action.close.assert.difference_explained]
message = "L'écart de caisse n'est pas expliqué : indiquez-en la raison dans la note avant de clôturer"

[labels.fr.model.pos_order]
name = "Vente"
plural = "Ventes"
description = "Une vente enregistrée à un point de vente"

[labels.fr.model.pos_order.guard]
message = "Une vente payée, remboursée ou annulée ne peut pas être modifiée. Remboursez-la pour l’annuler."

[labels.fr.model.pos_order.field.session_id]
label = "Session"
description = "La session pendant laquelle la vente a été faite"

[labels.fr.model.pos_order.field.receipt_number]
label = "Numéro de ticket"
description = "Numéro imprimé sur le ticket, tel que R-2026-000042 : une série sans rupture qui repart chaque année, attribuée à la création de la vente"

[labels.fr.model.pos_order.field.ordered_on]
label = "Commandé le"
description = "Jour de la vente (YYYY-MM-DD)"

[labels.fr.model.pos_order.field.customer_id]
label = "Client"
description = "Le client, lorsqu’il a été identifié"

[labels.fr.model.pos_order.field.tax_total]
label = "Total des taxes"
description = "Taxes comprises dans le total (plus petite unité monétaire)"

[labels.fr.model.pos_order.field.total]
label = "Total"
description = "Total payé par le client, taxes comprises : somme des sous-totaux des lignes (plus petite unité monétaire)"

[labels.fr.model.pos_order.field.note]
label = "Note"
description = "Remarque sur la vente"

[labels.fr.model.pos_order.field.state]
label = "Statut"
description = "Statut de la vente : brouillon, payée, remboursée, annulée"

[labels.fr.model.pos_order.field.state.options]
draft = "Brouillon"
paid = "Payée"
refunded = "Remboursée"
cancelled = "Annulée"

[labels.fr.model.pos_order.action.pay]
label = "Payer"
description = "La vente est entièrement payée : refusé tant que les paiements ne couvrent pas le total ; crée un mouvement de stock en brouillon par ligne (exige le groupe inventory.user)"
done = "Vente payée"

[labels.fr.model.pos_order.action.cancel]
label = "Annuler"
description = "Annule une vente qui n’a jamais été payée"
confirm = "Annuler cette vente ? Elle garde son numéro de ticket et ne pourra plus être modifiée ensuite."

[labels.fr.model.pos_order.action.refund]
label = "Rembourser"
description = "Rembourse une vente payée au client (responsable uniquement)"
confirm = "Rembourser cette vente au client ?"
done = "Vente remboursée"

[labels.fr.model.pos_order_line]
name = "Ligne de vente"
plural = "Lignes de vente"
description = "Une ligne de produit d’une vente"

[labels.fr.model.pos_order_line.guard]
message = "Les lignes d’une vente payée, remboursée ou annulée ne peuvent pas être modifiées."

[labels.fr.model.pos_order_line.field.order_id]
label = "Commande"
description = "La vente à laquelle appartient la ligne"

[labels.fr.model.pos_order_line.field.product_id]
label = "Produit"
description = "Le produit vendu"

[labels.fr.model.pos_order_line.field.description]
label = "Description"
description = "Texte affiché sur le ticket"

[labels.fr.model.pos_order_line.field.quantity]
label = "Quantité"
description = "Unités vendues"

[labels.fr.model.pos_order_line.field.unit_price]
label = "Prix unitaire"
description = "Prix par unité toutes taxes comprises (plus petite unité monétaire)"

[labels.fr.model.pos_order_line.field.discount_bp]
label = "Remise (pb)"
description = "Remise en points de base : 1000 correspond à 10,00 %"

[labels.fr.model.pos_order_line.field.subtotal]
label = "Sous-total"
description = "Total de la ligne après remise : quantité multipliée par le prix unitaire, moins la remise (plus petite unité monétaire)"

[labels.fr.model.pos_payment]
name = "Paiement"
plural = "Paiements"
description = "Un paiement reçu pour une vente ; une vente peut être réglée avec plusieurs modes de paiement"

[labels.fr.model.pos_payment.guard]
message = "Les paiements d’une vente payée, remboursée ou annulée ne peuvent pas être modifiés."

[labels.fr.model.pos_payment.field.order_id]
label = "Commande"
description = "La vente concernée par le paiement"

[labels.fr.model.pos_payment.field.method]
label = "Méthode"
description = "Mode de paiement du client : espèces, carte, virement bancaire, bon d’achat, autre"

[labels.fr.model.pos_payment.field.method.options]
cash = "Espèces"
card = "Carte"
bank_transfer = "Virement bancaire"
voucher = "Bon d’achat"
other = "Autre"

[labels.fr.model.pos_payment.field.amount]
label = "Montant"
description = "Montant payé avec ce mode de paiement (plus petite unité monétaire)"

[labels.fr.model.pos_payment.field.paid_on]
label = "Payé le"
description = "Jour du paiement (YYYY-MM-DD)"

[labels.fr.model.pos_payment.field.provider_reference]
label = "Référence du prestataire"
description = "Référence du terminal de paiement ou du prestataire de paiement ; jamais un numéro de carte"

[labels.fr.model.pos_order.field.stock_location_id]
label = "Emplacement de stock"
description = "D'où les marchandises sortent du stock ; le paiement crée les mouvements de stock depuis cet emplacement ; à défaut, l'emplacement de la session"

[labels.fr.model.pos_order.action.pay.assert.covered]
message = "Les paiements ne couvrent pas le total de la vente : ajoutez un paiement pour le reste"

[labels.fr.model.pos_config.field.stock_location_id]
label = "Emplacement de stock"
description = "D'où sortent du stock les marchandises vendues à cette caisse ; ses sessions et ses ventes le reprennent, et le paiement d'une vente crée alors les mouvements de stock"

[labels.fr.model.pos_session.field.closed_expected_cash]
label = "Caisse théorique à la fermeture"
description = "La caisse théorique au moment de la fermeture, conservée par l'action Fermer ; la caisse théorique et l'écart de caisse d'une session fermée en sont lus"

[labels.fr.model.pos_session.field.closed_at]
label = "Fermée le"
description = "Moment de la fermeture de la session (UTC) ; la dernière session fermée d'une caisse propose le prochain fonds d'ouverture"

[labels.fr.model.pos_session.field.stock_location_id]
label = "Emplacement de stock"
description = "D'où sortent du stock les marchandises vendues pendant cette session ; à défaut, l'emplacement de la caisse"

[labels.fr.model.pos_order.field.cash_paid]
label = "Payé en espèces"
description = "La part des paiements faite en espèces (plus petite unité monétaire)"

[labels.fr.model.pos_order.field.refund_session_id]
label = "Remboursée dans la session"
description = "La session dont le tiroir a versé l’espèce d’un remboursement, fixée par le serveur quand une vente d’une session clôturée est remboursée : la session alors ouverte à la caisse de la vente ; vide si la session de la vente était encore ouverte"

[labels.fr.model.pos_session.section.cash_count]
label = "Comptage de caisse"

[labels.fr.model.pos_session.filter.open]
label = "Ouvertes"
