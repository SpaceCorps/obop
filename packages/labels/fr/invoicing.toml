[labels.fr.module]
name = "Facturation"
summary = "Factures clients avec un cycle de vie brouillon, comptabilisée et annulée."

[labels.fr.model.invoice]
name = "Facture"
description = "Une facture client ; aucune action ne remet une facture comptabilisée en brouillon ni ne l’annule"

[labels.fr.model.invoice.field.sale_order_id]
label = "Commande client"
description = "Identifiant de la commande client d’origine"

[labels.fr.model.invoice.field.state]
label = "Statut"
description = "Cycle de vie : brouillon, comptabilisée ou annulée"

[labels.fr.model.invoice.field.state.options]
draft = "Brouillon"
posted = "Comptabilisée"
cancelled = "Annulée"

[labels.fr.model.invoice.field.total_minor]
label = "Total"
description = "Total de la facture en plus petite unité monétaire, somme des lignes"

[labels.fr.model.invoice.field.number]
label = "Numéro"
description = "Numéro d’une série annuelle sans rupture, par exemple INV-2026-00042, attribué à la comptabilisation"

[labels.fr.model.invoice.field.issue_date]
label = "Date d’émission"
description = "Date à laquelle la facture est émise (YYYY-MM-DD)"

[labels.fr.model.invoice.field.due_date]
label = "Date d’échéance"
description = "Date à laquelle le paiement est dû (YYYY-MM-DD) ; pas avant la date d’émission"

[labels.fr.model.invoice.action.post]
label = "Comptabiliser"
description = "Comptabilise une facture en brouillon et lui attribue le numéro suivant de la série"

[labels.fr.model.invoice.action.cancel]
label = "Annuler"
description = "Annule une facture en brouillon"

[labels.fr.model.invoice.field.party_id]
label = "Tiers"
description = "Identifiant du tiers client"

[labels.fr.model.invoice.field.currency]
label = "Devise"
description = "Code de devise ISO 4217"

[labels.fr.model.invoice_line]
name = "Ligne de facture"
description = "Un produit ou un service d’une facture"

[labels.fr.model.invoice_line.field.invoice_id]
label = "Facture"
description = "La facture à laquelle appartient la ligne"

[labels.fr.model.invoice_line.field.product_id]
label = "Produit"
description = "Le produit facturé"

[labels.fr.model.invoice_line.field.description]
label = "Description"
description = "Ce qui est facturé"

[labels.fr.model.invoice_line.field.quantity]
label = "Quantité"
description = "Quantité facturée"

[labels.fr.model.invoice_line.field.unit_price_minor]
label = "Prix unitaire"
description = "Prix d’une unité en plus petite unité monétaire"

[labels.fr.model.invoice_line.field.amount_minor]
label = "Montant"
description = "Montant de la ligne en plus petite unité monétaire : quantité multipliée par le prix unitaire"
