# Machine-drafted labels of the built-in Mail module (docs/spec/mail.md).

[labels.fr.module]
name = "E-mail"
description = "E-mails sortants : serveurs de messagerie (relais SMTP et API de fournisseurs via les Connecteurs), modèles en sept langues, une file d’attente avec nouvelles tentatives et un journal des envois qui ne montre jamais le texte."
summary = "Envoyer des e-mails via votre propre relais SMTP ou un fournisseur, avec modèles et journal des envois."

