[labels.fr.model.website_form_submission.action.handle]
label = "Traiter"
description = "Marque le message comme répondu ou traité"

[labels.fr.model.website_form_submission.action.mark_spam]
label = "Marquer spam"
description = "Marque le message comme spam"

