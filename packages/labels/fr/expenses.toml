[labels.fr.module]
name = "Notes de frais"
description = "Notes de frais : brouillon, soumise, approuvée, payée. Le paiement est une permission distincte. Approuver, refuser ou payer exige une approbation humaine ; les agents proposent seulement. Justificatif en photo ou scan ; une demande approuvée, payée ou refusée est figée. Numéro annuel ; un employé ne voit et ne modifie que ses demandes ; responsables et finance les voient toutes."
summary = "Notes de frais des employés avec un flux brouillon, soumise, approuvée et payée."

[labels.fr.model.expenses_expense]
name = "Dépense"
plural = "Dépenses"
description = "Un montant qu’un employé a dépensé pour l’entreprise et dont il demande le remboursement"

[labels.fr.model.expenses_expense.guard]
message = "Une note de frais approuvée, payée ou refusée ne peut pas être modifiée, sauf son justificatif et les détails du paiement."

[labels.fr.model.expenses_expense.field.description]
label = "Description"
description = "Ce pour quoi l’argent a été dépensé"

[labels.fr.model.expenses_expense.field.employee]
label = "Employé"
description = "Nom d’utilisateur de la personne qui demande le remboursement ; par défaut la personne qui crée la demande"

[labels.fr.model.expenses_expense.field.submitted_by]
label = "Soumise par"
description = "Nom d’utilisateur de la personne qui a soumis la note, enregistré par l’action Soumettre ; elle ne peut pas non plus l’approuver, sauf si l’auto-approbation est autorisée"

[labels.fr.model.expenses_expense.field.spent_on]
label = "Date de la dépense"
description = "Date de l’achat (YYYY-MM-DD)"

[labels.fr.model.expenses_expense.field.category]
label = "Catégorie"
description = "Catégorie de dépense : déplacement, repas, hébergement, fournitures, logiciel, autre"

[labels.fr.model.expenses_expense.field.category.options]
travel = "Déplacement"
meals = "Repas"
lodging = "Hébergement"
supplies = "Fournitures"
software = "Logiciel"
other = "Autre"

[labels.fr.model.expenses_expense.field.amount]
label = "Montant"
description = "Montant dû à l’employé (plus petite unité monétaire, par exemple en centimes)"

[labels.fr.model.expenses_expense.field.currency]
label = "Devise"
description = "Code de devise ISO 4217, par exemple EUR"

[labels.fr.model.expenses_expense.field.receipt_note]
label = "Note du justificatif"
description = "Où le justificatif est conservé et ce qu’il montre"

[labels.fr.model.expenses_expense.field.paid_on]
label = "Payé le"
description = "Date à laquelle l’employé a été remboursé (YYYY-MM-DD)"

[labels.fr.model.expenses_expense.field.payment_reference]
label = "Référence de paiement"
description = "Référence du virement bancaire du remboursement"

[labels.fr.model.expenses_expense.field.state]
label = "Statut"
description = "Statut de la demande : brouillon, soumise, approuvée, payée, refusée"

[labels.fr.model.expenses_expense.field.state.options]
draft = "Brouillon"
submitted = "Soumise"
approved = "Approuvée"
paid = "Payée"
refused = "Refusée"

[labels.fr.model.expenses_expense.action.submit]
label = "Soumettre"
description = "Soumet la demande pour approbation"
done = "Soumis pour approbation"

[labels.fr.model.expenses_expense.action.approve]
label = "Approuver"
description = "Approuve une demande soumise (responsable uniquement)"
done = "Note de frais approuvée"

[labels.fr.model.expenses_expense.action.pay]
label = "Payer"
description = "Enregistre le remboursement comme payé (service financier uniquement) ; la date de paiement est aujourd’hui si aucune n’est indiquée"
confirm = "Enregistrer cette note de frais comme payée ?"
done = "Note de frais marquée payée"

[labels.fr.model.expenses_expense.action.refuse]
label = "Refuser"
description = "Refuse une demande soumise (responsable uniquement)"
confirm = "Refuser cette note de frais ? Une note refusée ne peut plus être modifiée."
done = "Note de frais refusée"

[labels.fr.model.expenses_expense.field.number]
label = "Numéro"
description = "Numéro de demande tel que EXP-2026-0042, attribué à la création ; la série repart chaque année"

[labels.fr.model.expenses_expense.field.receipt]
description = "Photo ou scan du justificatif (PDF ou image) ; téléchargeable uniquement par les personnes qui peuvent lire la demande"
label = "Justificatif"

[labels.fr.model.expenses_expense.section.expense]
label = "Dépense"

[labels.fr.model.expenses_expense.section.notes]
label = "Notes"

[labels.fr.model.expenses_expense.section.claimed_by]
label = "Demandé par"

[labels.fr.model.expenses_expense.section.payment]
label = "Paiement"
