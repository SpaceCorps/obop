[labels.fr.module]
name = "Documents"
description = "Un registre des documents de l’entreprise : dossiers, documents avec type, propriétaire, expiration et confidentialité, et un flux brouillon, publié, archivé. Il stocke des références, pas le contenu des fichiers. Les documents confidentiels et restreints ne sont visibles que du propriétaire et de documents.manager, les autres de tous les lecteurs."
summary = "Un registre des documents de l’entreprise avec propriétaire, expiration et confidentialité, et un flux brouillon, publié, archivé."

[labels.fr.model.documents_folder]
name = "Dossier"
description = "Un dossier qui regroupe des documents"

[labels.fr.model.documents_folder.field.name]
label = "Nom"
description = "Nom du dossier"

[labels.fr.model.documents_folder.field.parent_id]
label = "Parent"
description = "Le dossier dans lequel celui-ci se trouve"

[labels.fr.model.documents_folder.field.description]
label = "Description"
description = "Ce qui a sa place dans le dossier"

[labels.fr.model.documents_document]
name = "Document"
description = "Un contrat, une politique, un certificat ou un autre document enregistré"

[labels.fr.model.documents_document.field.title]
label = "Titre"
description = "Titre du document"

[labels.fr.model.documents_document.field.folder_id]
label = "Dossier"
description = "Le dossier dans lequel le document est classé"

[labels.fr.model.documents_document.field.kind]
label = "Type"
description = "Type de document : contrat, facture, politique, rapport, certificat, autre"

[labels.fr.model.documents_document.field.kind.options]
contract = "Contrat"
invoice = "Facture"
policy = "Politique"
report = "Rapport"
certificate = "Certificat"
other = "Autre"

[labels.fr.model.documents_document.field.confidentiality]
label = "Confidentialité"
description = "Qui peut le voir : les documents publics et internes, toute personne autorisée à lire les documents ; les confidentiels et restreints, seulement le propriétaire et documents.manager"

[labels.fr.model.documents_document.field.confidentiality.options]
public = "Public"
internal = "Interne"
confidential = "Confidentiel"
restricted = "Restreint"

[labels.fr.model.documents_document.field.owner]
label = "Propriétaire"
description = "Nom d’utilisateur de la personne responsable du document ; par défaut la personne qui le crée. Les propriétaires voient leurs documents confidentiels"

[labels.fr.model.documents_document.field.reference]
label = "Référence"
description = "Numéro de référence, par exemple un numéro de contrat"

[labels.fr.model.documents_document.field.location]
label = "Emplacement"
description = "Où le fichier est conservé, par exemple un lien ou une boîte d’archive"

[labels.fr.model.documents_document.field.expires_on]
label = "Expire le"
description = "Date après laquelle le document n’est plus valable (YYYY-MM-DD)"

[labels.fr.model.documents_document.field.summary]
label = "Résumé"
description = "Ce que dit le document, en quelques lignes"

[labels.fr.model.documents_document.field.state]
label = "Statut"
description = "Statut du document : brouillon, publié, archivé"

[labels.fr.model.documents_document.field.state.options]
draft = "Brouillon"
published = "Publié"
archived = "Archivé"

[labels.fr.model.documents_document.action.publish]
label = "Publier"
description = "Fait d’un document en brouillon la version en vigueur"

[labels.fr.model.documents_document.action.archive]
label = "Archiver"
description = "Archive un document publié (responsable uniquement)"

[labels.fr.model.documents_document.field.attachment]
label = "Fichier"
description = "Le fichier du document lui-même (PDF, image, texte, tableur ou document bureautique, jusqu'à 25 Mio) ; fourni uniquement en téléchargement aux personnes autorisées à lire l'enregistrement"

[labels.fr.model.documents_document.field.open_to_all]
label = "Visible par tous"
description = "Indique si toute personne autorisée à lire les documents peut voir celui-ci : vrai pour les documents publics et internes"
