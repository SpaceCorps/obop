[labels.fr.module]
name = "eCommerce"
description = "Une boutique en ligne : catégories, offres avec images et traductions, livraison, codes de réduction, taux de taxe et commandes web. Le serveur décompte le stock, applique réductions et taxes et calcule chaque prix lui-même. Paiement par virement, carte (Stripe Checkout) ou mode démo. Remboursements : un responsable. Données clients jamais publiques. Nécessite le package Produits."

