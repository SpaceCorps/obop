[labels.fr.module]
name = "Signature"
description = "Modèles de documents et demandes de signature. Une demande peut pointer vers un PDF de Documents : l'envoi en garde une copie exacte, et un responsable crée un lien à usage unique que le signataire ouvre sans compte pour lire, saisir son nom complet et approuver. Simple signature électronique : le lien est la seule vérification. Les agents ne créent pas de liens."
summary = "Modèles de documents et demandes de signature ; un PDF de Documents se signe via un lien à usage unique. Signature électronique simple."

[labels.fr.model.sign_template]
name = "Modèle"
description = "Un document qui peut être envoyé pour signature"

[labels.fr.model.sign_template.field.name]
label = "Nom"
description = "Nom du modèle, par exemple Contrat de travail"

[labels.fr.model.sign_template.field.description]
label = "Description"
description = "À quoi sert le document et qui le signe"

[labels.fr.model.sign_template.field.body]
label = "Contenu"
description = "Le texte du document, ou une référence indiquant où le fichier est conservé"

[labels.fr.model.sign_template.field.signer_role]
label = "Rôle du signataire"
description = "Rôle de la personne qui signe, par exemple Client"

[labels.fr.model.sign_template.field.active]
label = "Actif"
description = "Indique si de nouvelles demandes peuvent utiliser le modèle"

[labels.fr.model.sign_request]
name = "Demande"
description = "Une demande faite à une personne de signer un document"

[labels.fr.model.sign_request.field.template_id]
label = "Modèle"
description = "Le modèle de document à envoyer ; vide pour une demande portant sur un document de Documents"

[labels.fr.model.sign_request.field.document_id]
label = "Document à signer"
description = "Le PDF de Documents que le signataire lit et signe ; l'envoi de la demande en prend l'empreinte SHA-256 et en garde une copie exacte"

[labels.fr.model.sign_request.field.title]
label = "Titre"
description = "Objet affiché au signataire"

[labels.fr.model.sign_request.field.message]
label = "Message"
description = "Message affiché au signataire dans la demande"

[labels.fr.model.sign_request.field.signer_name]
label = "Nom du signataire"
description = "Nom de la personne qui doit signer"

[labels.fr.model.sign_request.field.signer_email]
label = "E-mail du signataire"
description = "Adresse e-mail du signataire ; facultative, obop n'envoie pas d'e-mail pour une demande portant sur un document"

[labels.fr.model.sign_request.field.sent_on]
label = "Envoyé le"
description = "Jour d’envoi de la demande (YYYY-MM-DD)"

[labels.fr.model.sign_request.field.expires_on]
label = "Expire le"
description = "Dernier jour où la demande peut être signée (YYYY-MM-DD)"

[labels.fr.model.sign_request.field.signed_on]
label = "Signé le"
description = "Jour où le document a été signé (YYYY-MM-DD)"

[labels.fr.model.sign_request.field.signer_ip]
label = "IP du signataire"
description = "Adresse d'où venait la signature, telle que la chaîne de proxys la rapporte (preuve)"

[labels.fr.model.sign_request.field.signer_user_agent]
label = "Agent utilisateur du signataire"
description = "Navigateur avec lequel la signature a été faite (preuve)"

[labels.fr.model.sign_request.field.signature_reference]
label = "Référence de signature"
description = "Où la signature est conservée ; typed:NOM pour un nom saisi via un lien"

[labels.fr.model.sign_request.field.document_hash]
label = "Empreinte du document"
description = "Empreinte SHA-256 (hex) du fichier envoyé pour signature ; définie à l'envoi d'une demande portant sur un document. L'enregistrement n'est pas inviolable : un administrateur ou quiconque peut écrire dans la base peut la modifier"

[labels.fr.model.sign_request.field.document_file]
label = "Copie conservée"
description = "La copie exacte du PDF envoyé pour signature, conservée pour que le remplacement du fichier dans Documents ne puisse pas changer ce qui a été signé ; personne ne détient le groupe, seul un administrateur la lit"

[labels.fr.model.sign_request.field.signed_at]
label = "Date et heure de signature"
description = "Quand le signataire a signé via le lien (UTC, horloge du serveur)"

[labels.fr.model.sign_request.field.signed_name]
label = "Nom saisi"
description = "Le nom complet saisi par le signataire (preuve) ; signer_name reste le nom demandé"

[labels.fr.model.sign_request.field.consent_version]
label = "Version du consentement"
description = "Version et langue du texte de consentement vu par le signataire, par exemple v1-draft/fr"

[labels.fr.model.sign_request.field.state]
label = "Statut"
description = "Statut de la demande : brouillon, envoyée, signée, déclinée, expirée"

[labels.fr.model.sign_request.field.state.options]
draft = "Brouillon"
sent = "Envoyée"
signed = "Signée"
declined = "Déclinée"
expired = "Expirée"

[labels.fr.model.sign_request.action.send]
label = "Envoyer"
description = "Envoie la demande au signataire"

[labels.fr.model.sign_request.action.sign]
label = "Signer"
description = "Enregistre à la main que le signataire a signé ; seulement pour une demande sans document, car une demande portant sur un document est signée par le signataire au moyen du lien"

[labels.fr.model.sign_request.action.sign.assert.document_request]
message = "Une demande portant sur un document est signée par le signataire au moyen du lien ; elle ne peut pas être marquée signée à la main"

[labels.fr.model.sign_request.action.decline]
label = "Décliner"
description = "Enregistre que le signataire a décliné"

[labels.fr.model.sign_request.action.expire]
label = "Marquer expiré"
description = "Enregistre que la demande est arrivée à échéance sans signature"

[labels.fr.model.sign_request.action.send_document]
label = "Envoyer le document"
description = "Envoyer une demande portant sur un document de Documents : prend l'empreinte SHA-256 du PDF, en garde une copie exacte et passe la demande à envoyée ; créez ensuite le lien de signature"

[labels.fr.model.sign_link]
name = "Lien de signature"
description = "Un lien à usage unique qui permet à une personne de signer une demande ; seule une empreinte du secret est conservée, le lien n'est donc affiché qu'une fois à sa création"

[labels.fr.model.sign_link.field.request_id]
label = "Demande"
description = "La demande de signature que ce lien ouvre"

[labels.fr.model.sign_link.field.expires_at]
label = "Valable jusqu'au"
description = "Quand le lien cesse de fonctionner (UTC) ; au plus 14 jours après sa création et jamais après le dernier jour de la demande"

[labels.fr.model.sign_link.field.used_at]
label = "Utilisé le"
description = "Quand le lien a servi à signer (UTC) ; un lien ne fonctionne qu'une fois"

[labels.fr.model.sign_link.field.revoked_at]
label = "Révoqué le"
description = "Quand le lien a été révoqué (UTC) ; renseignez-le pour révoquer le lien"

[labels.fr.model.sign_link.field.link]
label = "Lien"
description = "Le lien lui-même : uniquement dans la réponse de create, affiché une fois, jamais conservé et jamais renvoyé par get, list ou search"
