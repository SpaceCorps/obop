[module]
id = "pos"
version = "0.7.3"
name = "Point of Sale"
description = "Shop tills: a point-of-sale configuration, sessions that are opened and closed, orders with lines, and payment lines per method. A refund and the closing of a session need a human approval from a manager; agents may only propose them. Line subtotals and the order total are computed from the lines, receipts get a gapless yearly number, and paying is refused until the payments cover the total; change is still entered; the expected cash and the cash difference of a session are computed from its paid sales, and the cash control and refund settings of a point of sale are only recorded: nothing checks them. Paying also creates a draft stock move per line from the stock location of the till, for the warehouse to validate. A new session proposes the cash counted when the till last closed. Card numbers must never be stored; keep only the payment provider's reference. Needs the Products package."
author = "SpaceCorps"
summary = "Shop tills: sessions, orders with lines and payments. Refunds and closing need approval."
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["pos", "retail", "till"]
categories = ["sales"]
maturity = "experimental"
requires_core = "^0.2.2"
changelog = "0.7.3: the quick filters of the lists are translated into German, French, Polish, Finnish, Swedish and Spanish (machine-drafted). 0.7.2: a refund writes the session whose drawer pays it out (Refunded in session) together with the refund, in one write, instead of just after it. 0.7.1: form sections, the questions before an action and the notes after it are translated into German, French, Polish, Finnish, Swedish and Spanish (machine-drafted). 0.7.0: a cash sale refunded after its session closed is paid out of the session open at its till then, and that session expects that much less cash (Refunded in session); with no session open at the till such a refund is refused. 0.6.0: A till has a stock location, and its sessions and sales take it, so a paid sale moves stock. The expected cash of a session is computed on the server (opening cash plus the cash payments of its paid sales) and so is the cash difference once the closing cash is counted; closing keeps the expected cash, so refunding one of its sales later does not change a closed session (the expected cash entered by earlier versions is kept the same way). A new session opens with the cash counted when its till last closed (the till's usual opening cash when it never closed), and closing stamps the closing instant. The app opens on Sessions; a till is called a till and sits under Configuration. A new session starts today, for you, with the till's opening cash; a new sale goes to the one open session, dated today; a line takes the product's name and price. Closing a session stamps the closing day. A paid, refunded or cancelled sale, its lines and its payments can no longer be changed, and neither can a closed session except its note. A session whose counted cash differs from the expected cash closes only with a note that explains the difference."
home = "pos_session"

[module.dependencies]
base = "^0.2"
product = "^0.2"
inventory = ">=0.3, <1"

[[model]]
name = "pos_config"
description = "A point of sale (a till or a shop) and its settings"
read_group = "pos.user"
write_group = "pos.manager"

  [model.ui]
  title = "{name}"
  list = ["name", "currency", "default_opening_cash", "cash_control", "allow_refunds", "active"]
  order = "name asc"
  default_view = "list"
  menu = "configuration"

  [[model.field]]
  name = "name"
  description = "Name of the till or shop, for example Main street shop"
  class = "none"
  required = true

  [[model.field]]
  name = "currency"
  description = "ISO 4217 currency code, for example EUR; the instance currency unless given"
  class = "none"
  default = "$instance.currency"

  [[model.field]]
  name = "receipt_header"
  description = "Text printed at the top of receipts"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "cash_control"
  description = "Whether the cash in the drawer is meant to be counted at opening and closing; recorded only, nothing checks it"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "default_opening_cash"
  description = "Cash normally left in the drawer overnight (minor currency units)"
  class = "none"
  kind = "money"
  [model.field.ui]
  aggregate = "none"

  [[model.field]]
  name = "stock_location_id"
  description = "Where the goods sold at this till leave stock; its sessions and sales take it, and paying a sale then creates the stock moves"
  class = "none"
  kind = "ref"
  to = "inventory_location"

  [[model.field]]
  name = "allow_refunds"
  description = "Whether refunds are meant to be allowed at this point of sale; recorded only, nothing checks it"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "active"
  description = "Whether the point of sale is in use"
  class = "none"
  kind = "bool"
  default = true

[[model]]
name = "pos_session"
description = "One shift of selling at a point of sale, from opening to closing the cash drawer"
read_group = "pos.user"
write_group = "pos.user"

  [model.ui]
  title = "{config_id} · {opened_on}"
  subtitle = "{cashier}"
  list = ["config_id", "cashier", "opened_on", "closed_on", "opening_cash", "closing_cash", "cash_difference", "state"]
  card = ["config_id", "cashier", "opened_on", "opening_cash"]
  quick_create = ["config_id"]
  order = "opened_on desc"
  default_view = "list"
  menu = "main"
  menu_order = 1

  [[model.ui.section]]
  label = "Cash count"
  fields = ["opening_cash", "expected_cash", "closing_cash", "cash_difference", "note"]

  [[model.ui.filter]]
  label = "Open"
  where = "state = open"

  [[model.child]]
  model = "pos_order"
  via = "session_id"
  shape = "list"

  [model.guard]
  immutable_when = ["closed"]
  mutable_fields = ["note"]
  message = "A closed session cannot be changed; only its note can still explain a cash difference."

  [[model.field]]
  name = "config_id"
  description = "The point of sale the session belongs to"
  class = "none"
  kind = "ref"
  to = "pos_config"
  required = true

  [[model.field]]
  name = "cashier"
  description = "Name of the cashier who opened the session; the person who opens it unless given"
  class = "internal"
  personal_data = true
  required = true
  default = "$user"

  [[model.field]]
  name = "opened_on"
  description = "Day the session was opened (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  required = true
  default = "today"

  [[model.field]]
  name = "closed_on"
  description = "Day the session was closed (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  readonly = true

  [[model.field]]
  name = "opening_cash"
  description = "Cash counted in the drawer at opening (minor currency units); unless given, the cash counted when the till last closed, else the till's usual opening cash"
  class = "financial"
  kind = "money"
  required = true
  fill_from = "config_id.default_opening_cash"
  [model.field.ui]
  aggregate = "none"

  [[model.field]]
  name = "expected_cash"
  description = "Cash the drawer should hold at closing: the opening cash plus the cash payments of the session's paid sales, minus the cash of sales of closed sessions refunded in it; once the session is closed, the figure it closed with, so a later refund does not change it"
  class = "financial"
  kind = "money"
  computed = 'if(state == "closed" && is_set(closed_expected_cash), closed_expected_cash, opening_cash + sum(pos_order[session_id].cash_paid where state == "paid") - sum(pos_order[refund_session_id].cash_paid where state == "refunded"))'
  [model.field.ui]
  aggregate = "none"

  [[model.field]]
  name = "closed_expected_cash"
  description = "The expected cash as it was when the session closed, kept by the close action; the expected cash and the cash difference of a closed session are read from it"
  class = "financial"
  kind = "money"
  readonly = true
  [model.field.ui]
  aggregate = "none"

  [[model.field]]
  name = "closing_cash"
  description = "Cash actually counted in the drawer at closing"
  class = "financial"
  kind = "money"
  [model.field.ui]
  aggregate = "none"

  [[model.field]]
  name = "cash_difference"
  description = "Closing cash minus expected cash once the closing cash is counted; negative means money is missing"
  class = "financial"
  kind = "money"
  computed = "if(is_set(closing_cash), closing_cash - expected_cash, 0)"

  [[model.field]]
  name = "closed_at"
  description = "When the session was closed (UTC); the latest closed session of a till proposes the next opening cash"
  class = "none"
  kind = "datetime"
  readonly = true

  [[model.field]]
  name = "stock_location_id"
  description = "Where the goods sold in this session leave stock; the till's stock location unless given"
  class = "none"
  kind = "ref"
  to = "inventory_location"
  fill_from = "config_id.stock_location_id"

  [[model.field]]
  name = "note"
  description = "Explanation for any cash difference"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Session status: open, closed"
  class = "none"
  kind = "select"
  options = ["open", "closed"]
  required = true
  [model.field.ui]
  tones = { open = "ok", closed = "neutral" }

  [[model.action]]
  name = "close"
  description = "Close the session once the drawer is counted (manager only)"
  field = "state"
  from = "open"
  to = "closed"
  group = "pos.manager"
  approval = true
  assert = [{ expr = "cash_difference == 0 || is_set(note)", message = "The cash difference is not explained: give the reason in the note before closing", key = "difference_explained" }]
  [model.action.ui]
  primary = true
  confirm = "Close this session? Count the cash in the drawer first; a closed session cannot be changed."
  done = "Session closed"

    [[model.action.effect]]
    kind = "set"
    set = { closed_on = "$today" }
    when = "!is_set(closed_on)"

    [[model.action.effect]]
    kind = "set"
    set = { closed_at = "$now" }

    [[model.action.effect]]
    kind = "set"
    set = { closed_expected_cash = "$null" }

    [[model.action.effect]]
    kind = "set"
    set = { closed_expected_cash = "$self.expected_cash" }

[[model]]
name = "pos_order"
description = "A sale rung up at a point of sale"
read_group = "pos.user"
write_group = "pos.user"

  [model.ui]
  title = "{receipt_number}"
  subtitle = "{customer_id}"
  list = ["receipt_number", "ordered_on", "session_id", "customer_id", "total", "state"]
  card = ["receipt_number", "customer_id", "ordered_on", "total"]
  card_sum = "total"
  order = "ordered_on desc, receipt_number desc"
  default_view = "list"
  menu = "main"
  menu_order = 2
  report = { rows = "session_id", cols = "state", measure = "total" }

  [[model.child]]
  model = "pos_payment"
  via = "order_id"
  shape = "lines"

  [model.guard]
  immutable_when = ["paid", "refunded", "cancelled"]
  mutable_fields = ["note"]
  exit_to = ["refunded"]
  message = "A paid, refunded or cancelled sale cannot be changed. Refund it to reverse it."

  [[model.field]]
  name = "session_id"
  description = "The session the sale was made in; the one open session unless given"
  class = "none"
  kind = "ref"
  to = "pos_session"
  required = true
  default = "$open:pos_session"
  ref_filter = "state = open"

  [[model.field]]
  name = "receipt_number"
  description = "Number printed on the receipt, such as R-2026-000042: a gapless series that starts again each year, assigned when the sale is created"
  class = "none"
  kind = "sequence"
  format = "R-{year}-{seq:06}"
  gapless = true
  reset = "year"

  [[model.field]]
  name = "stock_location_id"
  description = "Where the goods leave stock; paying creates the stock moves from this location; the session's stock location unless given"
  class = "none"
  kind = "ref"
  to = "inventory_location"
  fill_from = "session_id.stock_location_id"

  [[model.field]]
  name = "ordered_on"
  description = "Day of the sale (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  default = "today"

  [[model.field]]
  name = "customer_id"
  description = "The customer, when one was identified"
  class = "none"
  kind = "ref"
  to = "party"

  [[model.field]]
  name = "tax_total"
  description = "Tax included in the total (minor currency units)"
  class = "none"
  kind = "money"

  [[model.field]]
  name = "total"
  description = "Total paid by the customer including tax: the sum of the line subtotals (minor currency units)"
  class = "none"
  kind = "money"
  computed = "sum(lines.subtotal)"

  [[model.field]]
  name = "cash_paid"
  description = "The part of the payments made in cash (minor currency units)"
  class = "financial"
  kind = "money"
  computed = 'sum(pos_payment.amount where method == "cash")'

  [[model.field]]
  name = "refund_session_id"
  description = "The session whose drawer paid out the cash of a refund, set by the server when a sale of a closed session is refunded: the session open at the sale's till then; empty when the sale's own session was still open"
  class = "none"
  kind = "ref"
  to = "pos_session"
  readonly = true

  [[model.field]]
  name = "note"
  description = "Remark about the sale"
  class = "none"
  kind = "longtext"

  [[model.field]]
  name = "state"
  description = "Sale status: draft, paid, refunded, cancelled"
  class = "none"
  kind = "select"
  options = ["draft", "paid", "refunded", "cancelled"]
  required = true
  [model.field.ui]
  tones = { draft = "info", paid = "ok", refunded = "warn", cancelled = "neutral" }

  [[model.action]]
  name = "pay"
  description = "The sale is fully paid: refused until the payments cover the total; creates a draft stock move per line (needs the inventory.user group)"
  field = "state"
  from = "draft"
  to = "paid"
  assert = [{ expr = "sum(pos_payment.amount) >= total", message = "The payments do not cover the total of the sale: add a payment for the rest", key = "covered" }]
  [model.action.ui]
  primary = true
  done = "Sale paid"

    [[model.action.effect]]
    kind = "create"
    model = "inventory_move"
    for_each = "lines"
    when = "is_set(stock_location_id)"
    map = { product_id = "$line.product_id", from_location_id = "$self.stock_location_id", quantity = "$line.quantity", scheduled_on = "$self.ordered_on" }

  [[model.action]]
  name = "cancel"
  description = "Cancel a sale that was never paid"
  field = "state"
  from = "draft"
  to = "cancelled"
  [model.action.ui]
  danger = true
  confirm = "Cancel this sale? It keeps its receipt number and cannot be changed afterwards."

  [[model.action]]
  name = "refund"
  description = "Refund a paid sale to the customer (manager only)"
  field = "state"
  from = "paid"
  to = "refunded"
  group = "pos.manager"
  approval = true
  [model.action.ui]
  danger = true
  confirm = "Refund this sale to the customer?"
  done = "Sale refunded"

[[model]]
name = "pos_order_line"
description = "One product line of a sale"
read_group = "pos.user"
write_group = "pos.user"

  [model.ui]
  title = "{product_id} × {quantity}"
  list = ["product_id", "description", "quantity", "unit_price", "discount_bp", "subtotal"]
  quick_create = ["product_id", "quantity"]
  menu = "hidden"

  [model.guard]
  children_of = "order_id"
  message = "The lines of a paid, refunded or cancelled sale cannot be changed."

  [[model.field]]
  name = "order_id"
  description = "The sale the line belongs to"
  class = "none"
  kind = "ref"
  to = "pos_order"
  required = true

  [[model.field]]
  name = "product_id"
  description = "The product sold"
  class = "none"
  kind = "ref"
  to = "product"
  required = true

  [[model.field]]
  name = "description"
  description = "Text shown on the receipt; the product's name unless given"
  class = "none"
  fill_from = "product_id.name"

  [[model.field]]
  name = "quantity"
  description = "Units sold"
  class = "none"
  kind = "number"
  required = true

  [[model.field]]
  name = "unit_price"
  description = "Price per unit including tax (minor currency units); the product's list price unless given"
  class = "none"
  kind = "money"
  required = true
  fill_from = "product_id.list_price_minor"
  [model.field.ui]
  aggregate = "none"

  [[model.field]]
  name = "discount_bp"
  description = "Discount in basis points: 1000 means 10.00 percent"
  class = "none"
  kind = "number"
  [model.field.ui]
  display = "percent_bp"
  aggregate = "none"

  [[model.field]]
  name = "subtotal"
  description = "Line total after discount: quantity times unit price, less the discount (minor currency units)"
  class = "none"
  kind = "money"
  computed = "quantity * unit_price * (10000 - discount_bp) / 10000"

[[model]]
name = "pos_payment"
description = "A payment received against a sale; a sale may be paid with several methods"
read_group = "pos.user"
write_group = "pos.user"

  [model.ui]
  title = "{method} · {amount}"
  list = ["method", "amount", "paid_on", "provider_reference"]
  quick_create = ["method", "amount"]
  menu = "hidden"

  [model.guard]
  children_of = "order_id"
  message = "The payments of a paid, refunded or cancelled sale cannot be changed."

  [[model.field]]
  name = "order_id"
  description = "The sale the payment is for"
  class = "none"
  kind = "ref"
  to = "pos_order"
  required = true

  [[model.field]]
  name = "method"
  description = "How the customer paid: cash, card, bank_transfer, voucher, other"
  class = "none"
  kind = "select"
  options = ["cash", "card", "bank_transfer", "voucher", "other"]
  required = true

  [[model.field]]
  name = "amount"
  description = "Amount paid with this method (minor currency units)"
  class = "financial"
  kind = "money"
  required = true

  [[model.field]]
  name = "paid_on"
  description = "Day of the payment (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  default = "today"

  [[model.field]]
  name = "provider_reference"
  description = "Reference from the card terminal or payment provider; never a card number"
  class = "financial"
  personal_data = true

[[migration]]
from = "<0.6.0"
op = "rename_field"
model = "pos_session"
field = "expected_cash"
to = "closed_expected_cash"
description = "The expected cash entered when a session closed is kept as the figure the closed session is read with; the expected cash is computed from now on"
