[module]
id = "timesheets"
version = "0.3.0"
name = "Timesheets"
description = "Time spent on project tasks, entered in minutes, with a billable flag and an approval step. Needs the Projects package. A worker sees and edits only their own entries; timesheets.manager sees all."
author = "SpaceCorps"
summary = "Time spent on project tasks in minutes, with a billable flag and an approval step."
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["timesheets", "time-tracking", "billable"]
categories = ["services"]
maturity = "beta"
requires_core = "^0.2"

[module.dependencies]
projects = ">=0.3, <1"

[[model]]
name = "timesheets_entry"
description = "Time one person spent on one task on one day"
read_group = "timesheets.user"
write_group = "timesheets.user"

  [model.access]
  own = "worker"
  see_all_group = "timesheets.manager"

  [[model.field]]
  name = "task_id"
  description = "The task worked on"
  class = "none"
  kind = "ref"
  to = "projects_task"
  required = true

  [[model.field]]
  name = "worker"
  description = "User name of the person who did the work; the person who creates the entry unless set otherwise"
  class = "internal"
  personal_data = true
  required = true

  [[model.field]]
  name = "worked_on"
  description = "Day the work was done (YYYY-MM-DD)"
  class = "none"
  kind = "date"
  required = true

  [[model.field]]
  name = "minutes"
  description = "Time spent, in minutes"
  class = "none"
  kind = "number"
  required = true

  [[model.field]]
  name = "billable"
  description = "Whether the time can be charged to the customer"
  class = "none"
  kind = "bool"

  [[model.field]]
  name = "description"
  description = "What was done"
  class = "none"

  [[model.field]]
  name = "cost_rate"
  description = "Internal hourly cost of the worker at the time of entry (minor currency units, e.g. cents)"
  class = "financial"
  personal_data = true
  kind = "money"
  group = "timesheets.cost_viewer"

  [[model.field]]
  name = "state"
  description = "Entry status: draft, submitted, approved"
  class = "none"
  kind = "select"
  options = ["draft", "submitted", "approved"]
  required = true

  [[model.action]]
  name = "submit"
  description = "Submit the entry for approval"
  field = "state"
  from = "draft"
  to = "submitted"

  [[model.action]]
  name = "approve"
  description = "Approve a submitted entry so it can be billed (manager only)"
  field = "state"
  from = "submitted"
  to = "approved"
  group = "timesheets.manager"

  [[model.action]]
  name = "reject"
  description = "Send a submitted entry back to draft (manager only)"
  field = "state"
  from = "submitted"
  to = "draft"
  group = "timesheets.manager"
