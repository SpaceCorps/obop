# Builds the root Dockerfile once and publishes it to GitHub Container Registry, so a customer
# instance starts from a finished image instead of compiling the Rust workspace on the shared
# server (B6, D59; docs/DEPLOY.md "The published image"). Tags: the commit (what the control plane
# deploys), and the branch (`main` or `deploy`) for people who just want the newest.
#
# linux/amd64 only. An arm64 image built under emulation takes hours; when it is wanted, add a
# matrix job on a native arm64 runner and merge the two with `docker buildx imagetools create`.
#
# Actions are pinned by commit SHA (docs/ENGINEERING.md 2.3), each at a release older than the
# pin policy's three weeks.
name: image
on:
  push:
    branches: [main, deploy]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Only the two branches have a tag to publish under.
    if: github.ref_name == 'main' || github.ref_name == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/spacecorps/obop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # What `obop --version` reports after the version: the image has no .git to read it from.
          build-args: |
            OBOP_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          # BuildKit layer cache in the Actions cache: the dependency layer (cargo-chef) and the
          # web build are rebuilt only when their inputs change.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance and an SBOM attached to the image as attestations.
          provenance: mode=max
          sbom: true
      - name: The pushed image starts and reports the commit it was built from
        run: |
          sha="${{ github.sha }}"
          line=$(docker run --rm "$IMAGE:$sha" obop --version)
          echo "$line"
          # `obop <core version> (<first 12 digits of the commit>)`
          echo "$line" | grep -Eq "^obop [0-9][^ ]* \(${sha:0:12}\)$"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "image: $IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
