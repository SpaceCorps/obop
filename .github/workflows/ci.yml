# One required check: every job must pass. Actions are pinned by commit SHA (docs/ENGINEERING.md 2.3).
name: ci
on:
  push:
    branches: [main, deploy]
  pull_request:
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: obop-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OBOP_TEST_POSTGRES_URL: postgres://postgres:obop-test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Install gate over every linked module
        run: cargo run --locked -q -- modules check
      - name: "Restore drill (B4, D73): back up a PostgreSQL database sealed and plain, restore each into a scratch one, check the copy, serve it"
        env:
          DRILL_ADMIN_URL: postgres://postgres:obop-test@127.0.0.1:5432/postgres
          OBOP: target/debug/obop
          OBOP_SECRET_KEY: "0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f"
          OBOP_REQUIRE_MFA_FOR_ADMINS: "0"
        run: |
          src=postgres://postgres:obop-test@127.0.0.1:5432/drill_src
          psql "$DRILL_ADMIN_URL" -c "CREATE DATABASE drill_src"
          echo "ci drill password 12" | "$OBOP" admin create ada --all-groups --db "$src"
          # With a key the backup is format 2 (sealed, .obbk); --plain writes format 1.
          "$OBOP" backup --db "$src" --out "$RUNNER_TEMP/sealed" --encrypted
          "$OBOP" backup --db "$src" --out "$RUNNER_TEMP/plain" --plain
          # The sealed drill is recorded (after its server step) in the source database.
          DRILL_RECORD_IN="$src" deploy/restore-drill.sh "$RUNNER_TEMP"/sealed/*.obbk
          "$OBOP" storage show --db "$src" | grep -q "passed"
          # A plain backup where a key is configured is refused (4) unless the operator vouches.
          set +e
          deploy/restore-drill.sh "$RUNNER_TEMP"/plain/*.jsonl.gz
          code=$?
          set -e
          test "$code" = 4
          DRILL_ALLOW_PLAIN=1 deploy/restore-drill.sh "$RUNNER_TEMP"/plain/*.jsonl.gz
          # Failure injection: the wrong key must fail the drill with the stable code (3).
          set +e
          OBOP_SECRET_KEY="1111111111111111111111111111111111111111111111111111111111111111" deploy/restore-drill.sh "$RUNNER_TEMP"/sealed/*.obbk
          code=$?
          set -e
          test "$code" = 3
          # A corrupt copy must fail it too.
          cp "$RUNNER_TEMP"/sealed/*.obbk "$RUNNER_TEMP/bad.obbk"
          cp "$RUNNER_TEMP"/sealed/*.obbk.manifest.json "$RUNNER_TEMP/bad.obbk.manifest.json"
          orig=$(od -An -tu1 -j200 -N1 "$RUNNER_TEMP/bad.obbk" | tr -d ' ')
          printf "\\$(printf '%03o' $(( (orig + 1) % 256 )))" | dd of="$RUNNER_TEMP/bad.obbk" bs=1 seek=200 conv=notrunc 2>/dev/null
          if deploy/restore-drill.sh "$RUNNER_TEMP/bad.obbk"; then echo "a corrupt backup passed the drill"; exit 1; fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.21.2
      - run: vp install --frozen-lockfile
      - name: The generated client types are current (regenerate from openapi.json, fail on any difference)
        run: |
          (cd web/packages/client && vp run generate:types)
          git diff --exit-code -- web/packages/client
      - name: Check, lint and type-check every app and the design system
        run: |
          for app in apps/backoffice apps/platform apps/site apps/mileage-app packages/client packages/trip-core packages/ui; do
            (cd web/$app && vp check)
          done
      - name: Unit tests (design system, client, trip logic and back office)
        run: |
          for app in packages/ui packages/client packages/trip-core apps/backoffice; do
            (cd web/$app && vp test)
          done
      - name: Build every app and the shared packages
        run: |
          for app in backoffice platform site; do
            (cd web/apps/$app && vp build)
          done
          for pkg in client trip-core; do
            (cd web/packages/$pkg && vp build)
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.21.2
      - run: vp install --frozen-lockfile
      - name: Build the binary under test
        run: cargo build --locked
      - name: The client against a running instance (obop serve on a free port, a throwaway database)
        run: cd web/packages/client && OBOP_BIN="$GITHUB_WORKSPACE/target/debug/obop" vp test integration
      - name: Build the apps and assemble the site
        run: |
          (cd web/apps/backoffice && vp build)
          (cd web/apps/backoffice && OBOP_ADMIN_BASE=/admin/ vp build --outDir dist-admin)
          deploy/build-site.sh
      - name: Check the e2e package
        run: cd web/packages/e2e && vp check && vp run typecheck
      - name: Install Chromium
        run: cd web/packages/e2e && vp exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: cd web/packages/e2e && vp run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: |
            web/packages/e2e/playwright-report
            web/packages/e2e/test-results
          retention-days: 7

  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Only pnpm-lock.yaml may exist (CLAUDE.md, F2)
        run: |
          bad=$(git ls-files | grep -E '(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|bun\.lockb?)$' || true)
          if [ -n "$bad" ]; then echo "forbidden lockfiles:"; echo "$bad"; exit 1; fi

  all:
    if: always()
    needs: [rust, web, e2e, lockfiles]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.rust.result }}" = success && test "${{ needs.web.result }}" = success && test "${{ needs.e2e.result }}" = success && test "${{ needs.lockfiles.result }}" = success
