# Snapshot of crates/modules/base/src/lib.rs (built-in, not removable). Keep in sync by hand.
[module]
id = "base"
version = "0.2.1"
name = "Contacts"
description = "People and organisations the business deals with: the shared party record that CRM, Sales and Invoicing refer to."
summary = "Contacts and companies: the people and organisations the business deals with."
author = "SpaceCorps"
license = "Apache-2.0"
homepage = "https://github.com/SpaceCorps/obop"
repository = "https://github.com/SpaceCorps/obop"
keywords = ["contacts", "people", "companies", "gdpr"]
categories = ["platform", "sales"]
maturity = "stable"
requires_core = "^0.2"

[[model]]
name = "party"
description = "A person or organisation the business deals with"
read_group = "base.user"
write_group = "base.user"

[[model.field]]
name = "name"
description = "Display name"
class = "public_directory"
personal_data = true
required = true

[[model.field]]
name = "email"
description = "Work email address"
class = "public_directory"
personal_data = true

[[model.field]]
name = "tax_id"
description = "Tax identifier of a natural person"
class = "financial"
personal_data = true

[[model.field]]
name = "notes"
description = "Free-text internal notes"
class = "internal"
personal_data = true
kind = "longtext"

[[model.action]]
name = "erase"
description = "Anonymise the party in place and record the erasure"
group = "privacy.officer"
approval = true
