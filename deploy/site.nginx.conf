# The obop website served as files and nothing else: no API, no sign-up, no forum, no accounts.
#
# This is the server of deploy/site.Dockerfile. It does for the static files what
# crates/kernel/obop-http/src/website.rs does inside a control plane, so the website behaves the
# same either way (docs/site/SITE.md "Server requirements", docs/site/AGENT-READINESS.md):
#   - an unknown path answers 404 with the body of /404.html, never a soft 404;
#   - /docs/x redirects (301) to /docs/x/ when that is a directory with an index.html;
#   - `Accept: text/markdown` on a page address gets the page's Markdown mirror
#     (/docs/x/ -> /docs/x.md, / -> /index.md, /de/ -> /de/index.md), with `Vary: Accept`;
#   - Markdown, text and XML files carry a charset; fingerprinted assets and fonts are cached for a
#     year, pages are revalidated; nosniff; gzip for text; GET and HEAD only.
# Sliplane terminates TLS and forwards plain HTTP to port 8080, so redirects stay relative.

# Markdown wanted: text/markdown is listed, and text/html is not listed before it.
map $http_accept $want_markdown {
    default 0;
    "~*^(?!.*text/html.*text/markdown).*text/markdown" 1;
}

# The address of a page (no file extension) while Markdown is wanted; "-" means serve the page.
map "$want_markdown:$uri" $md_stem {
    default "-";
    "~^1:(?<stem>(?:/[^/.]+)*)/?$" $stem;
}

map "$status $uri" $cache_control {
    default "public, max-age=300, must-revalidate";
    "~^[45]" "no-store";
    "~^200 /(assets|fonts)/" "public, max-age=31536000, immutable";
}

# Pages (and their Markdown mirrors) differ by Accept; files do not.
map $uri $vary_accept {
    default "";
    "~^/[^.]*$" "Accept";
    "~\.(html|md)$" "Accept";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;

    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }
    charset utf-8;
    charset_types text/plain text/css text/xml text/markdown application/xml application/json application/javascript image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/markdown image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control $cache_control always;
    add_header Vary $vary_accept always;

    error_page 404 /404.html;

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Allow "GET, HEAD" always;
            return 405;
        }
        try_files "$md_stem.md" "$md_stem/index.md" $uri $uri/ =404;
    }
}
